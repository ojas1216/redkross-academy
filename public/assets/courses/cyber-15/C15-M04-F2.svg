<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 343" width="1000" height="343" role="img" aria-label="A decision list mapping four situations to a hash, HMAC or AEAD, a signature, or a hash delivered through a trusted channel."><title>Choosing an integrity mechanism</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M04-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Choosing an integrity mechanism</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="252" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="170.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Accidental corruption only?</text><line x1="304.0" y1="28.1" x2="334.0" y2="28.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="13.0625" width="123.0225" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="403.5" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Hash (SHA-256)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="252" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="170.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Attacker, shared secret?</text><line x1="304.0" y1="84.2" x2="334.0" y2="84.2" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="69.1875" width="205.53449999999998" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="444.8" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">HMAC (or AEAD if encrypting)</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="252" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="170.0" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Attacker, public verification?</text><line x1="304.0" y1="140.3" x2="334.0" y2="140.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="125.3125" width="183.813" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="433.9" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Digital signature over hash</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="252" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="170.0" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Checksum published separately?</text><line x1="304.0" y1="196.4" x2="334.0" y2="196.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="181.4375" width="254.70149999999998" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="469.4" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Hash + trusted channel (HTTPS, form)</text></g><text x="964" y="331" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>