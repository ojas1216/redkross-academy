<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 343" width="1000" height="343" role="img" aria-label="A horizontal scale from 13 bits for a PIN to 256 bits for an AES-256 key, indicating that higher values are beyond brute force."><title>Entropy scale</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M01-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Entropy scale</text><g transform="translate(0,68)"><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#FCA5A5"/><stop offset="0.5" stop-color="#FCD34D"/><stop offset="1" stop-color="#86EFAC"/></linearGradient></defs><rect x="76" y="140" width="212" height="34" rx="8" fill="#FEF2F2" stroke="#F19A9A"/><text x="182.0" y="161.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">seconds to brute-force</text><rect x="288" y="140" width="212" height="34" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="394.0" y="161.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="700" fill="#7A3A06" text-anchor="middle">hours</text><rect x="500" y="140" width="424" height="34" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="712.0" y="161.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="700" fill="#14532D" text-anchor="middle">out of reach for classical brute force</text><rect x="76" y="66" width="848" height="8" rx="4" fill="url(#sg)"/><circle cx="76" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="76.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">13 bits</text><text x="76.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">PIN</text><circle cx="288" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="288.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">38 bits</text><text x="288.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">8 lowercase chars</text><circle cx="500" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="500.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">78 bits</text><text x="500.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">12 mixed chars</text><circle cx="712" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="712.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">128 bits</text><text x="712.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">random key</text><circle cx="924" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="924.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">256 bits</text><text x="924.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">AES-256 key</text><rect x="36" y="194" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="194" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="214.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Values from the execution-tested lab; time labels are qualitative.</text></g><text x="964" y="331" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>