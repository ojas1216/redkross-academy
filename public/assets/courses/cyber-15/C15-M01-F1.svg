<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 423" width="1000" height="423" role="img" aria-label="A two-column table mapping five security goals to the cryptographic primitives that provide them."><title>Goals and the primitives that provide them</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="422" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M01-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Goals and the primitives that provide them</text><g transform="translate(0,68)"><text x="109.8" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">SECURITY GOAL</text><text x="233.6" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="start">PRIMITIVE THAT PROVIDES IT</text><rect x="36" y="28" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="36" width="139.5843" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="113.8" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Confidentiality</text><line x1="191.6" y1="52.1" x2="221.6" y2="52.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="229.5843" y="37.0625" width="137.2785" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="298.2" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Encryption (AEAD)</text><rect x="374.8628" y="37.0625" width="147.80849999999998" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="448.8" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">KEM / key exchange</text><rect x="36" y="84.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="92.125" width="139.5843" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="113.8" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Integrity</text><line x1="191.6" y1="108.2" x2="221.6" y2="108.2" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="229.5843" y="93.1875" width="53.997" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="256.6" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">MAC</text><rect x="291.5813" y="93.1875" width="83.27850000000001" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="333.2" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">AEAD tag</text><rect x="382.85980000000006" y="93.1875" width="81.78" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="423.7" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Signature</text><rect x="36" y="140.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="148.25" width="139.5843" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="113.8" y="169.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Authenticity</text><line x1="191.6" y1="164.3" x2="221.6" y2="164.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="229.5843" y="149.3125" width="132.7695" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="296.0" y="169.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">MAC (shared key)</text><rect x="370.3538" y="149.3125" width="159.79649999999998" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="450.3" y="169.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Signature (private key)</text><rect x="36" y="196.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="204.375" width="139.5843" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="113.8" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Non-repudiation</text><line x1="191.6" y1="220.4" x2="221.6" y2="220.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="229.5843" y="205.4375" width="168.45" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="313.8" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Signature + key custody</text><rect x="36" y="252.5" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="260.5" width="139.5843" height="32.125" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="113.8" y="281.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1E293B" text-anchor="middle">Forward secrecy</text><line x1="191.6" y1="276.6" x2="221.6" y2="276.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="229.5843" y="261.5625" width="176.32049999999998" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/><text x="317.7" y="281.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Ephemeral key exchange</text></g><text x="964" y="411" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>