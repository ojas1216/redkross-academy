<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 513" width="1000" height="513" role="img" aria-label="A two-party exchange where the client sends a hello with key shares, the server replies with its key share and an encrypted certificate, signature and finished message, the client verifies and finishes, and encrypted application data follows."><title>TLS 1.3 handshake (1-RTT)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="512" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M06-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">TLS 1.3 handshake (1-RTT)</text><g transform="translate(0,68)"><line x1="268" y1="52.75" x2="268" y2="346.75" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="158" y="6" width="220" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="268.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Client</text><line x1="732" y1="52.75" x2="732" y2="346.75" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="622" y="6" width="220" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="732.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Server</text><line x1="272.0" y1="86.8" x2="726.0" y2="86.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="78.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">ClientHello: versions, suites, key_share X25519, SNI</text><circle cx="268" cy="86.75" r="9" fill="#EA6A0A"/><text x="268.0" y="90.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="728.0" y1="140.8" x2="274.0" y2="140.8" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="132.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">ServerHello: key_share → ECDHE secret → HKDF keys</text><circle cx="732" cy="140.75" r="9" fill="#EA6A0A"/><text x="732.0" y="144.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="728.0" y1="194.8" x2="274.0" y2="194.8" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="186.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">{EncryptedExtensions, Certificate, CertificateVerify, Finished} (encrypted)</text><circle cx="732" cy="194.75" r="9" fill="#EA6A0A"/><text x="732.0" y="198.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="272.0" y1="248.8" x2="726.0" y2="248.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="240.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">{Finished} after verifying chain + hostname + signature</text><circle cx="268" cy="248.75" r="9" fill="#EA6A0A"/><text x="268.0" y="252.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="272.0" y1="302.8" x2="726.0" y2="302.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="294.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Application data, AEAD-protected, in both directions</text><circle cx="268" cy="302.75" r="9" fill="#EA6A0A"/><text x="268.0" y="306.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="36" y="364.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="364.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="385.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">TLS 1.3 completes the handshake in one round trip (1-RTT).</text></g><text x="964" y="501" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>