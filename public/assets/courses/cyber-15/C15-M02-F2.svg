<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" width="1000" height="524" role="img" aria-label="A box receiving a key, nonce, associated data and plaintext, producing ciphertext and a tag; decryption returns plaintext only if nothing changed."><title>AEAD inputs and outputs</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="523" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M02-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">AEAD inputs and outputs</text><g transform="translate(0,68)"><g transform="translate(121.8,4) scale(1.000)"><path d="M222.0,35.4 L232.0,35.4 L232.0,98.6 L278.0,98.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,116.1 L278.0,116.1" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,216.1 L232.0,216.1 L232.0,133.7 L278.0,133.7" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,316.1 L242.0,316.1 L242.0,151.2 L278.0,151.2" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M488.0,124.9 L544.0,124.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="102" y="12" width="120" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="162.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Key</text><rect x="102" y="92.75" width="120" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="162.0" y="121.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Nonce</text><rect x="12" y="173.5" width="210" height="85.25" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="117.0" y="201.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">AAD</text><text x="117.0" y="226.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">associated data (authenticated,</text><text x="117.0" y="242.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">not encrypted)</text><rect x="102" y="292.75" width="120" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="162.0" y="321.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Plaintext</text><rect x="278" y="81.025" width="210" height="87.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="383.0" y="109.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">AES-GCM /</text><text x="383.0" y="128.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">ChaCha20-Poly1305</text><text x="383.0" y="152.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">encrypt + authenticate</text><rect x="544" y="101.525" width="200.3844" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="644.2" y="129.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Ciphertext ‖ 16-byte tag</text></g><rect x="36" y="375.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="375.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="396.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Decrypt with the same key, nonce and AAD to get the plaintext back; any change to any input raises InvalidTag.</text></g><text x="964" y="512" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>