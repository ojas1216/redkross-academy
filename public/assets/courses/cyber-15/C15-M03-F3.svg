<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-label="A client and server exchange ephemeral public keys, the server signs its share with its certificate key, the client verifies, and both derive session keys and discard ephemeral keys."><title>Authenticated ephemeral key exchange</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="391" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M03-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Authenticated ephemeral key exchange</text><g transform="translate(0,68)"><line x1="268" y1="75" x2="268" y2="207" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="158" y="6" width="220" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="268.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Client</text><text x="268.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ephemeral key c</text><line x1="732" y1="75" x2="732" y2="207" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="622" y="6" width="220" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="732.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Server</text><text x="732.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">ephemeral key s + certificate key</text><line x1="272.0" y1="109.0" x2="726.0" y2="109.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="101.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">c.pub</text><circle cx="268" cy="109" r="9" fill="#EA6A0A"/><text x="268.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="728.0" y1="163.0" x2="274.0" y2="163.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="155.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">s.pub + signature(s.pub…, certificate key)</text><circle cx="732" cy="163" r="9" fill="#EA6A0A"/><text x="732.0" y="167.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="36" y="225" width="928" height="54.45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="225" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="56.0" y="245.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The client verifies the signature with the certificate (Module 5). Both compute X25519(…) → HKDF(info) → session keys, then discard c and s, which</text><text x="56.0" y="263.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">gives forward secrecy.</text></g><text x="964" y="380" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>