<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 334" width="1000" height="334" role="img" aria-label="A file is encrypted with a data key, which is wrapped by a KMS key; both are stored together, and decryption requires the KMS to unwrap the data key."><title>Envelope encryption</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="333" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Envelope encryption</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.911)"><path d="M476.6,39.0 L751.2,39.0 L751.2,102.5 L797.2,102.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="532.5664999999999" y="12" width="208.592" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="636.9" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">AES-GCM with the DEK → ciphertext</text><path d="M150.4,130.9 L302.4,130.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="206.3875" y="137.875" width="40.004" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="226.4" y="151.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">wrap</text><path d="M476.6,130.9 L797.2,130.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="592.8485" y="137.875" width="88.02799999999999" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="636.9" y="151.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">wrapped DEK</text><rect x="356.56649999999996" y="15.625" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="416.6" y="43.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">File</text><rect x="12" y="96.375" width="138.3875" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="81.2" y="124.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">DEK</text><text x="81.2" y="149.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">data encryption key</text><rect x="302.39149999999995" y="96.375" width="174.175" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="389.5" y="124.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">KMS: KEK</text><text x="389.5" y="149.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">wrap: authorised + logged</text><rect x="797.1584999999999" y="74.04166666666666" width="210" height="85.25" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="902.2" y="102.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Stored together</text><text x="902.2" y="127.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">[wrapped DEK | key_id |</text><text x="902.2" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ciphertext]</text></g><rect x="36" y="185.50971610402115" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="185.50971610402115" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="206.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Decrypt: KMS unwraps the wrapped DEK → DEK → AES-GCM decrypt. The master key (KEK) never leaves the KMS.</text></g><text x="964" y="322" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>