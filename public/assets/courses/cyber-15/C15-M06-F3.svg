<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 367" width="1000" height="367" role="img" aria-label="A list of maximum validity periods decreasing from 398 days to 200, 100 and 47 days on specified dates, with a note to automate renewal."><title>Certificate validity reductions (SC-081v3)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="366" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M06-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Certificate validity reductions (SC-081v3)</text><g transform="translate(0,68)"><text x="36.0" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Maximum public TLS certificate validity (CA/B Forum SC-081v3)</text><text x="168.1" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Before Mar 2026</text><rect x="182.059" y="44" width="671.941" height="26" rx="6" fill="#F1F5F9"/><rect x="182.059" y="44" width="671.941" height="26" rx="6" fill="#94A3B8"/><text x="864.0" y="62.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start">398 days</text><text x="168.1" y="103.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">From 15 Mar 2026</text><rect x="182.059" y="86" width="671.941" height="26" rx="6" fill="#F1F5F9"/><rect x="182.059" y="86" width="337.6587939698492" height="26" rx="6" fill="#F59E4B"/><text x="529.7" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="start">200 days (in effect, Nov 2026)</text><text x="168.1" y="145.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">From 15 Mar 2027</text><rect x="182.059" y="128" width="671.941" height="26" rx="6" fill="#F1F5F9"/><rect x="182.059" y="128" width="168.8293969849246" height="26" rx="6" fill="#B3A2F0"/><text x="360.9" y="146.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#3B2A7A" text-anchor="start">100 days</text><text x="168.1" y="187.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">From 15 Mar 2029</text><rect x="182.059" y="170" width="671.941" height="26" rx="6" fill="#F1F5F9"/><rect x="182.059" y="170" width="79.34981658291457" height="26" rx="6" fill="#F19A9A"/><text x="271.4" y="188.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="start">47 days</text><rect x="36" y="218" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="218" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="238.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Automate issuance and renewal (ACME) and keep an inventory of every endpoint.</text></g><text x="964" y="355" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>