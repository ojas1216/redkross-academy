<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" role="img" aria-label="A passphrase and random salt feed scrypt to make a key; AES-256-GCM encrypts the plaintext with the header as associated data, producing header, ciphertext and tag."><title>rkcrypt encryption flow</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="363" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M08-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">rkcrypt encryption flow</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.835)"><path d="M132.0,35.4 L188.0,35.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M132.0,116.1 L142.0,116.1 L142.0,58.4 L188.0,58.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M335.4,46.9 L436.4,46.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M556.4,46.9 L611.4,46.9 L611.4,129.6 L657.4,129.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M601.4,146.9 L657.4,146.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M601.4,246.9 L611.4,246.9 L611.4,164.1 L657.4,164.1" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M833.7,146.9 L889.7,146.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="12" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="72.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Passphrase</text><rect x="12" y="92.75" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="72.0" y="121.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Random salt</text><rect x="188" y="12.375" width="147.39999999999998" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="261.7" y="40.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">scrypt</text><text x="261.7" y="65.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">N = 2^17, r = 8, p = 1</text><rect x="436.4" y="23.5" width="120" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="496.4" y="51.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">32-byte key</text><rect x="391.4" y="104.25" width="210" height="85.25" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="496.4" y="132.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Header (36 B)</text><text x="496.4" y="157.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">RKC1 | kdf | log2n | r | p | salt |</text><text x="496.4" y="173.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">nonce</text><rect x="481.4" y="223.5" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="541.4" y="251.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Plaintext</text><rect x="657.4" y="112.375" width="176.26250000000002" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="745.5" y="140.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">AES-256-GCM</text><text x="745.5" y="165.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">key, nonce, AAD = header</text><rect x="889.6625" y="112.375" width="210" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="994.7" y="140.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Output file</text><text x="994.7" y="165.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">header ‖ ciphertext ‖ 16-byte tag</text></g></g><text x="964" y="352" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>