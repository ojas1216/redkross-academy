<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 341" width="1000" height="341" role="img" aria-label="Equations showing two ciphertexts made with the same keystream, their XOR equalling the XOR of the plaintexts, and recovery of the second plaintext from the first."><title>Why nonce reuse breaks stream encryption</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M07-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Why nonce reuse breaks stream encryption</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="170.5" rx="10" fill="#0F172A" stroke="#F19A9A" stroke-width="1.5"/><rect x="36" y="4" width="928" height="32" rx="10" fill="#FEF2F2"/><rect x="36" y="26" width="928" height="10" fill="#FEF2F2"/><text x="50.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#7F1D1D" text-anchor="start">Nonce reuse in a stream cipher</text><text x="50" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">C1 = P1 XOR KS(key, nonce)</text><text x="50" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">C2 = P2 XOR KS(key, nonce)     (same nonce!)</text><text x="50" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">C1 XOR C2 = P1 XOR P2          (the keystream cancels)</text><text x="50" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">know P1  -&gt;  P2 = (C1 XOR C2) XOR P1</text><rect x="36" y="192.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="192.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="213.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The lab recovered P2 this way. Never reuse a nonce with the same key.</text></g><text x="964" y="329" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>