<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 605" width="1000" height="605" role="img" aria-label="A chain of checks on length, format, parameter bounds, key derivation and authenticated decryption, ending in an atomic write, with any failure producing a generic error and no partial file."><title>Decryption checks in order</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="604" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M08-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Decryption checks in order</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Length ≥ 36 + 16 bytes?</text><line x1="500.0" y1="57.8" x2="500.0" y2="81.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="84.75" width="560" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Magic / KDF id correct?</text><line x1="500.0" y1="134.5" x2="500.0" y2="158.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="161.5" width="560" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="189.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Parameters within bounds?</text><line x1="500.0" y1="211.3" x2="500.0" y2="235.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="238.25" width="560" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="266.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Derive the key</text><line x1="500.0" y1="288.0" x2="500.0" y2="312.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="315" width="560" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="343.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">AEAD decrypt with the header as AAD</text><line x1="500.0" y1="364.8" x2="500.0" y2="388.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="391.75" width="560" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="420.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">OK: write via a temp file + replace</text><rect x="36" y="456.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="456.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Any failure: a generic error, exit code 1 (authentication) or 2 (input), and no partial output.</text></g><text x="964" y="593" font-family="Helvetica, Arial, 'Liberation Sans', 