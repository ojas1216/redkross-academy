<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 343" width="1000" height="343" role="img" aria-label="Four situations mapped to nonce strategies: per-record keys with random nonces, rotation or extended or misuse-resistant modes for high volume, counters for a single writer, and deterministic nonces for signatures."><title>Nonce strategy decision</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C15-M07-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Nonce strategy decision</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="216.49578" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="152.2" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Per-record key (envelope)?</text><line x1="268.5" y1="28.1" x2="298.5" y2="28.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="306.49577999999997" y="13.0625" width="288.087" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="450.5" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Random nonce, reuse practically impossible</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="216.49578" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="152.2" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Shared key, high volume?</text><line x1="268.5" y1="84.2" x2="298.5" y2="84.2" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="306.49577999999997" y="69.1875" width="118.55399999999999" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="365.8" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Rotate by count</text><rect x="433.04977999999994" y="69.1875" width="116.286" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="491.2" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Or XChaCha20</text><rect x="557.3357799999999" y="69.1875" width="100.5045" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="607.6" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Or GCM-SIV</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="216.49578" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="152.2" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Single writer, durable state?</text><line x1="268.5" y1="140.3" x2="298.5" y2="140.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="306.49577999999997" y="125.3125" width="273.85799999999995" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="443.4" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Counter nonce (never restore/clone state)</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="216.49578" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="152.2" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Signatures (ECDSA)?</text><line x1="268.5" y1="196.4" x2="298.5" y2="196.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="306.49577999999997" y="181.4375" width="238.58249999999998" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="425.8" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">RFC 6979 deterministic or Ed25519</text></g><text x="964" y="331" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>