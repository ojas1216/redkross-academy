<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 311" width="1000" height="311" role="img" aria-label="Two bars comparing 17 of 19 for one vendor that passed critical items with 7 of 19 for one that failed two critical items, noting that critical failures override totals."><title>Scoring with critical items (lab)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="310" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C17-M07-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Scoring with critical items (lab)</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="66.25" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="252" height="50.25" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="170.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">RouteOpt #################</text><text x="170.0" y="51.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">17/19 critical OK</text><line x1="304.0" y1="37.1" x2="334.0" y2="37.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="22.125" width="74.274" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="379.1" y="42.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Approve</text><rect x="36" y="78.25" width="928" height="66.25" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="86.25" width="252" height="50.25" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="170.0" y="107.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">QuickPrint ####### 7/19 V2,V4</text><text x="170.0" y="125.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">FAIL</text><line x1="304.0" y1="111.4" x2="334.0" y2="111.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="96.375" width="126.033" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="405.0" y="116.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Reject/remediate</text><rect x="36" y="162.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="162.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="183.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rule: any critical fail overrides the total score</text></g><text x="964" y="299" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>