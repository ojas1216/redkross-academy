<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 297" width="1000" height="297" role="img" aria-label="A timeline showing the RPO before the disruption, the recovery period up to the RTO, and the MTD as the outer limit, with the rules RTO at most MTD and backup interval at most RPO."><title>MTD, RTO and RPO on a timeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="296" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C17-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">MTD, RTO and RPO on a timeline</text><g transform="translate(0,68)"><rect x="37" y="30" width="245.46666666666664" height="96" rx="6" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="159.7" y="65.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">RPO</text><text x="159.7" y="86.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">maximum data loss: last good data →</text><text x="159.7" y="100.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">disruption</text><text x="159.7" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">before t0</text><rect x="284.46666666666664" y="30" width="451.6888888888889" height="96" rx="6" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="510.3" y="72.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Recovery</text><text x="510.3" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">disruption (t0) → service back = RTO</text><text x="510.3" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">t0 → RTO</text><rect x="738.1555555555556" y="30" width="224.84444444444446" height="96" rx="6" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="850.6" y="72.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">Margin</text><text x="850.6" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">RTO → MTD (the absolute limit)</text><text x="850.6" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">→ MTD</text><rect x="36" y="148" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="148" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="168.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rules: RTO ≤ MTD; the backup / replication interval ≤ RPO.</text></g><text x="964" y="285" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>