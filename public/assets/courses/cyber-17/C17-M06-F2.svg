<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 413" width="1000" height="413" role="img" aria-label="Three bars showing a population with four exceptions, a sample that found none, and a full test that found all four."><title>Sample versus full population (lab)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="412" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C17-M06-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Sample versus full population (lab)</text><g transform="translate(0,68)"><text x="36.0" y="30.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Population of 240 (exceptions)</text><line x1="253.28517" y1="38" x2="964" y2="38" stroke="#CBD5E1" stroke-width="2"/><rect x="321.9" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="485.3" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="648.8" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="862.0" y="22" width="5" height="32" rx="2" fill="#DC2626"/><text x="253.3" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#7F1D1D" text-anchor="start">4 exceptions in the full population</text><text x="36.0" y="112.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Sample of 25</text><line x1="253.28517" y1="120" x2="964" y2="120" stroke="#CBD5E1" stroke-width="2"/><rect x="272.1" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="307.6" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="336.1" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="357.4" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="392.9" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="428.5" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="464.0" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="506.6" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="549.3" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="584.8" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="620.4" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="677.2" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="712.7" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="748.3" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="776.7" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="805.1" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="833.6" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="890.4" y="104" width="5" height="32" rx="2" fill="#475569"/><rect x="926.0" y="104" width="5" height="32" rx="2" fill="#475569"/><text x="253.3" y="156.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#1E293B" text-anchor="start">the sample happened to miss all 4: 0 found</text><text x="36.0" y="194.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Full test</text><line x1="253.28517" y1="202" x2="964" y2="202" stroke="#CBD5E1" stroke-width="2"/><rect x="321.9" y="186" width="5" height="32" rx="2" fill="#16A34A"/><rect x="485.3" y="186" width="5" height="32" rx="2" fill="#16A34A"/><rect x="648.8" y="186" width="5" height="32" rx="2" fill="#16A34A"/><rect x="862.0" y="186" width="5" height="32" rx="2" fill="#16A34A"/><text x="253.3" y="238.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#14532D" text-anchor="start">every item checked: 4 found</text><rect x="36" y="264" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="264" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="284.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Where a full-population test is possible (e.g. with scripts), it beats sampling.</text></g><text x="964" y="401" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>