<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" role="img" aria-label="A left-to-right pipeline from source through collection, encrypted transport, parsing and normalisation, hot and cold storage, with a note on health checks."><title>Collection pipeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="671" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Collection pipeline</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Source</text><line x1="500.0" y1="57.8" x2="500.0" y2="81.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="84.75" width="560" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Agent / syslog / API</text><line x1="500.0" y1="134.5" x2="500.0" y2="158.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="161.5" width="560" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="189.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Encrypted, buffered transport</text><line x1="500.0" y1="211.3" x2="500.0" y2="235.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="238.25" width="560" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="266.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Parse + normalise</text><text x="500.0" y="291.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">timestamps to UTC</text><line x1="500.0" y1="310.3" x2="500.0" y2="334.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="337.25" width="560" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="365.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Hot store</text><text x="500.0" y="390.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">search</text><line x1="500.0" y1="409.3" x2="500.0" y2="433.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="436.25" width="560" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="464.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Cold store</text><text x="500.0" y="489.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">retention 180+ days</text><rect x="36" y="523.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="523.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="543.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Health checks at every stage: is a source silent? is the queue backing up? are there parse errors?</text></g><text x="964" y="660" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>