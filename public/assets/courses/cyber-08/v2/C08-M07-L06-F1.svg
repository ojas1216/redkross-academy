<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1172" width="1000" height="1172" role="img" aria-label="Decision graph, top to bottom. A slate box, Behaviour in the threat model, leads to a violet decision: Telemetry collected? No leads to a red box, Data-source gap (new telemetry: infrastructure owner). Yes leads to: Fields parsed, all hosts and hours? No leads to an orange box, Field or scope gap (fix the pipeline or rollout). Yes leads to: Rule looks for it? No leads to an orange box, Logic gap (write a rule: detection engineering). Yes leads to: Tested: known-bad and near miss? No leads to a slate box, Untested coverage (add tests, Lesson 4). Yes leads to a green box, Covered, with evidence."><title>Classifying a coverage gap by the first condition it fails</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1171" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L06-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Classifying a coverage gap by the first condition it fails</text><g transform="translate(0,68)"><g transform="translate(181.8,4) scale(1.000)"><path d="M380.0,81.0 L380.0,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M350.6,183.8 L350.6,193.8 L124.6,193.8 L124.6,315.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="91.256" y="239.75" width="27.344" hei