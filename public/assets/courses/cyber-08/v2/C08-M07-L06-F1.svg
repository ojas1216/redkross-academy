" fill="#3B2A7A" text-anchor="middle">Tested: known-bad and near miss?</text><rect x="231.62339999999995" y="918.75" width="163.44870000000003" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="313.3" y="947.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Untested coverage</text><text x="313.3" y="971.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">add tests (Lesson 4)</text><rect x="429.0721" y="918.75" width="195.2487" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="526.7" y="947.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Covered, with evidence</text></g><rect x="36" y="1023.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="1023.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="1044.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The first failed condition names the gap&#39;s owner and the kind of fix.</text></g><text x="964" y="1160" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>