<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1119" width="1000" height="1119" role="img" aria-label="Decision graph. Indicator match (value in our logs equals a feed value) leads to the decision Indicator current? (within valid_until, not stale). No leads to No automatic action (history and enrichment only); a dashed arrow labelled still review the events goes from there to the decision Events fit the context?. Yes leads to the decision Shared infrastructure? (cloud, CDN, hosting, VPN, Tor). Yes leads to Seek corroboration (a different kind of evidence), which leads to Events fit the context?; no leads directly to Events fit the context? (user, host, time, behaviour). From that decision, yes leads to Act proportionately (alert, hunt, block via change control) and no leads to Record collateral match (report to the producer)."><title>Weighing an indicator match: three questions before action</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1118" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L06-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Weighing an indicator match: three questions before action</text><g transform="translate(0,68)"><g transform="translate(250.3,4) scale(1.000)"><path d="M342.0,81.0 L342.0,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M312.8,206.0 L312.8,216.0 L146.0,216.0 L146.0,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="112.69200000000001" y="262" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="126.4" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M371.2,206.0 L371.2,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="378.20475" y="262" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="394.5" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M338.0,407.0 L338.0,417.0 L304.8,417.0 L304.8,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="266.089" y="463" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="282.4" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M404.5,407.0 L404.5,664.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="371.11075" y="463" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="384.8" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M304.8,608.0 L304.8,618.0 L357.8,618.0 L357.8,664.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M146.0,407.0 L146.0,628.0 L311.2,628.0 L311.2,664.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="12" y="463" width="128.036" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="76.0" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">still review the events</text><path d="M326.8,733.0 L326.8,743.