="146.0" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">history and enrichment only</text><rect x="271.45475" y="338" width="199.5" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="371.2" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Shared infrastructure?</text><text x="371.2" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">cloud, CDN, hosting, VPN, Tor</text><rect x="215.06724999999997" y="539" width="179.38750000000002" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="304.8" y="567.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Seek corroboration</text><text x="304.8" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">a different kind of evidence</text><rect x="264.62467499999997" y="664" width="186.44010000000003" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="357.8" y="692.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Events fit the context?</text><text x="357.8" y="717.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">user, host, time, behaviour</text><rect x="290.419225" y="865" width="196.99770000000004" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="388.9" y="893.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Record collateral match</text><text x="388.9" y="918.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">report to the producer</text><rect x="29.794224999999983" y="865" width="226.625" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="143.1" y="893.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Act proportionately</text><text x="143.1" y="918.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">alert, hunt, block via change control</text></g><rect x="36" y="970" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="970" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="990.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">In the lab, 198.51.100.104 ends at Record collateral match; 203.0.113.66 on 3 November ends at Act proportionately.</text></g><text x="964" y="1107" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>