<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 739" width="1000" height="739" role="img" aria-label="Top-to-bottom flow of six steps. Score each alert: severity x confidence x criticality. Deduplicate and group by entity: host, account, source address. Entity risk: WS-104 6 alerts, gopal 1. Adjust for time: waiting time, SLA deadline. Adjust for context: campaign intel, account privilege, live access. Analyst takes the next case: override allowed, with a recorded reason. Note under the flow: analysts&#39; dispositions update rule confidence, which changes next week&#39;s scores."><title>From scored alerts to the next case an analyst works</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="738" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L02-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">From scored alerts to the next case an analyst works</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Score each alert</text><text x="500.0" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">severity x confidence x criticality</tex