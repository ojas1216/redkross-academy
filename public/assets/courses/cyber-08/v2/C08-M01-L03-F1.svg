<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1008" width="1000" height="1008" role="img" aria-label="Graph diagram. Generated leads to Queued and prioritised, then Triage, then Investigate, then a decision Disposition?. Triage can also lead straight to the decision. The decision branches to True positive, which leads to Escalate to incident response; Benign true positive, which leads to Close with documented reason; False positive, which leads to Close and tune the rule; and Undetermined, which leads to Monitor and record the gap. All four actions lead to Closure record. A dashed Feedback arrow runs from Closure record back to Generated."><title>The alert lifecycle: from detection to feedback</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1007" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-L03-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The alert lifecycle: from detection to feedback</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.835)"><path d="M975.4,81.0 L975.4,91.0 L645.2,91.0 L645.2,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M645.2,206.0 L645.2,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M619.2,331.0 L619.2,341.0 L437.5,341.0 L437.5,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M671.2,331.0 L671.2,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="567.7920499999999" y="411.5" width="97.364" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="616.5" y="425.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">obvious answer</text><path d="M437.5,456.0 L437.5,466.0 L631.2,466.0 L631.2,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M615.2,558.8 L615.2,568.8 L130.8,568.8 L130.8,690.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="95.50689999999997" y="614.75" width="29.336" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="110.2" y="628.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">TP</text><path d="M639.2,558.8 L639.2,578.8 L407.8,578.8 L407.8,690.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="364.48339999999996" y="614.75" width="37.34" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="383.2" y="628.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">BTP</text><path d="M663.2,558.8 L663.2,690.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="627.8200499999998" y="614.75" width="29.336" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="642.5" y="628.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">FP</text><path d="M687.2,558.8 L687.2,568.8 L904.8,568.8 L904.8,690.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="811.4307999999999" y="614.75" width="87.368" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="855.1" y="628.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">undetermined</text><path d="M130.8,737.5 L130.8,793.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M407.8,737.5 L407.8,793.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M663.2,737.5 L663.2,793.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M904.8,737.5 L904.8,793.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M130.8,862.5 L130.8,902.5 L843.1,902.5 L843.1,918.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M407.8,862.5 L407.8,892.5 L888.6,892.5 L888.6,918.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M663.2,862.5 L663.2,882.5 L934.2,882.5 L934.2,918.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M904.8,862.5 L904.8,872.5 L979.7,872.5 L979.7,918.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1025.2,918.5 L1025.2,81.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="1032.2464999999997" y="525.375" width="66.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1065.6" y="539.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Feedback</text><rect x="925.5881666666666" y="12" width="149.4875" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="1000.3" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Generated</text><text x="1000.3" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">rule, model or analyst</text><rect x="541.2852166666665" y="137" width="207.82500000000002" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="645.2" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Queued and prioritised</text><text x="645.2" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">severity x confidence x criticality</text><rect x="567.3227166666666" y="262" width="155.75" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="645.2" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Triage</text><text x="645.2" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">plausibly real? urgent?</text><rect x="341.2295499999999" y="387" width="192.5625" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="437.5" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Investigate</text><text x="437.5" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">timeline, scope, related alerts</text><rect x="591.1560499999998" y="512" width="120" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="651.2" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Disposition?</text><rect x="70.33709999999996" y="690.75" width="121.0116" height="46.75" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="130.8" y="719.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">True positive</text><rect x="323.00649999999996" y="690.75" width="169.6338" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="407.8" y="719.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Benign true positive</text><rect x="599.5576999999998" y="690.75" width="127.1967" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="663.2" y="719.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">False positive</text><rect x="839.8727999999999" y="690.75" width="129.852" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="904.8" y="719.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Undetermined</text><rect x="12" y="793.5" width="237.6858" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="130.8" y="821.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Escalate to incident response</text><text x="130.8" y="846.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">acknowledged hand-off</text><rect x="283.6858" y="793.5" width="248.27519999999998" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="407.8" y="821.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Close with documented reason</text><text x="407.8" y="846.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">e.g. change ticket</text><rect x="565.9609999999999" y="793.5" width="194.39010000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="663.2" y="821.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Close and tune the rule</text><text x="663.2" y="846.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">tuning ticket</text><rect x="794.3510999999999" y="793.5" width="220.89540000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="904.8" y="821.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Monitor and record the gap</text><text x="904.8" y="846.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">missing evidence named</text><rect x="797.5798333333332" y="918.5" width="273.2" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="934.2" y="946.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Closure record</text><text x="934.2" y="971.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">what happened, evidence, actions, changes</text></g><rect x="36" y="858.9121035952937" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="858.9121035952937" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="879.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Every path ends in a closure record, and every closure can send feedback to the detection layer.</text></g><text x="964" y="996" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>