<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-label="Table with columns Label, Recipient may share with, and Source uses it when. TLP:RED (red row): named recipients only, no further disclosure; misuse would risk privacy, reputation or operations. TLP:AMBER+STRICT (orange row): own organisation only, need-to-know; recipients need it to act, but clients must not see it. TLP:AMBER (orange row): own organisation and its clients, need-to-know; recipients and their clients need it to protect themselves. TLP:GREEN (green row): peers and partners in the community, not via public channels; it is useful for awareness across the community. TLP:CLEAR (slate row): anyone, standard copyright applies; there is minimal foreseeable risk of misuse."><title>TLP 2.0: the five labels and how far each may travel</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="403" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L07-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">TLP 2.0: the five labels and how far each may travel</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">LABEL</text><text x="237.4" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">RECIPIENT MAY SHARE WITH</text><text x="606.1" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">SOURCE USES IT WHEN</text><rect x="36" y="42" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="42" width="4" height="36.225" rx="2" fill="#DC2626"/><text x="50.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7F1D1D" text-anchor="start">TLP:RED</text><text x="237.4" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Named recipients only; no further disclosure</text><text x="606.1" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Misuse risks privacy, reputation or operations</text><rect x="36" y="82.225" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="82.225" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="50.0" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">TLP:AMBER+STRICT</text><text x="237.4" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Own organisation only, need-to-know</text><text x="606.1" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Recipients must act, clients must not see it</text><rect x="36" y="122.44999999999999" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="122.44999999999999" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="50.0" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">TLP:AMBER</text><text x="237.4" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Own organisation and its clients, need-to-know</text><text x="606.1" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Recipients and clients need it to protect themselves</text><rect x="36" y="162.67499999999998" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="162.67499999999998" width="4" height="36.225" rx="2" fill="#16A34A"/><text x="50.0" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#14532D" text-anchor="start">TLP:GREEN</text><text x="237.4" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Community peers and partners; no public channels</text><text x="606.1" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Useful for awareness across the community</text><rect x="36" y="202.89999999999998" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="202.89999999999998" width="4" height="36.225" rx="2" fill="#475569"/><text x="50.0" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start">TLP:CLEAR</text><text x="237.4" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Anyone; standard copyright applies</text><text x="606.1" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Minimal foreseeable risk of misuse</text><rect x="36" y="255.12499999999997" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="255.12499999999997" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="275.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Only the source sets the label; to share more widely than the label allows, a recipient must first get the source&#39;s permission.</text></g><text x="964" y="392" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>