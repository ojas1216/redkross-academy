<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" width="1000" height="325" role="img" aria-label="Bar chart with three bars. Volume only (hits &gt;= 10), slate: 3 alerts, 1 true. R6 as shipped (hits &gt;= 10 and spread &lt; 50), green: 1 alert, 1 true. Volume &gt;= 20 + spread &lt; 50, red: 0 alerts, beacon missed. Note: the size condition removed the noise; the higher threshold removed the attack."><title>One rule, three variants: precision against recall</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="324" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L01-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">One rule, three variants: precision against recall</text><g transform="translate(0,68)"><text x="36.0" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Alerts produced on the Banyan dataset by three variants of R6, and how many of them were the WS-104 beacon.</text><text x="234.1" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Volume only (hits &gt;= 10)</text><rect x="248.09700000000004" y="44" width="605.903" height="26" rx="6" fill="#F1F5F9"/><rect x="248.09700000000004" y="44" width="605.903" height="26" rx="6" fill="#94A3B8"/><text x="864.0" y="62.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start">3 alerts, 1 true</text><text x="234.1" y="103.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">R6 as shipped</text><rect x="248.09700000000004" y="86" width="605.903" height="26" rx="6" fill="#F1F5F9"/><rect x="248.09700000000004" y="86" width="201.96766666666667" height="26" rx="6" fill="#6CCB95"/><text x="460.1" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="start">1 alert, 1 true</text><text x="234.1" y="145.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Volume &gt;= 20 + spread &lt; 50</text><rect x="248.09700000000004" y="128" width="605.903" height="26" rx="6" fill="#F1F5F9"/><rect x="248.09700000000004" y="128" width="6" height="26" rx="6" fill="#F19A9A"/><text x="264.1" y="146.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="start">0 alerts, beacon missed</text><rect x="36" y="176" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="176" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="196.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The size condition removed the noise; the higher volume threshold removed the attack.</text></g><text x="964" y="313" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>