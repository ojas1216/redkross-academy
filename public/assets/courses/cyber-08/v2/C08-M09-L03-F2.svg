<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1096" width="1000" height="1096" role="img" aria-label="Check internal records for an existing conviction or analysis. When new analysis is required, treat unknown data sensitivity as sensitive. Use a permitted private environment for restricted material or escalate if unavailable. Record any submission in the case."><title>Reviewing a sandbox submission</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1095" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M09-L03-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Reviewing a sandbox submission</text><g transform="translate(0,68)"><g transform="translate(149.4,4) scale(1.000)"><path d="M474.0,58.8 L474.0,114.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M440.3,183.8 L440.3,193.8 L106.5,193.8 L106.5,527.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="65.85579999999999" y="340.25" width="34.676" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="83.2" y="354.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Yes</text><path d="M507.7,183.8 L507.7,315.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="514.7266" y="239.75" width="29.336" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="529.4" y="253.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">No</text><path d="M463.0,384.8 L463.0,394.8 L329.8,394.8 L329.8,671.8 L295.7,671.8 L295.7,717.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="235.0636" y="541.25" width="88.69999999999999" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="279.4" y="555.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Yes or unsure</text><path d="M552.5,384.8 L552.5,516.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="559.49515" y="440.75" width="29.336" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="574.2" y="454.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">No</text><path d="M515.1,585.8 L515.1,595.8 L376.1,595.8 L376.1,717.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="340.7636" y="641.75" width="29.336" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="355.4" y="655.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">No</text><path d="M589.9,585.8 L589.9,717.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="549.21805" y="641.75" width="34.676" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="566.6" y="655.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Yes</text><path d="M106.5,574.6 L106.5,796.8 L283.2,796.8 L283.2,842.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M335.9,786.8 L335.9,842.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M589.9,786.8 L589.9,796.8 L388.6,796.8 L388.6,842.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="353.86184999999995" y="12" width="240.29340000000002" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="474.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Suspicious file from a mailbox</text><rect x="372.85439999999994" y="114.75" width="202.3083" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="474.0" y="143.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Hash already classified?</text><text x="474.0" y="167.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Check internal cases first</text><rect x="373.42094999999995" y="315.75" width="268.6113" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="507.7" y="344.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Personal or business data inside?</text><text x="507.7" y="368.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Include uncertainty</text><rect x="440.29844999999995" y="516.75" width="224.3934" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="552.5" y="545.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Sharing terms allow public?</text><text x="552.5" y="569.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Policy, contract and markings</text><rect x="12" y="527.875" width="189.0636" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="106.5" y="556.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Use the existing report</text><rect x="215.28919999999997" y="717.75" width="241.21560000000002" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="335.9" y="746.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Private or contracted sandbox</text><text x="335.9" y="770.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Escalate if no approved private option</text><rect x="490.5048" y="717.75" width="198.7785" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="589.9" y="746.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Approved public service</text><text x="589.9" y="770.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Assume submission is visible</text><rect x="230.5845" y="842.75" width="210.625" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="335.9" y="871.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Record in the case</text><text x="335.9" y="895.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Where, when, why and by whom</text></g><rect x="36" y="947.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="947.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="968.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Use only services approved for the data and sharing terms.</text></g><text x="964" y="1084" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>