<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 662" width="1000" height="662" role="img" aria-label="Graph, top to bottom. Alert: R2 vpn_spray_then_success leads to Extract entities (gopal, 203.0.113.66, 06:46Z), which leads to Privacy check (minimum data, internal sources first). The privacy check fans out to five sources: Asset (CMDB) with owner, function, criticality; Identity (IdP) with department, role, privilege; Network with internal or external, geo, ASN; Threat intel with ioc_match.py confidence and expiry; History with prior alerts, first seen, prevalence. All five feed Enriched alert, where each value carries its source and age."><title>Enriching an alert during triage</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="661" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L03-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Enriching an alert during triage</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.825)"><path d="M172.6,81.0 L172.6,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M172.6,206.0 L172.6,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M96.8,331.0 L96.8,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M134.7,331.0 L134.7,371.0 L302.9,371.0 L302.9,387.0" fill="none" str