<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" width="1000" height="548" role="img" aria-label="Five stacked bands, most abstract at the top. Dark band: Tactic TA0002 Execution, the why: run malicious code. Violet band: Technique T1059, Command and Scripting Interpreter. Orange band: Sub-technique T1059.001, PowerShell. Red band: Procedure, Word macro starts hidden PowerShell on WS-104 at 06:14. Green band at the bottom: Detection, minisiem R1 or the Sigma rule, WINWORD.EXE parent plus powershell.exe child. Note: rules are written at the bottom and mapped upwards."><title>From tactic to detection: one Banyan chain through ATT&amp;CK</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="547" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L03-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">From tactic to detection: one Banyan chain through ATT&amp;CK</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="32.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tactic: TA0002 Execution</text><text x="500.0" y="57.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">the why: run malicious code</text><rect x="36" y="81" width="928" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="109.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Technique: T1059</text><text x="500.0" y="134.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Command and Scripting Interpreter</text><rect x="36" y="158" width="928" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="186.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Sub-technique: T1059.001</text><text x="500.0" y="211.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">PowerShell</text><rect x="36" y="235" width="928" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="500.0" y="263.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Procedure</text><text x="500.0" y="288.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Word macro starts hidden PowerShell (WS-104, 06:14)</text><rect x="36" y="312" width="928" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="340.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Detection: minisiem R1 / Sigma rule</text><text x="500.0" y="365.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">WINWORD.EXE parent + powershell.exe child</text><rect x="36" y="399" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="399" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="419.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rules are written at the procedure level and mapped upwards; tag only as high as the observation supports.</text></g><text x="964" y="536" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>