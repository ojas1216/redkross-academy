<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Comparison of two columns separated by vs. Left, green, Scoped: user = itadmin: entry R3, user, itadmin, reason CHG-1042, expiry 2026-12-31; suppresses only the BLD-01 build_runner event; both WS-104 svc_update alerts still queued at 5.4; owner, reason and expiry recorded. Right, red, Over-suppressed: host = WS-104: entry R3, host, WS-104, reason too noisy, no expiry; suppresses all three R3 events; the attacker&#39;s svc_update admin account disappears; no owner, no ticket, never expires."><title>Scoped suppression versus over-suppression in the lab</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="349" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L05-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Scoped suppression versus over-suppression in the lab</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="178.9" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Scoped: user = itadmin</text><circle cx="56" cy="70" r="3.5" fill="#16A34A"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">R3 / user / itadmin / CHG-1042 / 2026-12-31</text><circle cx="56" cy="98.225" r="3.5" fill="#16A34A"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Hides only BLD-01 build_runner</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#16A34A"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Both WS-104 svc_update alerts stay (5.4)</text><circle cx="56" cy="154.67499999999998" r="3.5" fill="#16A34A"/><text x="68.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Owner, reason and expiry recorded</text><rect x="511" y="4" width="453" height="178.9" rx="12" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7F1D1D" text-anchor="middle">Over-suppressed: host = WS-104</text><circle cx="531" cy="70" r="3.5" fill="#DC2626"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">R3 / host / WS-104 / &quot;too noisy&quot; / none</text><circle cx="531" cy="98.225" r="3.5" fill="#DC2626"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Hides all three R3 events</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#DC2626"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Attacker&#39;s svc_update account vanishes</text><circle cx="531" cy="154.67499999999998" r="3.5" fill="#DC2626"/><text x="543.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">No owner, no ticket, never expires</text><circle cx="500" cy="93.45" r="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="98.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">vs</text><rect x="36" y="200.9" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="200.9" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="221.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A suppression should be as narrow as the benign pattern it describes, and no wider.</text></g><text x="964" y="338" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>