<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" width="1000" height="378" role="img" aria-label="Comparison of two columns separated by vs. Left, green, Intelligence can tell you: what others saw, where and when; context: C2, spraying, phishing; the producer&#39;s confidence and validity; which values to hunt for first; TTPs worth detecting. Right, red, It cannot tell you: whether you are compromised; that no match means clean; that an old value is still bad; who is really behind it; what your own users were doing."><title>What threat intelligence can and cannot tell you</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="377" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L06-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">What threat intelligence can and cannot tell you</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="207.125" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Intelligence can tell you</text><circle cx="56" cy="70" r="3.5" fill="#16A34A"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">what others saw, where and when</text><circle cx="56" cy="98.225" r="3.5" fill="#16A34A"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">context: C2, spraying, phishing</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#16A34A"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">the producer&#39;s confidence and validity</text><circle cx="56" cy="154.67499999999998" r="3.5" fill="#16A34A"/><text x="68.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">which values to hunt for first</text><circle cx="56" cy="182.89999999999998" r="3.5" fill="#16A34A"/><text x="68.0" y="186.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">TTPs worth detecting</text><rect x="511" y="4" width="453" height="207.125" rx="12" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7F1D1D" text-anchor="middle">It cannot tell you</text><circle cx="531" cy="70" r="3.5" fill="#DC2626"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">whether you are compromised</text><circle cx="531" cy="98.225" r="3.5" fill="#DC2626"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">that no match means clean</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#DC2626"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">that an old value is still bad</text><circle cx="531" cy="154.67499999999998" r="3.5" fill="#DC2626"/><text x="543.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">who is really behind it</text><circle cx="531" cy="182.89999999999998" r="3.5" fill="#DC2626"/><text x="543.0" y="186.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">what your own users were doing</text><circle cx="500" cy="107.5625" r="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="112.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">vs</text><rect x="36" y="229.125" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="229.125" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="249.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Intelligence tells you what to look for; only your own evidence tells you what happened to you.</text></g><text x="964" y="366" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>