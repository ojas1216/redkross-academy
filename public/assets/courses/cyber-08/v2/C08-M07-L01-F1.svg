<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-label="Table with columns Rule, Family, Relies on, Easiest evasion and Legitimate look-alike. R1 office_spawns_script, behavioural, orange: Word starting PowerShell or cmd; an unlisted child interpreter; an approved macro running a script. R2 vpn_spray_then_success, behavioural via threshold and sequence, orange: 5 or more users failing from one address, then a success; fewer users per address or many addresses; staff mistyping behind a shared NAT address. R3 new_local_admin, behavioural, orange: events 4720 and 4732; hard without disabling auditing; IT provisioning. R4 large_upload, anomaly with a fixed threshold, blue: one request over 10 MB; splitting into smaller uploads; backups and large legitimate uploads. R5 log_cleared, signature on an OS fact, violet: event 1102; not clearing, or stopping logging another way; approved maintenance. R6 beacon_regular_small, anomaly by regularity, blue: 10 or more same-size requests to one URL; random padding of request size; update checkers and telemetry agents."><title>The six minisiem rules as design decisions</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="589" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L01-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The six minisiem rules as design decisions</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">RULE</text><text x="214.6" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">FAMILY</text><text x="402.4" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">RELIES ON</text><text x="605.4" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">EASIEST EVASION</text><text x="794.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">LEGITIMATE LOOK-ALIKE</text><rect x="36" y="42" width="928" height="54.45" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="42" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="50.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">R1</text><text x="50.0" y="82.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">office_spawns_script</text><text x="214.6" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Behavioural</text><text x="402.4" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Word starts PowerShell or</text><text x="402.4" y="82.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">cmd</text><text x="605.4" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Unlisted child interpreter</text><text x="794.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Approved macro runs a</text><text x="794.0" y="82.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">script</text><rect x="36" y="100.45" width="928" height="72.67500000000001" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="100.45" width="4" height="72.67500000000001" rx="2" fill="#EA6A0A"/><text x="50.0" y="123.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">R2</text><text x="50.0" y="141.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">vpn_spray_then_suc</text><text x="50.0" y="159.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">cess</text><text x="214.6" y="123.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Behavioural (threshold +</text><text x="214.6" y="141.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">sequence)</text><text x="402.4" y="123.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">5+ users fail from one IP,</text><text x="402.4" y="141.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">then success</text><text x="605.4" y="123.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Fewer users per IP, many</text><text x="605.4" y="141.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">IPs</text><text x="794.0" y="123.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Shared NAT, mistyped</text><text x="794.0" y="141.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">passwords</text><rect x="36" y="177.125" width="928" height="54.45" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="177.125" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="50.0" y="199.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">R3 new_local_admin</text><text x="214.6" y="199.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Behavioural</text><text x="402.4" y="199.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Events 4720 / 4732</text><text x="605.4" y="199.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Hard without disabling</text><text x="605.4" y="217.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">auditing</text><text x="794.0" y="199.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">IT provisioning</text><rect x="36" y="235.575" width="928" height="54.45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="235.575" width="4" height="54.45" rx="2" fill="#2563EB"/><text x="50.0" y="258.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="start">R4 large_upload</text><text x="214.6" y="258.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Anomaly (fixed threshold)</text><text x="402.4" y="258.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">One request over 10 MB</text><text x="605.4" y="258.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Split into smaller uploads</text><text x="794.0" y="258.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Backups, large legitimate</text><text x="794.0" y="276.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">uploads</text><rect x="36" y="294.025" width="928" height="54.45" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="294.025" width="4" height="54.45" rx="2" fill="#7C3AED"/><text x="50.0" y="316.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#3B2A7A" text-anchor="start">R5 log_cleared</text><text x="214.6" y="316.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Signature on an OS fact</text><text x="402.4" y="316.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Event 1102</text><text x="605.4" y="316.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Do not clear; stop logging</text><text x="605.4" y="334.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">otherwise</text><text x="794.0" y="316.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Approved maintenance</text><rect x="36" y="352.47499999999997" width="928" height="72.67500000000001" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="352.47499999999997" width="4" height="72.67500000000001" rx="2" fill="#2563EB"/><text x="50.0" y="375.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="start">R6</text><text x="50.0" y="393.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="start">beacon_regular_sma</text><text x="50.0" y="411.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="start">ll</text><text x="214.6" y="375.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Anomaly (regularity)</text><text x="402.4" y="375.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">10+ same-size requests to</text><text x="402.4" y="393.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">one URL</text><text x="605.4" y="375.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Random padding of</text><text x="605.4" y="393.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">request size</text><text x="794.0" y="375.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Update checkers,</text><text x="794.0" y="393.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">telemetry agents</text><rect x="36" y="441.15" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="441.15" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="461.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The evasion column predicts false negatives; the look-alike column predicts false positives.</text></g><text x="964" y="578" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>