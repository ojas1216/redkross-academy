<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 838" width="1000" height="838" role="img" aria-label="Vertical flow of seven steps. Frame the question (scope: hosts, accounts, time window). Inventory the evidence (which IDs and sources exist). Establish the baseline (peers or history). Isolate deviations (rare IDs, odd logon types, actors outside their role). Build the chain (pivot on shared values, order by time). Check for absence (expected events present, collection healthy). Context and disposition (benign, suspicious or malicious, with evidence). A feedback arrow returns from the last step to the first: a new host or account re-opens the question."><title>A method for reading Windows events</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="837" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M04-L01-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">A method for reading Windows events</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Frame the question</text><text x="500.0" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">scope: hosts, accounts, time window</text><line x1="500.0" y1="80.0" x2="500.0" y2="104.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="107" width="560" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="135.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Inventory the evidence</text><text x="500.0" y="160.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">which IDs and sources exist, from when to when</text><line x1="500.0" y1="179.0" x2="500.0" y2="203.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="206" width="560" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="234.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Establish the baseline</text><text x="500.0" y="259.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">compare with peers or with history</text><line x1="500.0" y1="278.0" x2="500.0" y2="302.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="305" width="560" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="333.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Isolate deviations</text><text x="500.0" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">rare IDs, odd logon types, actors outside their role</text><line x1="500.0" y1="377.0" x2="500.0" y2="401.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="404" width="560" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="432.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Build the chain</text><text x="500.0" y="457.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">pivot on host, actor, target, Logon ID; order by time</text><line x1="500.0" y1="476.0" x2="500.0" y2="500.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="503" width="560" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="531.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Check for absence</text><text x="500.0" y="556.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">expected events present? collection healthy?</text><line x1="500.0" y1="575.0" x2="500.0" y2="599.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="602" width="560" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="630.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Context and disposition</text><text x="500.0" y="655.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">benign / suspicious / malicious, with evidence</text><path d="M783,619.25 L810,619.25 L810,25.25 L787,25.25" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="820.0" y="318.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">a new host or account</text><text x="820.0" y="334.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">re-opens the question</text><rect x="36" y="689" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="689" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="709.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The conclusion is only as strong as the weakest step that was skipped.</text></g><text x="964" y="826" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>