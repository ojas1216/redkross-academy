<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 493" width="1000" height="493" role="img" aria-label="Bar chart of acknowledgement times in minutes: 06:15 TP 5, 07:00 FP 2, 08:20 FP 1, 09:00 TP 150 (highlighted red), 10:00 BTP 4, then Median MTTA 4.0 in green and Mean MTTA 32.4 in orange."><title>Mean versus median MTTA in soc_metrics.py</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="492" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-L07-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Mean versus median MTTA in soc_metrics.py</text><g transform="translate(0,68)"><text x="36.0" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The five acknowledgement times from the lab script and the two summaries it prints: one late true positive inflates the mean.</text><text x="139.2" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">06:15 TP</text><rect x="153.18036" y="44" width="700.8196399999999" height="26" rx="6" fill="#F1F5F9"/><rect x="153.18036" y="44" width="23.360654666666665" height="26" rx="6" fill="#94A3B8"/><text x="186.5" y="62.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start">5 min</text><text x="139.2" y="103.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">07:00 FP</text><rect x="153.18036" y="86" width="700.8196399999999" height="26" rx="6" fill="#F1F5F9"/><rect x="153.18036" y="86" width="9.344261866666667" height="26" rx="6" fill="#94A3B8"/><text x="172.5" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start">2 min</text><text x="139.2" y="145.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">08:20 FP</text><rect x="153.18036" y="128" width="700.8196399999999" height="26" rx="6" fill="#F1F5F9"/><rect x="153.18036" y="128" width="6" height="26" rx="6" fill="#94A3B8"/><text x="169.2" y="146.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start">1 min</text><text x="139.2" y="187.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">09:00 TP</text><rect x="153.18036" y="170" width="700.8196399999999" height="26" rx="6" fill="#F1F5F9"/><rect x="153.18036" y="170" width="700.8196399999999" height="26" rx="6" fill="#F19A9A"/><text x="864.0" y="188.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="start">150 min</text><text x="139.2" y="229.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">10:00 BTP</text><rect x="153.18036" y="212" width="700.8196399999999" height="26" rx="6" fill="#F1F5F9"/><rect x="153.18036" y="212" width="18.688523733333334" height="26" rx="6" fill="#94A3B8"/><text x="181.9" y="230.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start">4 min</text><text x="139.2" y="271.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Median MTTA</text><rect x="153.18036" y="254" width="700.8196399999999" height="26" rx="6" fill="#F1F5F9"/><rect x="153.18036" y="254" width="18.688523733333334" height="26" rx="6" fill="#6CCB95"/><text x="181.9" y="272.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="start">4.0 min</text><text x="139.2" y="313.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Mean MTTA</text><rect x="153.18036" y="296" width="700.8196399999999" height="26" rx="6" fill="#F1F5F9"/><rect x="153.18036" y="296" width="151.37704223999998" height="26" rx="6" fill="#F59E4B"/><text x="314.6" y="314.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="start">32.4 min</text><rect x="36" y="344" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="344" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="364.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Real output: MTTA mean 32.4 min, median 4.0 min. The outlier was a true positive that waited 150 minutes.</text></g><text x="964" y="481" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>