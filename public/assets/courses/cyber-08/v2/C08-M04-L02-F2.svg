<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 819" width="1000" height="819" role="img" aria-label="Decision graph. SSH failures from one source leads to the decision Any Accepted from this source? Yes leads to Probable compromise (red), which leads to Review the session (sshd PID, sudo commands, account changes). No leads to the decision Real accounts targeted? No, invalid users only, leads to Background noise (green, record and suppress). Yes leads to Targeted guessing (orange, block source, check the accounts)."><title>Triage of SSH failures from one source</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="818" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M04-L02-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Triage of SSH failures from one source</text><g transform="translate(0,68)"><g transform="translate(101.2,4) scale(1.000)"><path d="M194.8,81.0 L194.8,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M152.4,183.8 L152.4,315.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="113.73425" y="239.75" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="130.1" y="253.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M237.2,183.8 L237.2,193.8 L492.6,193.8 L492.6,330.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="499.57984999999996" y="239.75" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="513.3" y="253.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M458.9,377.3 L458.9,565.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="326.8125" y="465.25" width="126.044" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="389.8" y="479.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no, invalid users only</text><path d="M526.3,377.3 L526.3,394.8 L678.5,394.8 L678.5,565.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="685.54455" y="465.25" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="701.9" y="479.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M152.4,384.8 L152.4,440.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="75.9893" y="12" width="237.65400000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="194.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">SSH failures from one source</text><text x="194.8" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">alert or hunt result</text><rect x="67.58614999999999" y="137" width="254.46030000000005" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="194.8" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Any Accepted from this source?</text><rect x="391.4098" y="330.5833333333333" width="202.3401" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="492.6" y="358.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Real accounts targeted?</text><rect x="60.0925" y="315.75" width="184.6275" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="152.4" y="344.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Probable compromise</text><text x="152.4" y="368.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">escalate</text><rect x="380.2247" y="565.75" width="157.2636" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="458.9" y="594.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Background noise</text><text x="458.9" y="618.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">record and suppress</text><rect x="571.4883" y="565.75" width="214.11249999999998" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="678.5" y="594.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Targeted guessing</text><text x="678.5" y="618.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">block source, check the accounts</text><rect x="12" y="440.75" width="280.8125" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="152.4" y="469.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Review the session</text><text x="152.4" y="493.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">sshd PID, sudo commands, account changes</text></g><rect x="36" y="670.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="670.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="691.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A success after failures is the incident; failures alone are noise or intent.</text></g><text x="964" y="807" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>