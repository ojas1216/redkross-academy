<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1244" width="1000" height="1244" role="img" aria-label="Decision graph, top to bottom. Triage finding (validated, enriched) leads to a violet decision box: Hard trigger present? (execution, privilege, tampering, exfil). Yes leads to the dark box Escalate now (page on-call, minutes). No leads to a second violet decision: High impact if real? (crown jewel, privileged, spreading). Yes or undetermined leads to the orange box Escalate to Tier 2 (case queue, within SLA). No leads to the green box Close or keep triaging (documented disposition). Escalate now leads to a third violet decision, Possibly reportable? (CERT-In incident types); a dashed arrow labelled if facts change also runs to it from Escalate to Tier 2. Yes leads to the red box Notify IR lead + legal POC (record time noticed)."><title>Escalation criteria: now, to Tier 2, or not at all</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1243" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L06-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Escalation criteria: now, to Tier 2, or not at all</text><g transform="translate(0,68)"><g transform="translate(231.1,4) scale(1.000)"><path d="M359.0,81.0 L359.0,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M320.9,206.0 L320.9,216.0 L86.4,216.0 L86.4,664.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="47.72800000000001" y="362.5" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="64.1" y="376.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M397.2,206.0 L397.2,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="404.1537833333333" y="262" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="417.8" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M360.9,407.0 L360.9,417.0 L226.8,417.0 L226.8,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="97.4" y="463" width="123.38" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="159.1" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes or undetermined</text><path d="M433.4,407.0 L433.4,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400.0702" y="463" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="413.7" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M86.4,733.0 L86.4,743.0 L168.8,743.0 L168.8,789.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M226.8,608.0 L226.8,789.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="233.78" y="688.5" width="91.376" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="279.5" y="702.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">if facts change</text><path d="M197.8,858.0 L197.8,990.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="159.10165" y="914" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="175.4" y="928.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><rect x="291.58295" y="12" width="134.91250000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="359.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Triage finding</text><text x="359.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">validated, enriched</text><rect x="244.69544999999997" y="137" width="228.6875" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="359.0" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Hard trigger present?</text><text x="359.0" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">execution, privilege, tampering, exfil</text><rect x="12" y="664" width="148.8" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="86.4" y="692.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Escalate now</text><text x="86.4" y="717.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">page on-call, minutes</text><rect x="288.3725333333333" y="338" width="217.5625" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="397.2" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">High impact if real?</text><text x="397.2" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">crown jewel, privileged, spreading</text><rect x="146.4675" y="539" width="160.625" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="226.8" y="567.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Escalate to Tier 2</text><text x="226.8" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">case queue, within SLA</text><rect x="341.0925" y="539" width="184.6434" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="433.4" y="567.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Close or keep triaging</text><text x="433.4" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">documented disposition</text><rect x="110.75460000000001" y="789" width="174.0381" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="197.8" y="817.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Possibly reportable?</text><text x="197.8" y="842.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">CERT-In incident types</text><rect x="89.76660000000001" y="990" width="216.01409999999998" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="197.8" y="1018.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Notify IR lead + legal POC</text><text x="197.8" y="1043.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">record time noticed</text></g><rect x="36" y="1095" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="1095" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="1115.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Escalate on likelihood and impact, not on certainty; the analyst flags reportability, legal decides it.</text></g><text x="964" y="1232" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>