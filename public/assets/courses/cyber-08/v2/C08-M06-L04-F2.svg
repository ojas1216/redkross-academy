<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 832" width="1000" height="832" role="img" aria-label="Graph with two independent groups. First group: Event A: Banyan intrusion (domain cdn-telemetry-sync.example) and Event B: ISAC-A loader report (same domain) both lead to Correlation: exact value match, which leads to Related events linked (independent sources corroborate). Second group: Common value in many events (shared CDN or resolver address) leads to Warninglist match (known false-positive list), which leads to Exclude or disable correlation (avoid over-correlation)."><title>Correlation: a meaningful link and over-correlation control</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="831" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L04-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Correlation: a meaningful link and over-correlation control</text><g transform="translate(0,68)"><g transform="translate(234.6,4) scale(1.000)"><path d="M127.4,420.0 L127.4,476.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M397.8,420.0 L397.8,430.0 L209.0,430.0 L209.0,476.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M168.2,522.8 L168.2,578.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.1,81.0 L136.1,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.1,206.0 L136.1,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="351" width="230.74999999999997" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="127.4" y="379.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Event A: Banyan intrusion</text><text x="127.4" y="404.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">domain cdn-telemetry-sync.example</text><rect x="276.75" y="351" width="242.0901" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="397.8" y="379.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Event B: ISAC-A loader report</text><text x="397.8" y="404.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">same domain</text><rect x="45.798499999999976" y="476" width="244.72950000000003" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="168.2" y="504.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Correlation: exact value match</text><rect x="61.45075" y="578.75" width="213.42499999999998" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="168.2" y="607.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Related events linked</text><text x="168.2" y="631.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">independent sources corroborate</text><rect x="12" y="12" width="248.25930000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="136.1" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Common value in many events</text><text x="136.1" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">shared CDN or resolver address</text><rect x="55.485900000000015" y="137" width="161.2875" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="136.1" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Warninglist match</text><text x="136.1" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">known false-positive list</text><rect x="16.85745" y="262" width="238.54440000000002" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="136.1" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Exclude or disable correlation</text><text x="136.1" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">avoid over-correlation</text></g><rect x="36" y="683.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="683.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="704.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A correlation is a lead to investigate, not a conclusion about who is behind it.</text></g><text x="964" y="820" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>