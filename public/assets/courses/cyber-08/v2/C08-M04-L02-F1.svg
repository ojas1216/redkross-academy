<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 914" width="1000" height="914" role="img" aria-label="Sequence diagram with four lanes: SSH client (198.51.100.23), sshd[2120], PAM (pam_unix) and systemd-logind. The client sends connect + user deploy, then password, to sshd. sshd sends check password to PAM; PAM replies success (dashed). sshd replies to the client: Accepted password for deploy (dashed). sshd asks PAM to open session; PAM replies session opened for user deploy(uid=1001) (dashed). sshd registers the session with systemd-logind, which logs New session 57 of user deploy. The client sends disconnect to sshd; sshd tells logind session ended; logind logs Removed session 57 (dashed reply)."><title>One SSH password login and the lines it writes</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="913" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M04-L02-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">One SSH password login and the lines it writes</text><g transform="translate(0,68)"><line x1="152" y1="75" x2="152" y2="747" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="46" y="6" width="212" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="152.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">SSH client</text><text x="152.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">198.51.100.23</text><line x1="384" y1="75" x2="384" y2="747" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="278" y="6" width="212" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="384.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">sshd[2120]</text><text x="384.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">per-connection process</text><line x1="616" y1="75" x2="616" y2="747" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="510" y="6" width="212" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="616.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">PAM (pam_unix)</text><text x="616.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">auth + session</text><line x1="848" y1="75" x2="848" y2="747" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="742" y="6" width="212" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="848.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">systemd-logind</text><text x="848.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">session tracking</text><line x1="156.0" y1="109.0" x2="378.0" y2="109.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="101.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">connect + user deploy</text><circle cx="152" cy="109" r="9" fill="#EA6A0A"/><text x="152.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="156.0" y1="163.0" x2="378.0" y2="163.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="155.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">password</text><circle cx="152" cy="163" r="9" fill="#EA6A0A"/><text x="152.0" y="167.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="388.0" y1="217.0" x2="610.0" y2="217.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="209.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">check password</text><circle cx="384" cy="217" r="9" fill="#EA6A0A"/><text x="384.0" y="221.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="612.0" y1="271.0" x2="390.0" y2="271.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="263.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">success</text><circle cx="616" cy="271" r="9" fill="#EA6A0A"/><text x="616.0" y="275.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="380.0" y1="325.0" x2="158.0" y2="325.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="268.0" y="317.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">logged: Accepted password for deploy</text><circle cx="384" cy="325" r="9" fill="#EA6A0A"/><text x="384.0" y="329.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><line x1="388.0" y1="379.0" x2="610.0" y2="379.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="371.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">open session</text><circle cx="384" cy="379" r="9" fill="#EA6A0A"/><text x="384.0" y="383.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><line x1="612.0" y1="433.0" x2="390.0" y2="433.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="410.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">logged: session opened for user</text><text x="500.0" y="425.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">deploy(uid=1001)</text><circle cx="616" cy="433" r="9" fill="#EA6A0A"/><text x="616.0" y="437.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><line x1="388.0" y1="487.0" x2="842.0" y2="487.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="616.0" y="479.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">register session</text><circle cx="384" cy="487" r="9" fill="#EA6A0A"/><text x="384.0" y="491.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><line x1="844.0" y1="541.0" x2="390.0" y2="541.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="616.0" y="533.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">logged: New session 57 of user deploy</text><circle cx="848" cy="541" r="9" fill="#EA6A0A"/><text x="848.0" y="545.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><line x1="156.0" y1="595.0" x2="378.0" y2="595.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="587.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">disconnect</text><circle cx="152" cy="595" r="9" fill="#EA6A0A"/><text x="152.0" y="599.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><line x1="388.0" y1="649.0" x2="842.0" y2="649.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="616.0" y="641.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">session ended</text><circle cx="384" cy="649" r="9" fill="#EA6A0A"/><text x="384.0" y="653.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text><line x1="844.0" y1="703.0" x2="390.0" y2="703.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="616.0" y="695.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">logged: Removed session 57</text><circle cx="848" cy="703" r="9" fill="#EA6A0A"/><text x="848.0" y="707.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text><rect x="36" y="765" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="765" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="785.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Join a connection&#39;s lines by the sshd PID and the session by the logind session number.</text></g><text x="964" y="902" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>