<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 591" width="1000" height="591" role="img" aria-label="Timeline with five rows from 06:00 to 08:30 UTC. Proxy download and upload (orange): ticks at 06:12 and 08:12. Sysmon WINWORD to PowerShell (red): one tick at 06:14. Proxy beacon every 5 minutes (red): 18 evenly spaced ticks from 06:17 to 07:42. Windows 4720, 4732, 1102 (violet): ticks at 07:02, 07:03 and 08:17. VPN spray and success for gopal (blue): a cluster of 8 failures at 06:42 and a success at 06:46. The first four rows are host WS-104; the VPN events carry no host."><title>The Banyan storyline on one UTC timeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="590" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L04-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The Banyan storyline on one UTC timeline</text><g transform="translate(0,68)"><text x="36.0" y="30.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Proxy: download and upload</text><line x1="285.02475000000004" y1="38" x2="964" y2="38" stroke="#CBD5E1" stroke-width="2"/><rect x="336.8" y="22" width="5" height="32" rx="2" fill="#EA6A0A"/><rect x="880.0" y="22" width="5" height="32" rx="2" fill="#EA6A0A"/><text x="285.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#7A3A06" text-anchor="start">WS-104: invoice.docm 06:12, 48.2 MB upload 08:12</text><text x="36.0" y="112.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Sysmon: WINWORD to PowerShell</text><line x1="285.02475000000004" y1="120" x2="964" y2="120" stroke="#CBD5E1" stroke-width="2"/><rect x="345.9" y="104" width="5" height="32" rx="2" fill="#DC2626"/><text x="285.0" y="156.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#7F1D1D" text-anchor="start">WS-104: R1 at 06:14</text><text x="36.0" y="194.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Proxy: beacon every 5 minutes</text><line x1="285.02475000000004" y1="202" x2="964" y2="202" stroke="#CBD5E1" stroke-width="2"/><rect x="359.5" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="382.1" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="404.7" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="427.4" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="450.0" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="472.6" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="495.2" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="517.9" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="540.5" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="563.1" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="585.8" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="608.4" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="631.0" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="653.7" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="676.3" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="698.9" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="721.6" y="186" width="5" height="32" rx="2" fill="#DC2626"/><rect x="744.2" y="186" width="5" height="32" rx="2" fill="#DC2626"/><text x="285.0" y="238.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#7F1D1D" text-anchor="start">WS-104: R6, 18 requests 06:17 to 07:42</text><text x="36.0" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Windows: 4720, 4732, 1102</text><line x1="285.02475000000004" y1="284" x2="964" y2="284" stroke="#CBD5E1" stroke-width="2"/><rect x="563.1" y="268" width="5" height="32" rx="2" fill="#7C3AED"/><rect x="567.7" y="268" width="5" height="32" rx="2" fill="#7C3AED"/><rect x="902.6" y="268" width="5" height="32" rx="2" fill="#7C3AED"/><text x="285.0" y="320.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#3B2A7A" text-anchor="start">WS-104: R3 07:02 and 07:03, R5 08:17</text><text x="36.0" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">VPN: spray and success (gopal)</text><line x1="285.02475000000004" y1="366" x2="964" y2="366" stroke="#CBD5E1" stroke-width="2"/><rect x="472.6" y="350" width="5" height="32" rx="2" fill="#2563EB"/><rect x="473.2" y="350" width="5" height="32" rx="2" fill="#2563EB"/><rect x="473.7" y="350" width="5" height="32" rx="2" fill="#2563EB"/><rect x="474.2" y="350" width="5" height="32" rx="2" fill="#2563EB"/><rect x="474.7" y="350" width="5" height="32" rx="2" fill="#2563EB"/><rect x="475.3" y="350" width="5" height="32" rx="2" fill="#2563EB"/><rect x="475.8" y="350" width="5" height="32" rx="2" fill="#2563EB"/><rect x="476.3" y="350" width="5" height="32" rx="2" fill="#2563EB"/><rect x="490.8" y="350" width="5" height="32" rx="2" fill="#2563EB"/><text x="285.0" y="402.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#123E73" text-anchor="start">no host: R2, 8 failures 06:42, success 06:46</text><text x="964.0" y="422.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="end">UTC, 06:00 to 08:30 on 2026-11-03</text><rect x="36" y="442" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="442" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="462.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Four rows share host WS-104 and can be joined; the VPN row overlaps in time but shares no entity with them.</text></g><text x="964" y="579" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>