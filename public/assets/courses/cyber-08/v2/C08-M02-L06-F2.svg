<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="Sequence diagram with four lanes: Endpoint WS-104, Agent buffer, SIEM index and Scheduled rule. Endpoint to agent: Sysmon 1 written, @timestamp 06:14:00Z. Agent to SIEM: send fails, network down, event queued. Rule to SIEM: 06:15 run, @timestamp in last 5 min; SIEM replies no match, event not yet ingested. Agent to SIEM: 07:40 reconnect, queue sent, event.ingested 07:40Z. Rule to SIEM: 07:45 run, @timestamp in last 5 min; SIEM replies misses it, 06:14 is outside the window."><title>Event time vs ingest time: a late event slips past a rule</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="659" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-L06-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Event time vs ingest time: a late event slips past a rule</text><g transform="translate(0,68)"><line x1="152" y1="91.25" x2="152" y2="493.25" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="46" y="6" width="212" height="85.25" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="152.0" y="42.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Endpoint WS-104</text><text x="152.0" y="67.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">event source</text><line x1="384" y1="91.25" x2="384" y2="493.25" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="278" y="6" width="212" height="85.25" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="384.0" y="42.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Agent buffer</text><text x="384.0" y="67.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">queues unsent events</text><line x1="616" y1="91.25" x2="616" y2="493.25" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="510" y="6" width="212" height="85.25" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="616.0" y="42.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">SIEM index</text><text x="616.0" y="67.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">records event.ingested</text><line x1="848" y1="91.25" x2="848" y2="493.25" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="742" y="6" width="212" height="85.25" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="848.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Scheduled rule</text><text x="848.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">every 5 min, last 5 min of event</text><text x="848.0" y="75.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">time</text><line x1="156.0" y1="125.3" x2="378.0" y2="125.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="102.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Sysmon 1 written, @timestamp</text><text x="268.0" y="117.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">06:14:00Z</text><circle cx="152" cy="125.25" r="9" fill="#EA6A0A"/><text x="152.0" y="129.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="388.0" y1="179.3" x2="610.0" y2="179.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="156.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Send fails: network down, event</text><text x="500.0" y="171.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">queued</text><circle cx="384" cy="179.25" r="9" fill="#EA6A0A"/><text x="384.0" y="183.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="844.0" y1="233.3" x2="622.0" y2="233.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="732.0" y="225.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">06:15 run: @timestamp in last 5 min</text><circle cx="848" cy="233.25" r="9" fill="#EA6A0A"/><text x="848.0" y="237.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="620.0" y1="287.3" x2="842.0" y2="287.3" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="732.0" y="279.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">no match: event not yet ingested</text><circle cx="616" cy="287.25" r="9" fill="#EA6A0A"/><text x="616.0" y="291.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="388.0" y1="341.3" x2="610.0" y2="341.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="318.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">07:40 reconnect: queue sent,</text><text x="500.0" y="333.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">event.ingested 07:40Z</text><circle cx="384" cy="341.25" r="9" fill="#EA6A0A"/><text x="384.0" y="345.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><line x1="844.0" y1="395.3" x2="622.0" y2="395.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="732.0" y="387.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">07:45 run: @timestamp in last 5 min</text><circle cx="848" cy="395.25" r="9" fill="#EA6A0A"/><text x="848.0" y="399.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><line x1="620.0" y1="449.3" x2="842.0" y2="449.3" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="732.0" y="441.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">misses it: 06:14 is outside the window</text><circle cx="616" cy="449.25" r="9" fill="#EA6A0A"/><text x="616.0" y="453.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><rect x="36" y="511.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="511.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="531.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Select by ingest time, or look back far enough to cover expected delay, so late events are still evaluated.</text></g><text x="964" y="648" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>