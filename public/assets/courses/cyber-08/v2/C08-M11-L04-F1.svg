<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 793" width="1000" height="793" role="img" aria-label="A scoped request waits for an authorised decision. Denied or expired decisions are recorded without changing state. An approval goes through a scope and duplicate check. A changed scope returns for new approval; valid work proceeds to requested and verified effect."><title>From approval request to verified effect</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="792" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M11-L04-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">From approval request to verified effect</text><g transform="translate(0,68)"><g transform="translate(199.3,4) scale(1.000)"><path d="M461.7,81.0 L461.7,91.0 L355.8,91.0 L355.8,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M329.2,206.0 L329.2,216.0 L126.7,216.0 L126.7,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="262" width="108.70400000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="66.4" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Denied or expired</text><path d="M382.5,206.0 L382.5,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="311.1138999999999