<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 297" width="1000" height="297" role="img" aria-label="Segment diagram of nine fields from left to right. userIdentity, labelled who, with type, arn, accountId and sessionContext. eventTime, labelled when, UTC in ISO 8601. eventSource, labelled which service, for example iam.amazonaws.com. eventName, labelled what action, for example CreateAccessKey. awsRegion, labelled where, with global services in us-east-1. sourceIPAddress, labelled from where, an address or an AWS service name. userAgent, labelled with which client: console, CLI or SDK. requestParameters / responseElements, labelled details: what was asked and what came back. errorCode, labelled result: absent on success, for example AccessDenied."><title>Anatomy of a CloudTrail record: read it as a sentence</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="296" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-L04-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Anatomy of a CloudTrail record: read it as a sentence</text><g transform="translate(0,68)"><rect x="37" y="30" width="124.54545454545452" height="96" rx="6" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="99.3" y="65.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">userIdentity</text><text x="99.3" y="86.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#CBD5E1" text-anchor="middle">type, arn, accountId,</text><text x="99.3" y="100.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#CBD5E1" text-anchor="middle">sessionContext</text><text x="99.3" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">who</text><rect x="163.5454545454545" y="30" width="82.36363636363635" height="96" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="204.7" y="65.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">eventTime</text><text x="204.7" y="86.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">UTC, ISO</text><text x="204.7" y="100.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">8601</text><text x="204.7" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">when</text><rect x="247.90909090909085" y="30" width="99.2363636363636" height="96" rx="6" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="297.5" y="58.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="middle">eventSource</text><text x="297.5" y="79.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">e.g.</text><text x="297.5" y="93.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">iam.amazonaws.</text><text x="297.5" y="107.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">com</text><text x="297.5" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">which service</text><rect x="349.14545454545447" y="30" width="99.2363636363636" height="96" rx="6" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="398.8" y="58.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="middle">eventName</text><text x="398.8" y="79.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">e.g.</text><text x="398.8" y="93.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">CreateAccessKe</text><text x="398.8" y="107.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">y</text><text x="398.8" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">what action</text><rect x="450.38181818181806" y="30" width="82.36363636363635" height="96" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="491.6" y="58.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">awsRegion</text><text x="491.6" y="79.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">global</text><text x="491.6" y="93.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">services:</text><text x="491.6" y="107.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">us-east-1</text><text x="491.6" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">where</text><rect x="534.7454545454544" y="30" width="99.2363636363636" height="96" rx="6" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="584.4" y="57.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">sourceIPAddr</text><text x="584.4" y="73.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">ess</text><text x="584.4" y="95.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">address or AWS</text><text x="584.4" y="108.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">service name</text><text x="584.4" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">from where</text><rect x="635.9818181818181" y="30" width="82.36363636363635" height="96" rx="6" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="677.2" y="65.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">userAgent</text><text x="677.2" y="86.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">console, CLI,</text><text x="677.2" y="100.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">SDK</text><text x="677.2" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">with which client</text><rect x="720.3454545454545" y="30" width="149.85454545454544" height="96" rx="6" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="795.3" y="57.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="middle">requestParameters /</text><text x="795.3" y="73.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="middle">responseElements</text><text x="795.3" y="95.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">what was asked, what</text><text x="795.3" y="108.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">came back</text><text x="795.3" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">details</text><rect x="872.1999999999999" y="30" width="90.8" height="96" rx="6" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="917.6" y="58.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">errorCode</text><text x="917.6" y="79.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">absent on</text><text x="917.6" y="93.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">success; e.g.</text><text x="917.6" y="107.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">AccessDenied</text><text x="917.6" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">result</text><rect x="36" y="148" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="148" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="168.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Start with the principal, then the action; resolve an AssumedRole back to the identity that assumed it.</text></g><text x="964" y="285" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>