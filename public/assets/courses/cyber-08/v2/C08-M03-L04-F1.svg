<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 944" width="1000" height="944" role="img" aria-label="Top-to-bottom graph. Two blue inputs, VPN successes (s) and VPN failures (f), both feed an orange box Join on src_ip. It leads to a violet Time condition box (f.ts &lt;= s.ts, no lower bound), then a violet Group per success box (COUNT DISTINCT f.user), then a violet decision box users_failed &gt;= 5?. The yes branch leads to a dark Alert box: 203.0.113.66, 8 users failed, then gopal succeeded at 06:46:00Z. The no branch leads to a slate No alert box."><title>R2 vpn_spray_then_success: how the rule decides</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="943" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L04-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">R2 vpn_spray_then_success: how the rule decides</text><g transform="translate(0,68)"><g transform="translate(238.3,4) scale(1.000)"><path d="M131.1,81.0 L131.1,91.0 L338.5,91.0 L338.5,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M397.8,81.0 L397.8,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M368.1,206.0 L368.1,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M368.1,331.0 L368.1,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M368.1,456.0 L368.1,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M341.3,558.8 L341.3,568.8 L162.9,568.8 L162.9,690.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="124.26705000000001" y="614.75" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="140.6" y="628.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M394.9,558.8 L394.9,690.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="401.93905" y="614.75" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="415.6" y="628.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><rect x="12" y="12" width="238.23749999999998" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="131.1" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">VPN successes (s)</text><text x="131.1" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">source=&#39;vpn&#39; AND outcome=&#39;success&#39;</text><rect x="284.23749999999995" y="12" width="227.125" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="397.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">VPN failures (f)</text><text x="397.8" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">source=&#39;vpn&#39; AND outcome=&#39;failure&#39;</text><rect x="279.15" y="137" width="177.975" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="368.1" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Join on src_ip</text><text x="368.1" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">entity: same client address</text><rect x="275.66875" y="262" width="184.9375" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="368.1" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Time condition</text><text x="368.1" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">f.ts &lt;= s.ts (no lower bound)</text><rect x="280.56874999999997" y="387" width="175.13750000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="368.1" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Group per success</text><text x="368.1" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">COUNT(DISTINCT f.user)</text><rect x="287.73285" y="512" width="160.8093" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="368.1" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">users_failed &gt;= 5?</text><rect x="24.93905000000001" y="690.75" width="276" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="162.9" y="719.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Alert</text><text x="162.9" y="743.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">203.0.113.66, 8 users, then gopal 06:46:00Z</text><rect x="334.93905" y="690.75" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="394.9" y="719.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">No alert</text></g><rect x="36" y="795.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="795.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="816.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Add an upper bound to the time condition: with 10 minutes the rule fires, with 2 minutes it misses this spray.</text></g><text x="964" y="932" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>