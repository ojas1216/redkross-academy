<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 428" width="1000" height="428" role="img" aria-label="Sequence diagram with four lanes, left to right: Sending client at 198.51.100.23 (red), out.mailer.example.net at 203.0.113.45 (slate), mx1.example.com at 192.0.2.10 (blue) and mbox.example.com, the mailbox store (green). First the sending client submits the message to out.mailer.example.net with authenticated ESMTPSA at 06:08:09; that server prepends Received header 3. Next out.mailer.example.net relays to mx1.example.com over ESMTPS at 06:08:12; mx1 prepends Received header 2 and adds Authentication-Results. Then mx1.example.com hands the message to mbox.example.com at 06:08:14; mbox prepends Received header 1 and Return-Path. The note explains that headers 1 and 2 were written by the receiving organisation&#39;s own servers and header 3 by the sender&#39;s side, so only 1 and 2 can be trusted."><title>How each hop writes a Received header</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="427" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M09-L01-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">How each hop writes a Received header</text><g transform="translate(0,68)"><line x1="152" y1="75" x2="152" y2="261" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="46" y="6" width="212" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="152.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Sending client</text><text x="152.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">198.51.100.23</text><line x1="384" y1="75" x2="384" y2="261" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="278" y="6" width="212" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="384.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">out.mailer.example.net</text><text x="384.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">203.0.113.45 (sender&#39;s relay)</text><line x1="616" y1="75" x2="616" y2="261" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="510" y="6" width="212" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="616.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">mx1.example.com</text><text x="616.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">192.0.2.10 (our MX)</text><line x1="848" y1="75" x2="848" y2="261" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="742" y="6" width="212" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="848.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">mbox.example.com</text><text x="848.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">mailbox store</text><line x1="156.0" y1="109.0" x2="378.0" y2="109.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="86.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">06:08:09 ESMTPSA submit: relay</text><text x="268.0" y="101.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">writes Received 3</text><circle cx="152" cy="109" r="9" fill="#EA6A0A"/><text x="152.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="388.0" y1="163.0" x2="610.0" y2="163.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="140.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">06:08:12 ESMTPS: MX writes</text><text x="500.0" y="155.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Received 2 + Auth-Results</text><circle cx="384" cy="163" r="9" fill="#EA6A0A"/><text x="384.0" y="167.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="620.0" y1="217.0" x2="842.0" y2="217.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="732.0" y="194.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">06:08:14 ESMTPS: store writes</text><text x="732.0" y="209.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Received 1 + Return-Path</text><circle cx="616" cy="217" r="9" fill="#EA6A0A"/><text x="616.0" y="221.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="36" y="279" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="279" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="299.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Read top to bottom for newest to oldest; trust only the lines your own servers wrote (Received 1 and 2 here).</text></g><text x="964" y="416" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>