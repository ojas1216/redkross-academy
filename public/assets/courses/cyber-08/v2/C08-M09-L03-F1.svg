<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 868" width="1000" height="868" role="img" aria-label="A submitted sample passes through the controller to the analysis guest. Host monitoring produces the process tree and file and registry evidence. Network capture produces the network evidence. The verdict is derived from all four sections."><title>Where a sandbox report gets its evidence</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="867" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M09-L03-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Where a sandbox report gets its evidence</text><g transform="translate(0,68)"><g transform="translate(158.2,4) scale(1.000)"><path d="M164.2,81.0 L164.2,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M164.2,206.0 L164.2,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M129.9,331.0 L129.9,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M198.5,331.0 L198.5,341.0 L566.0,341.0 L566.0,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M72.0,456.0 L72.0,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M129.9,456.0 L129.9,476.0 L226.0,476.0 L226.0,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M187.7,456.0 L187.7,466.0 L390.7,466.0 L390.7,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M566.0,456.0 L566.0,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M72.0,558.8 L72.0,568.8 L176.9,568.8 L176.9,614.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M226.0,558.8 L226.0,614.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M390.7,558.8 L390.7,568.8 L275.1,568.8 L275.1,614.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M566.0,558.8 L566.0,578.8 L324.1,578.8 L324.1,614.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="72.74430833333334" y="12" width="182.8375" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="164.2" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Submitted sample</text><text x="164.2" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">File or URL and run options</text><rect x="69.95055833333335" y="137" width="188.42499999999998" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="164.2" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Controller</text><text x="164.2" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Queue and restore snapshot</text><rect x="61.275558333333336" y="262" width="205.775" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="164.2" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Analysis guest</text><text x="164.2" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Run under controlled conditions</text><rect x="14.132774999999995" y="387" width="231.46890000000002" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="129.9" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">In-guest / hypervisor monitor</text><text x="129.9" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Processes, files, registry, APIs</text><rect x="460.31759999999997" y="387" width="211.3125" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="566.0" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Network capture</text><text x="566.0" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">DNS, HTTP/TLS, packet capture</text><rect x="12" y="512" width="120" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="72.0" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Process tree</text><rect x="166" y="512" width="120" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="226.0" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">File activity</text><rect x="320" y="512" width="141.3159" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="390.7" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Registry activity</text><rect x="495.31589999999994" y="512" width="141.3159" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="566.0" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Network activity</text><rect x="127.85999999999999" y="614.75" width="245.35000000000002" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="250.5" y="643.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Signatures and verdict</text><text x="250.5" y="667.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Assessment derived from observations</text></g><rect x="36" y="719.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="719.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="740.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Compare the verdict with the observations and the conditions of the run.</text></g><text x="964" y="856" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>