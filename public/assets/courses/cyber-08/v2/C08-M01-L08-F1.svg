<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" width="1000" height="1320" role="img" aria-label="Graph diagram. Telemetry sources send raw logs to the Collection pipeline, which sends normalised events to the SIEM. EDR / NDR sensors send detections and telemetry to the SIEM. The SIEM sends alerts to Case management. Case management triggers SOAR with a new case; SOAR sends lookups to Context sources (TIP, CMDB, identity, sandbox), which return context; SOAR writes enrichment back to Case management. The Analyst works the case and gives approval to SOAR, which executes Response actions (isolate host, disable account, block); response actions are applied via EDR, IdP or firewall back to the sensors. Case management feeds Metrics and feedback (MTTA, MTTR, rule tuning), which tunes the SIEM rules."><title>The SOC tooling map: how evidence flows between tools</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1319" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-L08-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The SOC tooling map: how evidence flows between tools</text><g transform="translate(0,68)"><g transform="translate(61.5,4) scale(1.000)"><path d="M132.1,81.0 L132.1,213.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="67.399" y="137" width="58.676" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="96.7" y="151.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">raw logs</text><path d="M132.1,282.0 L132.1,414.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="14.706999999999994" y="338" width="111.36800000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="70.4" y="352.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">normalised events</text><path d="M358.1,282.0 L358.1,368.0 L184.7,368.0 L184.7,414.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220.38416666666663" y="338" width="131.72" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="286.2" y="352.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">detections + telemetry</text><path d="M184.7,483.0 L184.7,493.0 L286.4,493.0 L286.4,615.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="237.03990000000002" y="539" width="43.339999999999996" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="258.7" y="553.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">alerts</text><path d="M309.9,684.0 L309.9,704.0 L364.2,704.0 L364.2,865.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="293.4844" y="764.5" width="64.688" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="325.8" y="778.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">new case</text><path d="M376.3,934.0 L376.3,964.0 L476.0,964.0 L476.0,1066.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="414.6070666666667" y="990" width="55.352000000000004" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="442.3" y="1004.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">lookups</text><path d="M540.6,1066.0 L540.6,1020.0 L487.0,1020.0 L487.0,954.0 L412.8,954.0 L412.8,934.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="493.9590666666667" y="990" width="52.688" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="520.3" y="1004.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">context</text><path d="M425.0,865.0 L425.0,819.0 L375.2,819.0 L375.2,694.0 L357.1,694.0 L357.1,684.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="382.1724" y="764.5" width="73.352" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="418.8" y="778.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">enrichment</text><path d="M262.8,1066.0 L262.8,684.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="162.78940000000003" y="889.5" width="94.02799999999999" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="209.8" y="903.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">works the case</text><path d="M320.1,1066.0 L320.1,1020.0 L339.8,1020.0 L339.8,934.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="273.8174" y="990" width="60.019999999999996" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="303.8" y="1004.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">approval</text><path d="M449.3,934.0 L449.3,944.0 L713.6,944.0 L713.6,1066.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="651.6184000000001" y="990" width="56.024" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="679.6" y="1004.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">execute</text><path d="M788.0,1066.0 L788.0,1020.0 L724.6,1020.0 L724.6,292.0 L430.1,292.0 L430.1,282.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="731.6424000000001" y="639.5" width="133.36399999999998" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="798.3" y="653.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">via EDR / IdP / firewall</text><path d="M215.7,684.0 L215.7,694.0 L192.4,694.0 L192.4,740.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><path d="M132.1,740.0 L132.1,483.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="59.38300000000001" y="539" width="66.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="92.7" y="553.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">tune rules</text><rect x="26.056250000000006" y="12" width="212.0375" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="132.1" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Telemetry sources</text><text x="132.1" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">endpoint, network, identity, cloud</text><rect x="12" y="213" width="240.15" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="132.1" y="241.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Collection pipeline</text><text x="132.1" y="266.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">agents, forwarders; parse + normalise</text><rect x="286.15" y="213" width="215.8625" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="394.1" y="241.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">EDR / NDR sensors</text><text x="394.1" y="266.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">own detections + response hooks</text><rect x="79.46666666666667" y="414" width="157.82500000000002" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="158.4" y="442.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">SIEM</text><text x="158.4" y="467.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">store, search, correlate</text><rect x="168.56740000000002" y="615" width="235.625" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="286.4" y="643.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Case management</text><text x="286.4" y="668.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">one record per alert, with timestamps</text><rect x="303.3349" y="865" width="182.51250000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="394.6" y="893.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">SOAR</text><text x="394.6" y="918.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">playbooks + approval gates</text><rect x="411.3090666666667" y="1066" width="193.95" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="508.3" y="1094.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Context sources</text><text x="508.3" y="1119.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">TIP, CMDB, identity, sandbox</text><rect x="205.57156666666668" y="1066" width="171.7375" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="291.4" y="1094.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Analyst</text><text x="291.4" y="1119.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">triage, investigate, decide</text><rect x="639.2590666666667" y="1066" width="223.15" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="750.8" y="1094.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Response actions</text><text x="750.8" y="1119.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">isolate host, disable account, block</text><rect x="71.7038" y="740" width="181.11360000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="162.3" y="768.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Metrics and feedback</text><text x="162.3" y="793.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">MTTA, MTTR, rule tuning</text></g><rect x="36" y="1171" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="1171" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="1191.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Every arrow is an integration with an owner, credentials and a failure mode; a broken arrow is a blind spot.</text></g><text x="964" y="1308" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>