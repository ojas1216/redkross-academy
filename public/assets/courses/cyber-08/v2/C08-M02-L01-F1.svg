<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 698" width="1000" height="698" role="img" aria-label="Graph diagram. Activity on the host (processes, files, registry, logons) feeds four sources: the Security log (4624, 4625, 4688, 4720, 4732, 1102), PowerShell Operational (4103 module, 4104 script block), Sysmon/Operational (events 1, 3, 11, 12-14, 22 with ProcessGuid) and the EDR agent (telemetry plus own detections). Audit policy filters the Security log; the Sysmon XML config filters Sysmon. The EDR agent has a dashed response arrow back to the host activity. A Linux host (auth.log, journal, auditd) is a further source. All sources send events to the Collector / forwarder (agent, WEF or syslog), which sends parsed, normalised events to the SIEM (search, correlate, retain)."><title>Endpoint telemetry: sources, control points and collection</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="697" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-L01-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Endpoint telemetry: sources, control points and collection</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.755)"><path d="M561.3,81.0 L561.3,101.0 L512.9,101.0 L512.9,177.0 L403.4,177.0 L403.4,213.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="402.85133333333334" y="137" width="104