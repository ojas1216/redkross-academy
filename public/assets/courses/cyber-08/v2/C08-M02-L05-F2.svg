<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 315" width="1000" height="315" role="img" aria-label="Graph flowing left to right. Firewall syslog (fw01), with SRC= and DPT=3389 and local IST time with no year, feeds the parser from_syslog(), which uses a regular expression and converts IST to UTC. VPN gateway JSON, with clientIP, user and result, feeds the parser from_vpn_json(), which decodes JSON and renames fields. The edge from from_syslog() is labelled SRC to source.ip and the edge from from_vpn_json() is labelled clientIP to source.ip; both arrive at ECS-style event, with @timestamp (UTC), source.ip, event.module and event.action. That node feeds One search: source.ip = 203.0.113.66, via an edge labelled matches both events."><title>Normalisation: two raw formats, one ECS-style vocabulary</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="314" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-L05-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Normalisation: two raw formats, one ECS-style vocabulary</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.673)"><path d="M222.0,54.6 L278.0,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,165.8 L300.6,165.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M480.3,54.6 L711.0,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="543.283" y="27.625" width="104.696" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="595.6" y="41.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">SRC to source.ip</text><path d="M457.7,165.8 L665.0,165.8 L665.0,83.0 L711.0,83.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="536.275" y="172.75" width="118.71200000000002" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="595.6" y="186.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">clientIP to source.ip</text><path d="M921.0,68.8 L1157.7,68.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="976.987" y="75.83333333333333" width="124.724" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1039.3" y="89.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">matches both events</text><rect x="12" y="12" width="210" height="85.25" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="117.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Firewall syslog (fw01)</text><text x="117.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">SRC= DPT=3389; local IST, no</text><text x="117.0" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">year</text><rect x="48.852299999999985" y="131.25" width="173.14770000000001" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="135.4" y="159.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">VPN gateway JSON</text><text x="135.4" y="184.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">clientIP, user, result</text><rect x="278" y="20.125" width="202.275" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="379.1" y="48.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">from_syslog()</text><text x="379.1" y="73.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">regular expression, IST to UTC</text><rect x="300.56875" y="131.25" width="157.1375" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="379.1" y="159.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">from_vpn_json()</text><text x="379.1" y="184.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">JSON decode, rename</text><rect x="710.987" y="26.208333333333332" width="210" height="85.25" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="816.0" y="54.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">ECS-style event</text><text x="816.0" y="79.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">@timestamp (UTC), source.ip,</text><text x="816.0" y="95.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">event.module, event.action</text><rect x="1157.711" y="36.08333333333333" width="210" height="65.5" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="1262.7" y="64.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">One search: source.ip =</text><text x="1262.7" y="83.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">203.0.113.66</text></g><rect x="36" y="166.7603316926516" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="166.7603316926516" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="187.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Normalised, a firewall drop and a VPN login from the same address appear 21 seconds apart.</text></g><text x="964" y="303" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>