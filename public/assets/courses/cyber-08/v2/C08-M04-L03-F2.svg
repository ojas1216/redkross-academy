<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1069" width="1000" height="1069" role="img" aria-label="Decision graph. Suspicious request in access log (scan path, traversal or injection marker) leads to the decision Known authorised source? (own scanner, monitor, crawler, verified). Yes leads to Benign: document and tune. No leads to the decision What did the server return? It branches to 4xx: 400, 403, 404 (rejected or not found), which leads to Record; watch source and volume; to 5xx: 500, 502 (input reached code that failed), which leads to Read error and app logs (same second, same client), which with evidence it reached the query leads to Escalate as possible compromise; and to 2xx / 3xx (the request was served), which leads directly to Escalate as possible compromise (bytes, follow-on requests, host)."><title>Triage of a suspicious web request by the server&#39;s answer</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1068" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M04-L03-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Triage of a suspicious web request by the server&#39;s answer</text><g transform="translate(0,68)"><g transform="translate(188.3,4) scale(1.000)"><path d="M201.0,81.0 L201.0,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M159.5,206.0 L159.5,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="120.86245000000005" y="262" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="137.2" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M242.5,206.0 L242.5,216.0 L417.1,216.0 L417.1,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="424.08515000000006" y="262" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="437.8" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M361.4,384.8 L361.4,394.8 L147.2,394.8 L147.2,440.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M417.1,384.8 L417.1,440.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M472.7,384.8 L472.7,394.8 L531.7,394.8 L531.7,690.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M147.2,509.8 L147.2,565.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M417.1,509.8 L417.1,565.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M417.1,634.8 L417.1,815.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="239.66915000000006" y="715.25" width="171.416" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="325.4" y="729.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">evidence it reached the query</text><path d="M531.7,759.8 L531.7,769.8 L505.7,769.8 L505.7,815.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="70.6784166666667" y="12" width="260.6454" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="201.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Suspicious request in access log</text><text x="201.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">scan path, traversal or injection marker</text><rect x="76.6011166666667" y="137" width="248.8" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="201.0" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Known authorised source?</text><text x="201.0" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">own scanner, monitor, crawler (verified)</text><rect x="47.305950000000024" y="338" width="224.45700000000002" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="159.5" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Benign: document and tune</text><rect x="305.76295000000005" y="338" width="222.64440000000002" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="417.1" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">What did the server return?</text><rect x="66.76755000000003" y="440.75" width="160.8252" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="147.2" y="469.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">4xx: 400, 403, 404</text><text x="147.2" y="493.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">rejected or not found</text><rect x="320.0914" y="440.75" width="193.9875" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="417.1" y="469.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">5xx: 500, 502</text><text x="417.1" y="493.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">input reached code that failed</text><rect x="452.08515000000006" y="690.75" width="159.225" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="531.7" y="719.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">2xx / 3xx</text><text x="531.7" y="743.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">the request was served</text><rect x="12" y="565.75" width="270.36030000000005" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="147.2" y="594.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Record; watch source and volume</text><rect x="316.36030000000005" y="565.75" width="201.4497" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="417.1" y="594.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Read error and app logs</text><text x="417.1" y="618.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">same second, same client</text><rect x="328.44375" y="815.75" width="265.92420000000004" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="461.4" y="844.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Escalate as possible compromise</text><text x="461.4" y="868.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">bytes, follow-on requests, host</text></g><rect x="36" y="920.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="920.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="941.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The request shows intent; the response shows how far the input got.</text></g><text x="964" y="1057" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>