<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1092" width="1000" height="1092" role="img" aria-label="Top-to-bottom graph. Telemetry (endpoint, network, identity, cloud) feeds SIEM / EDR alerts (rules and models fire), which feed Case management (one record per case, owner, evidence), which feeds Tier 1: triage (validate, enrich, close or escalate). From Tier 1 one arrow goes to Closed with disposition (FP or benign true positive, documented) and another, labelled escalate, goes to Tier 2: investigation (scope, contain, coordinate IT). An arrow labelled escalate goes from Tier 2 to Tier 3: specialists (hunt, malware, forensics, detections). A dashed arrow labelled tuning and playbook feedback returns from Tier 3 to SIEM / EDR alerts. A SOC lead node (metrics, quality, stakeholders, CERT-In) has a dashed arrow labelled oversees to Case management."><title>The tiered SOC: escalation up, feedback down</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1091" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-L01-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The tiered SOC: escalation up, feedback down</text><g transform="translate(0,68)"><g transform="translate(66.5,4) scale(1.000)"><path d="M238.2,81.0 L238.2,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M211.7,206.0 L211.7,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M171.9,331.0 L171.9,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.1,456.0 L136.1,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M207.7,456.0 L207.7,466.0 L358.9,466.0 L358.9,637.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="294.1625" y="536.5" width="58.688" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="323.5" y="550.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">escalate</text><path d="M358.9,706.0 L358.9,838.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="294.1625" y="762" width="58.688" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="323.5" y="776.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">escalate</text><path d="M435.3,838.0 L435.3,792.0 L674.6,792.0 L674.6,216.0 L264.7,216.0 L264.7,206.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="681.5755" y="536.5" width="173.432" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="768.3" y="550.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">tuning and playbook feedback</text><path d="M517.2,512.0 L517.2,341.0 L251.6,341.0 L251.6,331.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="448.52899999999994" y="411.5" width="62.684000000000005" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="479.9" y="425.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">oversees</text><rect x="132.2161166666667" y="12" width="212.0375" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="238.2" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Telemetry</text><text x="238.2" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">endpoint, network, identity, cloud</text><rect x="158.7365166666667" y="137" width="158.9967" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="238.2" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">SIEM / EDR alerts</text><text x="238.2" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">rules and models fire</text><rect x="92.17291666666668" y="262" width="239.125" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="211.7" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Case management</text><text x="211.7" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">one record per case, owner, evidence</text><rect x="64.48125" y="387" width="214.8" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="171.9" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Tier 1: triage</text><text x="171.9" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">validate, enrich, close or escalate</text><rect x="12" y="512" width="248.1625" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="136.1" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Closed with disposition</text><text x="136.1" y="565.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">FP or benign true positive, documented</text><rect x="263.6005" y="637" width="190.5" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="358.9" y="665.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Tier 2: investigation</text><text x="358.9" y="690.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">scope, contain, coordinate IT</text><rect x="282.38800000000003" y="838" width="229.38750000000002" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="397.1" y="866.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 3: specialists</text><text x="397.1" y="891.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">hunt, malware, forensics, detections</text><rect x="393.8505" y="512" width="246.72500000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="517.2" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">SOC lead</text><text x="517.2" y="565.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">metrics, quality, stakeholders, CERT-In</text></g><rect x="36" y="943" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="943" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="963.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Each tier receives fewer, harder cases than the one below it; knowledge flows back to improve the queue.</text></g><text x="964" y="1080" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>