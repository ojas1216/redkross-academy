<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" role="img" aria-label="Table with columns Rule, Area, Finding and Action. R1, Severity (orange): level high but triage severity 3, while R5 high is 4; action: write a level-to-severity mapping and align both. R1, ATT&amp;CK tags (orange): cmd.exe branch not tagged T1059.003; action: add the tag. R1, Tests (orange): no cmd.exe or letter-case positive test; action: add both tests. R5, Data (orange): SQL has no source filter; action: add source=&#39;windows&#39; and convert with a pipeline. R5, Tests (red, blocking): no tests at all; action: add a positive and a near-miss negative. R5, ATT&amp;CK tags (violet): T1685.005 needed verifying; valid in ATT&amp;CK 20.1, T1070.001 is not; action: record the version and add the tactic tag."><title>Findings register from reviewing the kit&#39;s two rules</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="443" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L07-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Findings register from reviewing the kit&#39;s two rules</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">RULE