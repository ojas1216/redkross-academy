<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1086" width="1000" height="1086" role="img" aria-label="Top-to-bottom decision graph. Rule base severity, set by detection engineering, leads to Alert created, which starts at base severity. This leads to a decision, Triage: do the facts match?, comparing with the rule&#39;s typical case. Three labelled branches leave it: raise to Raise (corroborated, succeeded, later stage, wider scope), keep to Keep (typical case, no new facts) and lower to Lower (approved change, blocked, test system). All three lead to Recorded reclassification (who, when, old, new, reason), which leads to Linked into a case, which leads to Case severity: combined consequence, may be Critical."><title>Base, alert and case severity: how a value is revised</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1085" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L01-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Base, alert and case severity: how a value is revised</text><g transform="translate(0,68)"><g transform="translate(94.4,4) scale(1.000)"><path d="M218.7,81.0 L218.7,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M218.7,206.0 L218.7,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M162.0,331.0 L162.0,463.0" fill="none" stroke="#64748B" st