<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 397" width="1000" height="397" role="img" aria-label="Two code panels. Red panel Buggy: float minutes, with lines AND p.ts &gt;= d.ts and AND (julianday(p.ts) - julianday(d.ts)) * 1440 &lt;= 10, then the computed gap for 10 minutes, 10.000000074505806, and the result: &lt;= 10 is false, so the boundary chain is dropped. Green panel Fixed: integer seconds, with lines AND CAST(strftime(&#39;%s&#39;, p.ts) AS INTEGER) minus CAST(strftime(&#39;%s&#39;, d.ts) AS INTEGER) BETWEEN 0 AND 600, then the computed gap, 600, and the result: 0 &lt;= 600 &lt;= 600, so the boundary chain is kept."><title>R7 time window: floating-point bug versus integer fix</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="396" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L08-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">R7 time window: floating-point bug versus integer fix</text><g transform="translate(0,68)"><rect x="36" y="4" width="455" height="226.75" rx="10" fill="#0F172A" stroke="#F19A9A" stroke-width="1.5"/><rect x="36" y="4" width="455" height="32" rx="10" fill="#FEF2F2"/><rect x="36" y="26" width="455" height="10" fill="#FEF2F2"/><text x="50.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#7F1D1D" text-anchor="start">Buggy: float minutes</text><text x="50" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">AND p.ts &gt;= d.ts</text><text x="50" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">AND (julianday(p.ts)</text><text x="50" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">     - julianday(d.ts)) * 1440 &lt;= 10</text><text x="50" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">gap of exactly 10 minutes:</text><text x="50" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  10.000000074505806</text><text x="50" y="168.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="187.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">&lt;= 10 is false</text><text x="50" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">-&gt; boundary chain dropped</text><rect x="509" y="4" width="455" height="226.75" rx="10" fill="#0F172A" stroke="#6CCB95" stroke-width="1.5"/><rect x="509" y="4" width="455" height="32" rx="10" fill="#ECFDF3"/><rect x="509" y="26" width="455" height="10" fill="#ECFDF3"/><text x="523.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#14532D" text-anchor="start">Fixed: integer seconds</text><text x="523" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">AND CAST(strftime(&#39;%s&#39;, p.ts) AS INTEGER)</text><text x="523" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  - CAST(strftime(&#39;%s&#39;, d.ts) AS INTEGER)</text><text x="523" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  BETWEEN 0 AND 600</text><text x="523" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="523" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">gap of exactly 10 minutes:</text><text x="523" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  600</text><text x="523" y="168.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="523" y="187.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">0 &lt;= 600 &lt;= 600</text><text x="523" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">-&gt; boundary chain kept</text><rect x="36" y="248.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="248.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="269.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Only the boundary test (spawn at exactly 600 s) caught the bug; every other test passed with the buggy version.</text></g><text x="964" y="385" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>