<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1092" width="1000" height="1092" role="img" aria-label="Graph, top to bottom. A dark box Visible From: ap@example.org (the domain DMARC protects) sits at the top. Below it two branches. Left branch: a blue box SPF check (envelope MAIL FROM mailer.example.net, sending IP 203.0.113.45) leads to a green box spf=pass (for mailer.example.net), which leads to a red box Not aligned (mailer.example.net is not example.org). Right branch: a blue box DKIM check (signature d=mailer.example.net, s=s1) leads to a green box dkim=pass (for mailer.example.net), which also leads to the red Not aligned box. Not aligned leads to a red box dmarc=fail (header.from=example.org), which leads to a violet box Policy p=none (domain owner asks for no action), which leads to an orange box Delivered to the inbox (analyst must judge the rest)."><title>Why SPF and DKIM pass but DMARC fails</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1091" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M09-L01-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Why SPF and DKIM pass but DMARC fails</text><g transform="translate(0,68)"><g transform="translate(199.6,4) scale(1.000)"><path d="M162.0,81.0 L162.0,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M244.8,81.0 L244.8,91.0 L465.2,91.0 L465.2,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M162.0,206.0 L162.0,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M465.2,206.0 L465.2,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M162.0,331.0 L162.0,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="39.316" y="387" width="116.684" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="97.7" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">compare with From</text><path d="M465.2,331.0 L465.2,417.0 L242.4,417.0 L242.4,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="472.2125" y="387" width="116.684" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="530.6" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">compare with From</text><path d="M202.2,532.0 L202.2,588.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M202.2,657.0 L202.2,713.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M202.2,782.0 L202.2,838.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="79.17269999999999" y="12" width="248.48190000000002" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="203.4" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Visible From: ap@example.org</text><text x="203.4" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">the domain DMARC protects</text><rect x="12" y="137" width="300" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="162.0" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">SPF check</text><text x="162.0" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">MAIL FROM mailer.example.net, IP 203.0.113.45</text><rect x="346" y="137" width="238.42499999999998" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="465.2" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">DKIM check</text><text x="465.2" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">signature d=mailer.example.net, s=s1</text><rect x="85.17500000000001" y="262" width="153.64999999999998" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="162.0" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">spf=pass</text><text x="162.0" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">for mailer.example.net</text><rect x="388.3875" y="262" width="153.64999999999998" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="465.2" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">dkim=pass</text><text x="465.2" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">for mailer.example.net</text><rect x="81.60416666666667" y="463" width="241.1875" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="202.2" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Not aligned</text><text x="202.2" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">mailer.example.net is not example.org</text><rect x="115.46666666666667" y="588" width="173.4625" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="202.2" y="616.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">dmarc=fail</text><text x="202.2" y="641.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">header.from=example.org</text><rect x="97.22916666666667" y="713" width="209.9375" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="202.2" y="741.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Policy p=none</text><text x="202.2" y="766.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">domain owner asks for no action</text><rect x="110.31346666666667" y="838" width="183.7689" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="202.2" y="866.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Delivered to the inbox</text><text x="202.2" y="891.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">analyst must judge the rest</text></g><rect x="36" y="943" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="943" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="963.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A passing result concerns the checked identity. Alignment compares that domain with the visible From domain.</text></g><text x="964" y="1080" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>