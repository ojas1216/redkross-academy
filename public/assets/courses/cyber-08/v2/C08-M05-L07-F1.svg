<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" width="1000" height="525" role="img" aria-label="Table with columns Section, What it records and Main reader. Header: case ID, title, severity, status, owner, UTC open and close; read by the queue and the SOC lead. Summary: three to five plain sentences, kept current; read by the manager and the next analyst. Entities: hosts, users, IPs, domains, hashes with roles; read by the next analyst, who pivots on them. Timeline (UTC): time, source, event, why it matters, facts only; read by the incident handler. Analysis: hypotheses, confidence, what was ruled out; read by the next analyst and reviewer. Actions: what was done, by whom, approved by whom, when; read by the incident lead and auditor. Evidence: item, location, SHA-256, method, custody; read by the auditor. Disposition plus next steps: label, one-line reason, owned next actions; read by everyone, in violet like Analysis."><title>The eight sections of a defensible case record</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="524" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L07-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The eight sections of a defensible case record</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">SECTION</text><text x="291.9" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">WHAT IT RECORDS</text><text x="761.3" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">MAIN READER</text><rect x="36" y="42" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="42" width="4" height="36.225" rx="2" fill="#475569"/><text x="50.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start">Header</text><text x="291.9" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">case ID, title, severity, status, owner, UTC open/close</text><text x="761.3" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">queue, SOC lead</text><rect x="36" y="82.225" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="82.225" width="4" height="36.225" rx="2" fill="#2563EB"/><text x="50.0" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="start">Summary</text><text x="291.9" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">3-5 plain sentences, kept current</text><text x="761.3" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">manager, next analyst</text><rect x="36" y="122.44999999999999" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="122.44999999999999" width="4" height="36.225" rx="2" fill="#2563EB"/><text x="50.0" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="start">Entities</text><text x="291.9" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">hosts, users, IPs, domains, hashes + role</text><text x="761.3" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">next analyst (pivots)</text><rect x="36" y="162.67499999999998" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="162.67499999999998" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="50.0" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">Timeline (UTC)</text><text x="291.9" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">time, source, event, why it matters: facts only</text><text x="761.3" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">incident handler</text><rect x="36" y="202.89999999999998" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="202.89999999999998" width="4" height="36.225" rx="2" fill="#7C3AED"/><text x="50.0" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#3B2A7A" text-anchor="start">Analysis</text><text x="291.9" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">hypotheses, confidence, what was ruled out</text><text x="761.3" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">next analyst, reviewer</text><rect x="36" y="243.12499999999997" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="243.12499999999997" width="4" height="36.225" rx="2" fill="#16A34A"/><text x="50.0" y="265.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#14532D" text-anchor="start">Actions</text><text x="291.9" y="265.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">what, who did it, who approved, when</text><text x="761.3" y="265.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">incident lead, auditor</text><rect x="36" y="283.34999999999997" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="283.34999999999997" width="4" height="36.225" rx="2" fill="#16A34A"/><text x="50.0" y="305.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#14532D" text-anchor="start">Evidence</text><text x="291.9" y="305.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">item, location, SHA-256, method, custody</text><text x="761.3" y="305.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">auditor</text><rect x="36" y="323.575" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="323.575" width="4" height="36.225" rx="2" fill="#7C3AED"/><text x="50.0" y="346.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#3B2A7A" text-anchor="start">Disposition + next steps</text><text x="291.9" y="346.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">label, one-line reason, owned next actions</text><text x="761.3" y="346.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">everyone</text><rect x="36" y="375.8" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="375.8" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="396.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Facts go in the timeline, reasoning in the analysis, proof in the evidence list; the disposition must follow from all three.</text></g><text x="964" y="513" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>