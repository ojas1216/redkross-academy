<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 819" width="1000" height="819" role="img" aria-label="Graph. SOC analyst (facts, timeline, time noticed) sends status, facts to the IR lead (owns the incident and its comms). The IR lead has arrows to IT ops, identity, network (specific actions); Executives, business owners (impact, decisions); Legal, compliance, DPO (facts for obligations); Affected users, help desk (instructions); and Corporate communications (with legal). Legal, compliance, DPO sends reportability advice to CISO / CERT-In POC, which sends report to CERT-In (within 6 h of noticing). Legal, compliance, DPO also has an arrow to Other regulators, Data Protection Board. Corporate communications sends approved statements to Customers, media. There is no arrow from the SOC analyst to any external body."><title>Incident communication: who speaks to whom</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="818" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M08-L02-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Incident communication: who speaks to whom</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.745)"><path d="M181.2,81.0 L181.2,213.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="97.12833333333333" y="137" width="78.03200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="136.1" y="151.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">status, facts</text><path d="M111.0,282.0 L111.0,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M146.1,282.0 L146.1,322.0 L361.0,322.0 L361.0,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M181.2,282.0 L181.2,312.0 L612.7,312.0 L612.7,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M216.3,282.0 L216.3,302.0 L851.7,302.0 L851.7,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M251.4,282.0 L251.4,292.0 L1100.0,292.0 L1100.0,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M579.2,407.0 L579.2,584.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="459.1408" y="485.75" width="114.03200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="516.2" y="499.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">reportability advice</text><path d="M579.2,653.5 L579.2,785.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="527.8288" y="709.5" width="45.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="550.5" y="723.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">report</text><path d="M646.3,407.0 L646.3,417.0 L764.2,417.0 L764.2,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1100.0,407.0 L1100.0,584.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="1106.9738" y="485.75" width="126.05599999999998" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1170.0" y="499.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">approved statements</text><rect x="90.78533333333334" y="12" width="180.75" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="181.2" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">SOC analyst</text><text x="181.2" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">facts, timeline, time noticed</text><rect x="75.84783333333334" y="213" width="210.625" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="181.2" y="241.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">IR lead</text><text x="181.2" y="266.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">owns the incident and its comms</text><rect x="12" y="338" width="197.90400000000002" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="111.0" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">IT ops, identity, network</text><text x="111.0" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">specific actions</text><rect x="243.90400000000002" y="338" width="234.1242" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="361.0" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Executives, business owners</text><text x="361.0" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">impact, decisions</text><rect x="512.0282" y="338" width="201.4338" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="612.7" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Legal, compliance, DPO</text><text x="612.7" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">facts for obligations</text><rect x="747.462" y="338" width="208.52519999999998" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="851.7" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Affected users, help desk</text><text x="851.7" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">instructions</text><rect x="989.9872" y="338" width="219.97320000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="1100.0" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Corporate communications</text><text x="1100.0" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">with legal</text><rect x="487.74945" y="584.5" width="182.8467" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="579.2" y="612.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">CISO / CERT-In POC</text><text x="579.2" y="637.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">designated point of contact</text><rect x="507.54780000000005" y="785.5" width="143.25" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="579.2" y="813.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">CERT-In</text><text x="579.2" y="838.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">within 6 h of noticing</text><rect x="614.1728" y="463" width="300" height="65.5" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="764.2" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Other regulators, Data Protection</text><text x="764.2" y="510.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Board</text><rect x="1020.47545" y="584.5" width="158.9967" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="1100.0" y="612.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Customers, media</text></g><rect x="36" y="669.8576332871711" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="669.8576332871711" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="690.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The SOC never notifies an external body directly; its job is to make the designated roles&#39; messages accurate and on time.</text></g><text x="964" y="807" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>