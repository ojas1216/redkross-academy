1" y="181.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">CDN parent zones across</text><text x="499.1" y="199.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">many hosts</text><text x="713.1" y="181.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">How many clients ask, total name</text><text x="713.1" y="199.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">bytes</text><rect x="36" y="217.35000000000002" width="928" height="54.45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="217.35000000000002" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="50.0" y="239.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">High TXT share</text><text x="234.8" y="239.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Steady TXT or NULL queries from a</text><text x="234.8" y="258.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">workstation</text><text x="499.1" y="239.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Mail servers, SPF/DMARC</text><text x="499.1" y="258.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">checks</text><text x="713.1" y="239.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Client role and asking process</text><rect x="36" y="275.8" width="928" height="54.45" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="275.8" width="4" height="54.45" rx="2" fill="#