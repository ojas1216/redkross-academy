s-serif" font-size="13.5" fill="#0F172A" text-anchor="start">followed</text><rect x="36" y="404.7" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="404.7" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="425.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Several rows for one client and one parent zone in the same window outweigh any single row.</text></g><text x="964" y="541" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>