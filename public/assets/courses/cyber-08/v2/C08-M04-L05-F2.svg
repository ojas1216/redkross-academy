<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 553" width="1000" height="553" role="img" aria-label="Table with columns Pattern, In the log, Benign look-alike and Next check. Row 1 (red): NXDOMAIN burst; many random names fail from one client; typos, browser start-up probes; find the NOERROR success and its answer. Row 2 (red): Long high-entropy labels; labels near 63 characters, hex or Base32; CDN and security-product lookups; parent zone age and rarity. Row 3 (red): Many subdomains, one parent; hundreds of unique names under one zone; CDN parent zones across many hosts; how many clients ask, total name bytes. Row 4 (orange): High TXT share; steady TXT or NULL queries from a workstation; mail servers, SPF/DMARC checks; client role and asking process. Row 5 (orange): Direct or encrypted DNS; port 53 or 853 to outside, DoH to a provider; unmanaged or misconfigured device; asset inventory and egress policy. Row 6 (violet): Newly seen domain; first query for the name in the estate; new SaaS service adopted; registration age, who else asked, what followed."><title>DNS anomaly patterns: evidence, innocent twins and next checks</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="552" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M04-L05-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">DNS anomaly patterns: evidence, innocent twins and next checks</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">PATTERN</text><text x="234.8" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">IN THE LOG</text><text x="499.1" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">BENIGN LOOK-ALIKE</text><text x="713.1" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">NEXT CHECK</text><rect x="36" y="42" width="928" height="54.45" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="42" width="4" height="54.45" rx="2" fill="#DC2626"/><text x="50.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7F1D1D" text-anchor="start">NXDOMAIN burst</text><text x="234.8" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Many random names fail from one</text><text x="234.8" y="82.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">client</text><text x="499.1" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Typos, browser start-up</text><text x="499.1" y="82.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">probes</text><text x="713.1" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Find the NOERROR success and its</text><text x="713.1" y="82.7" font-family="Helve