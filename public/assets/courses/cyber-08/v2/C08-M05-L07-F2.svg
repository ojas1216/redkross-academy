<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 414" width="1000" height="414" role="img" aria-label="Two columns separated by vs. Left, green, Observed fact (cite the source): 06:14:00Z sysmon: WINWORD.EXE started hidden encoded PowerShell; 06:17-07:42Z proxy: 18 requests of 220 bytes, mean gap 300 s; 06:46:00Z vpn: gopal success from 203.0.113.66 after 8-account spray; 08:12:00Z proxy: bytes_out 48200000 to files-share-drop.example; no event links the VPN session to WS-104. Right, violet, Inference (state confidence): macro document executed code, high; command-and-control beaconing, high; gopal credential compromised, high, method unknown; probable exfiltration, medium, content unknown; VPN and phishing linked, hypothesis, low."><title>Fact or inference: the Banyan alerts written both ways</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="413" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L07-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Fact or inference: the Banyan alerts written both ways</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="243.57500000000002" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Observed fact (cite the source)</text><circle cx="56" cy="70" r="3.5" fill="#16A34A"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">06:14:00Z sysmon: WINWORD.EXE started hidden, encoded</text><text x="68.0" y="92.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">PowerShell</text><circle cx="56" cy="116.45" r="3.5" fill="#16A34A"/><text x="68.0" y="120.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">06:17-07:42Z proxy: 18 requests, 220 bytes, mean gap 300 s</text><circle cx="56" cy="144.675" r="3.5" fill="#16A34A"/><text x="68.0" y="148.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">06:46:00Z vpn: gopal success from 203.0.113.66 after 8-account</text><text x="68.0" y="166.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">spray</text><circle cx="56" cy="191.125" r="3.5" fill="#16A34A"/><text x="68.0" y="195.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">08:12:00Z proxy: bytes_out 48200000 to files-share-drop.example</text><circle cx="56" cy="219.35" r="3.5" fill="#16A34A"/><text x="68.0" y="223.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">No event links the VPN session to WS-104</text><rect x="511" y="4" width="453" height="243.57500000000002" rx="12" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#3B2A7A" text-anchor="middle">Inference (state confidence)</text><circle cx="531" cy="70" r="3.5" fill="#7C3AED"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Macro document executed code: high</text><circle cx="531" cy="98.225" r="3.5" fill="#7C3AED"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Command-and-control beaconing: high</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#7C3AED"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">gopal credential compromised: high (method unknown)</text><circle cx="531" cy="154.67499999999998" r="3.5" fill="#7C3AED"/><text x="543.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Probable exfiltration: medium (content unknown)</text><circle cx="531" cy="182.89999999999998" r="3.5" fill="#7C3AED"/><text x="543.0" y="186.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">VPN and phishing linked: hypothesis, low</text><circle cx="500" cy="125.78750000000001" r="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="130.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">vs</text><rect x="36" y="265.57500000000005" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="265.57500000000005" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="286.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A fact can be re-run as a query; an inference can only be argued, so it must carry its confidence.</text></g><text x="964" y="402" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>