<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1043" width="1000" height="1043" role="img" aria-label="Decision graph. Indicator lookup (ioc_match.py against minisiem events) has two outcomes. No match (sha256: the dataset holds no hashes) leads to Absence is not evidence (check telemetry coverage). A match leads to the decision Still valid on the as-of date? No leads to EXPIRED: review before acting (198.51.100.104 matches a routine VPN login), which has a dashed arrow to Validate in raw events. Yes leads to the decision Confidence, source, specificity? Low or shared leads to Weak: context only (low confidence, shared hosting), dashed to Validate in raw events. High and specific leads to Strong: raise priority (cdn-telemetry-sync.example, conf 85, ISAC-A), solid to Validate in raw events (Lesson 4)."><title>Interpreting an indicator lookup</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1042" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L03-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Interpreting an indicator lookup</text><g transform="translate(0,68)"><g transform="translate(80.4,4) scale(1.000)"><path d="M525.7,81.0 L525.7,91.0 L129.2,91.0 L129.2,213.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="80.47000000000003" y="137" width="42.68" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="101.8" y="151.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">0 hits</text><path d="M129.2,282.0 L129.2,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M605.9,81.0 L605.9,227.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="612.89355" y="137" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="629.2" y="151.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">hits</text><path d="M568.3,274.6 L568.3,292.0 L297.7,292.0 L297.7,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="264.32005" y="362.5" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="278.0" y="376.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M643.4,274.6 L643.4,477.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="650.44615" y="362.5" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="666.8" y="376.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M601.2,524.6 L601.2,542.0 L409.5,542.0 L409.5,664.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="324.77829999999994" y="588" width="78.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="364.1" y="602.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">low / shared</text><path d="M685.7,524.6 L685.7,664.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="596.3478" y="588" width="83.36" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="638.0" y="602.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">high, specific</text><path d="M409.5,733.0 L409.5,789.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><path d="M297.7,532.0 L297.7,743.0 L363.1,743.0 L363.1,789.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><path d="M685.7,733.0 L685.7,743.0 L455.9,743.0 L455.9,789.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="445.56854999999996" y="12" width="240.48749999999998" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="565.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Indicator lookup</text><text x="565.8" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ioc_match.py against minisiem events</text><rect x="12" y="213" width="234.3" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="129.2" y="241.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">No match</text><text x="129.2" y="266.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">sha256: the dataset holds no hashes</text><rect x="27.97995000000003" y="338" width="202.3401" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="129.2" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Absence is not evidence</text><text x="129.2" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">check telemetry coverage</text><rect x="493.23574999999994" y="227.83333333333334" width="225.31560000000002" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="605.9" y="256.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Still valid on the as-of date?</text><rect x="158.28904999999997" y="463" width="278.75" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="297.7" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">EXPIRED: review before acting</text><text x="297.7" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">198.51.100.104 matches a routine VPN login</text><rect x="516.6612" y="477.8333333333333" width="253.5699" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="643.4" y="506.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Confidence, source, specificity?</text><rect x="308.66405" y="664" width="201.61249999999998" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="409.5" y="692.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Weak: context only</text><text x="409.5" y="717.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">low confidence, shared hosting</text><rect x="544.2765499999999" y="664" width="282.86249999999995" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="685.7" y="692.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Strong: raise priority</text><text x="685.7" y="717.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">cdn-telemetry-sync.example, conf 85, ISAC-A</text><rect x="316.7034" y="789" width="185.53379999999999" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="409.5" y="817.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Validate in raw events</text><text x="409.5" y="842.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Lesson 4</text></g><rect x="36" y="894" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="894" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="914.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A match is evidence weighted by validity, confidence and fit; it never closes an alert or opens an incident on its own.</text></g><text x="964" y="1031" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>