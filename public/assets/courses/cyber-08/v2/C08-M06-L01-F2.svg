<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" role="img" aria-label="Table with five columns: Indicator (lab), Class, Pyramid level, Shelf life, Telemetry needed. Row 1: 9f2c...e1a0 (invoice.docm), computed, hash, precise but soon irrelevant, file hashes (EDR, mail gateway), not collected in the lab. Row 2: 203.0.113.66, atomic, IP address, days (window 7 days), VPN or firewall source IP. Row 3: cdn-telemetry-sync.example, atomic, domain, weeks to months (window 58 days), proxy or DNS logs. Row 4: banyan-payroll-update.example, atomic, domain (look-alike), while registered (window 27 days), proxy or DNS logs. Row 5: beacon, 300 s, cv 0.004, computed, network artefact, life of the tooling, proxy timestamps and sizes. Row 6: R1 Word starts PowerShell, behavioural, TTP, long, Sysmon process creation with parent. Rows run from slate and blue tones to red and dark."><title>Indicators in the lab: class, level, shelf life, telemetry</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="443" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L01-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Indicators in the lab: class, level, shelf life, telemetry</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation