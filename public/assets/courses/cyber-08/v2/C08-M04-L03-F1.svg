<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 297" width="1000" height="297" role="img" aria-label="Segment diagram of one access-log line, left to right: Client address 198.51.100.23 (%h), Identity - (%l), User - (%u), Time [03/Nov/2026:10:04:33 +0530] (%t), Request line GET /account/statement?month=10%27... (&quot;%r&quot;), Status 500 (%&gt;s), Bytes 531 (%b), then the two Combined additions Referer - and User-Agent Mozilla/5.0 (X11; Linux x86_64)."><title>Anatomy of a Combined Log Format access-log line</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="296" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M04-L03-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Anatomy of a Combined Log Format access-log line</text><g transform="translate(0,68)"><rect x="37" y="30" width="116.27450980392159" height="96" rx="6" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="95.1" y="72.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="middle">Client address</text><text x="95.1" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">198.51.100.23</text><text x="95.1" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anch