st line, Referer and User-Agent are written by the client; status and bytes are written by the server.</text></g><text x="964" y="285" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>