<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 793" width="1000" height="793" role="img" aria-label="Graph. Event (info, date, threat level, analysis, distribution) contains Attribute (category, type, value, to_ids) and contains Object (template: file, url, domain-ip). Object groups Attribute and has an Object reference (relationship type). Event and Attribute are each tagged with Tag (taxonomy), for example tlp:amber and Admiralty scale. Event relates to Galaxy cluster (ATT&amp;CK technique, threat actor). Sighting (seen, false positive, expired) points to Attribute, labelled about."><title>The MISP data model</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="792" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L04-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The MISP data model</text><g transform="translate(0,68)"><g transform="translate(112.8,4) scale(1.000)"><path d="M130.5,81.0 L130.5,111.0 L204.5,111.0 L204.5,213.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="139.81875000000002" y="137" width="58.688" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="169.2" y="151.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">contains</text><path d="M76.7,81.0 L76.7,414.0" fill="none" stroke="#64748B" stroke-width="1.8" marke