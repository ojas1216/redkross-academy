<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 918" width="1000" height="918" role="img" aria-label="A workflow validates its scope, verifies current authority, checks for a prior effect, and runs a permitted step only when necessary. Existing verified effects link to the case. Failed or unknown checks route to human review."><title>Safe playbook checks at each boundary</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="917" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M11-L07-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Safe playbook checks at each boundary</text><g transform="translate(0,68)"><g transform="translate(227.7,4) scale(1.000)"><path d="M195.3,81.0 L195.3,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M283.3,81.0 L283.3,91.0 L498.8,91.0 L498.8,493.0 L482.9,493.0 L482.9,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="444.15740000000005" y="262" width="48.68" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="468.5" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Invalid</text><path d="M162.9,206.0 L162.9,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="91.5286" y="262" width="65.348" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="124.2" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Permitted</text><path d="M227.7,206.0 L227.7,216.0 L433.2,216.0 L433.2,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="307.78540000000004" y="362.5" width="119.37200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="367.5" y="376.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">No current authority</text><path d="M107.4,407.0 L107.4,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30.7342" y="463" width="70.688" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="66.1" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">New effect</text><path d="M162.9,407.0 L162.9,427.0 L221.1,427.0 L221.1,618.0 L174.0,618.0 L174.0,664.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="118.4222" y="463" width="96.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="166.8" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Already verified</text><path d="M218.3,407.0 L218.3,417.0 L303.5,417.0 L303.5,493.0 L383.5,493.0 L383.5,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="232.11419999999998" y="463" width="65.348" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="264.8" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Uncertain</text><path d="M107.4,608.0 L107.4,664.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="107.20065000000001" y="12" width="264.207" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="239.3" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Validate scope and preconditions</text><text x="239.3" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Source, target and intended effect</text><rect x="98.0905" y="137" width="194.3583" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="195.3" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Check current authority</text><text x="195.3" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Action, approval and expiry</text><rect x="51.9678" y="338" width="221.81760000000003" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="162.9" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Look up the intended effect</text><text x="162.9" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Stable effect identity</text><rect x="12" y="539" width="190.8444" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="107.4" y="567.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Run the permitted step</text><text x="107.4" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Record the resulting state</text><rect x="40.86590000000001" y="664" width="199.6689" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="140.7" y="692.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Verify and link the result</text><text x="140.7" y="717.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Retain outcome evidence</text><rect x="333.76815000000005" y="539" width="198.7785" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="433.2" y="567.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Route for human review</text><text x="433.2" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">State reason and owner</text></g><rect x="36" y="769" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="769" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="789.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Unknown effects stay open for reconciliation.</text></g><text x="964" y="906" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>