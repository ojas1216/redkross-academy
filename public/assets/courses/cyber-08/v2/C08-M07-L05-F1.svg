<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" width="1000" height="1320" role="img" aria-label="Decision graph, top to bottom. A slate box, Noisy rule (measured precision and volume), leads to a violet decision: Is the data wrong? Yes leads to Fix parser or normalisation; no leads to the next decision: Logic broader than intent? Yes leads to Narrow the logic; no leads to: Threshold or window off baseline? Yes leads to Re-set from measured baseline; no leads to: Known authorised instance? Yes leads to Scoped suppression (owner, reason, expiry); no leads to Lower priority, keep visible. All five outcome boxes lead to one dark box: Tests, replay and review."><title>Diagnosing a noisy rule before choosing the change</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1319" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L05-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Diagnosing a noisy rule before choosing the change</text><g transform="translate(0,68)"><g transform="translate(105.1,4) scale(1.000)"><path d="M516.8,81.0 L516.8,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M483.9,206.0 L483.9,216.0 L121.1,216.0 L121.1,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="82.42419999999998" y="262" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="98.8" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M549.7,206.0 L549.7,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="556.7221666666667" y="262" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="570.4" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M513.8,407.0 L513.8,417.0 L204.5,417.0 L204.5,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="165.85500000000002" y="463" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="182.2" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M585.6,407.0 L585.6,539.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="552.29275" y="463" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="566.0" y="477.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M540.4,608.0 L540.4,618.0 L341.4,618.0 L341.4,740.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="302.74955" y="664" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="319.1" y="678.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M630.8,608.0 L630.8,740.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="597.5011999999999" y="664" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="611.2" y="678.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M592.6,809.0 L592.6,819.0 L439.4,819.0 L439.4,941.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400.77655" y="865" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="417.1" y="879.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M669.1,809.0 L669.1,941.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="635.7905" y="865" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="649.5" y="879.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M121.1,407.0 L121.1,1030.0 L274.0,1030.0 L274.0,1066.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M204.5,608.0 L204.5,1020.0 L307.7,1020.0 L307.7,1066.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M341.4,809.0 L341.4,1066.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M439.4,1010.0 L439.4,1020.0 L375.1,1020.0 L375.1,1066.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M669.1,1010.0 L669.1,1030.0 L408.9,1030.0 L408.9,1066.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="413.2450833333333" y="12" width="207.15" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="516.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Noisy rule</text><text x="516.8" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">measured precision and volume</text><rect x="418.1138333333333" y="137" width="197.41250000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="516.8" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Is the data wrong?</text><text x="516.8" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">raw event vs normalised fields</text><rect x="12" y="338" width="218.1924" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="121.1" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Fix parser or normalisation</text><text x="121.1" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">every rule benefits</text><rect x="441.9784166666666" y="338" width="215.4875" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="549.7" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Logic broader than intent?</text><text x="549.7" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">compare with title and description</text><rect x="132.0962" y="539" width="144.8616" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="204.5" y="567.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Narrow the logic</text><text x="204.5" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">applies to every host</text><rect x="450.0114" y="539" width="271.25070000000005" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="585.6" y="567.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Threshold or window off baseline?</text><text x="585.6" y="592.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">answer with a sweep</text><rect x="215.527" y="740" width="251.7891" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="341.4" y="768.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Re-set from measured baseline</text><text x="341.4" y="793.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">and attack-step spacing</text><rect x="515.9773" y="740" width="229.73579999999998" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="630.8" y="768.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Known authorised instance?</text><text x="630.8" y="793.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">approval record, not identity</text><rect x="352.42154999999997" y="941" width="174.054" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="439.4" y="969.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Scoped suppression</text><text x="439.4" y="994.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">owner, reason, expiry</text><rect x="560.47555" y="941" width="217.3179" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="669.1" y="969.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Lower priority, keep visible</text><text x="669.1" y="994.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">context-based confidence</text><rect x="240.26739999999995" y="1066" width="202.3083" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="341.4" y="1094.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tests, replay and review</text><text x="341.4" y="1119.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">the common gate</text></g><rect x="36" y="1171" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="1171" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="1191.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Stop at the first yes: the higher the fix, the wider and more durable its effect.</text></g><text x="964" y="1308" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>