<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 717" width="1000" height="717" role="img" aria-label="Decision graph. Alert reaches SOC queue, where SLA clocks start in UTC, leads to Analyst acknowledges, which stops time to acknowledge. A dashed failure path labelled no owner yet leads from the start to 75% of target elapsed, which warns the owner and shift lead, and a further dashed arrow labelled still no owner leads to Target missed: breach, which escalates and records a reason code. Analyst acknowledges leads to a Triage decision with three branches: benign to Closed: false or benign, where triage and resolve clocks stop; malicious to Escalated as incident, where time to notify starts; and needs customer input to Awaiting customer, where the clock pauses only if the SLA allows. Awaiting customer returns to the triage decision when the reply is received."><title>SLA timers on one case: start, stop, pause, warn, breach</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="716" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-L06-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">SLA timers on one case: start, stop, pause, warn, breach</text><g transform="translate(0,68)"><g transform="translate(51.8,4) scale(1.000)"><path d="M718.5,81.0 L718.5,91.0 L549.8,91.0 L549.8,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M788.9,81.0 L788.9,262.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="795.8578499999999" y="161.5" width="82.69999999999999" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="837.2" y="175.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no owner yet</text><path d="M788.9,331.0 L788.9,463.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="698.8378499999999" y="387" width="84.02" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="740.8" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">still no owner</text><path d="M549.8,206.0 L549.8,279.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M508.5,326.6 L508.5,341.0 L109.3,341.0 L109.3,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="53.301000000000045" y="387" width="50.024" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="78.3" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">benign</text><path d="M536.0,326.6 L536.0,351.0 L330.8,351.0 L330.8,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="260.76554999999996" y="387" width="64.00399999999999" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="292.8" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">malicious</text><path d="M563.6,326.6 L563.6,417.0 L523.0,417.0 L523.0,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="428.85869999999994" y="387" width="128.72" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="493.2" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">needs customer input</text><path d="M591.1,463.0 L591.1,326.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="598.1390999999999" y="387" width="88.688" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="642.5" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">reply received</text><rect x="648.0814499999999" y="12" width="211.1646" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="753.7" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Alert reaches SOC queue</text><text x="753.7" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">SLA clocks start, UTC</text><rect x="456.1491499999999" y="137" width="187.29870000000003" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="549.8" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Analyst acknowledges</text><text x="549.8" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">time to acknowledge stops</text><rect x="696.5202499999999" y="262" width="184.6752" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="788.9" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">75% of target elapsed</text><text x="788.9" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">warn owner and shift lead</text><rect x="693.2640999999999" y="463" width="191.1875" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="788.9" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Target missed: breach</text><text x="788.9" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">escalate, record reason code</text><rect x="480.8974999999999" y="279.8" width="137.80200000000002" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="549.8" y="308.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Triage decision</text><rect x="12" y="463" width="194.65" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="109.3" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Closed: false or benign</text><text x="109.3" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">triage and resolve clocks stop</text><rect x="240.64999999999998" y="463" width="180.23909999999998" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="330.8" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Escalated as incident</text><text x="330.8" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">time to notify starts</text><rect x="454.8890999999999" y="463" width="204.375" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="557.1" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Awaiting customer</text><text x="557.1" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">clock paused only if SLA allows</text></g><rect x="36" y="568" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="568" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="588.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Every arrow is a timestamped event in the case record; the SLA engine computes elapsed time from those events, minus permitted pauses.</text></g><text x="964" y="705" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>