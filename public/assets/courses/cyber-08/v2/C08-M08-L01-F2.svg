#3B2A7A" text-anchor="middle">Improvement</text><text x="452.1" y="657.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ID.IM, inside Identify</text></g><rect x="36" y="709.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="709.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="729.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Same work, different framing: incident response becomes part of risk management, and learning happens during the incident, not only after it.</text></g><text x="964" y="846" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>