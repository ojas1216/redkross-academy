<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Five steps show a typed observation, a normalised query key, a scope and policy check, approved lookup response, and a case result with provenance and limitations."><title>Attach context with provenance and limits</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="639" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M11-L05-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Attach context with provenance and limits</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Keep observed value and source</text><text x="500.0" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Retain original evidence reference</text><line x1="500.0" y1="80.0" x2="500.0" y2="104.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="107" width="560" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="135.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Prepare the typed query key</text><text x="500.0" y="160.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Preserve the normalisation boundary</text><line x1="500.0" y1="179.0" x2="500.0" y2="203.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="206" width="560" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="234.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Check source and sharing policy</text><text x="500.0" y="259.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Hold for review when not allowed</text><line x1="500.0" y1="278.0" x2="500.0" y2="302.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="305" width="560" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="333.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Use the approved lookup</text><text x="500.0" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Match, no match, stale or error</text><line x1="500.0" y1="377.0" x2="500.0" y2="401.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="404" width="560" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="432.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Record evidence and decision</text><text x="500.0" y="457.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Include original source and freshness</text><rect x="36" y="491" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="491" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="511.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">An unavailable source cannot support a negative finding.</text></g><text x="964" y="628" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>