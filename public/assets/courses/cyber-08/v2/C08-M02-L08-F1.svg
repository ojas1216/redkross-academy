<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" height="384" role="img" aria-label="Graph diagram. make_dataset.py (sources + collection, fixed seed) writes banyan_events.jsonl (340 JSON lines). minisiem.py load parses each line and writes the events table in minisiem.db (12 field columns + raw). minisiem.py search queries the events table. Source-health checks (inventory, volume, silence, completeness) run through minisiem.py search. A separate branch: a Raw syslog line (firewall, local time, no year) and a Raw VPN JSON record (UTC) both go into normalise_demo.py, which outputs Normalised events with ECS-style names and UTC time. A dashed arrow from make_faults.py (outage, broken, dup copies) goes to minisiem.py load, showing that the fault drills reuse the same ingestion path."><title>The C08 lab kit as a collection pipeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="383" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-L08-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The C08 lab kit as a collection pipeline</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.520)"><path d="M216.0,259.4 L373.4,259.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="272.0375" y="266.375" width="45.332" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="294.7" y="280.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">writes</text><path d="M548.3,259.4 L704.3,259.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="604.3139000000001" y="266.375" width="44.012" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="626.3" y="280.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">reads</text><path d="M859.4,247.9 L1073.4,247.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="941.7404" y="220.875" width="49.339999999999996" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="966.4" y="234.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">inserts</text><path d="M1283.4,247.9 L1339.4,247.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1505.5,247.9 L1561.5,247.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1073.4,360.3 L869.4,360.3 L869.4,270.9 L859.4,270.9" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="915.3884" y="367.25" width="102.044" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="966.4" y="381.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">damaged copies</text><path d="M189.3,46.5 L245.3,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M189.3,149.5 L199.3,149.5 L199.3,69.5 L245.3,69.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M414.0,58.0 L470.0,58.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="224.875" width="204.0375" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="114.0" y="253.1" font-fami