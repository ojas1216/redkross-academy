 rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="1422.5" y="241.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">minisiem.py search</text><text x="1422.5" y="266.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">SQL as query language</text><rect x="1561.4887" y="205.25" width="210" height="85.25" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="1666.5" y="233.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Source-health checks</text><text x="1666.5" y="258.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">inventory, volume, silence,</text><text x="1666.5" y="274.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">completeness</text><rect x="1073.4324000000001" y="325.75" width="180.7875" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="1163.8" y="354.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">make_faults.py</text><text x="1163.8" y="378.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">outage, broken, dup copies</text><rect x="12" y="12" width="177.26250000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="100.6" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Raw syslog line</text><text x="100.6" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">firewall, local time, no y