<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Graph, left to right. Preparation (people, tools, playbooks, telemetry) leads to Detection and Analysis (alerts, triage, scoping, declare), which leads to Containment, Eradication and Recovery (stop harm, remove attacker, restore), which leads to Post-Incident Activity (lessons learned, evidence retention). A dashed arrow labelled new indicators, rescope runs from Containment, Eradication and Recovery back to Detection and Analysis. A dashed arrow labelled improvements runs from Post-Incident Activity back to Preparation."><title>The NIST SP 800-61 Rev. 2 incident response lifecycle</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M08-L01-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The NIST SP 800-61 Rev. 2 incident response lifecycle</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.764)"><path d="M222.0,58.2 L278.0,58.2" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M474.7,46.7 L726.8,46.7" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M726.8,81.3 L680.8,81.3 L680.8,69.7 L474.7,69.7" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="530.7375" y="76.66666666666667" width="140.048" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="600.8" y="90.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">new indicators, rescope</text><path d="M936.8,64.0 L992.8,64.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M992.8,92.4 L946.8,92.4 L946.8,126.0 L232.0,126.0 L232.0,86.6 L222.0,86.6" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="556.0875" y="133" width="89.348" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="600.8" y="147.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">improvements</text><rect x="12" y="29.750000000000004" width="210" height="85.25" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="117.0" y="58.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Preparation</text><text x="117.0" y="82.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">people, tools, playbooks,</text><text x="117.0" y="99.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">telemetry</text><rect x="278" y="23.66666666666667" width="196.7375" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="376.4" y="51.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Detection and Analysis</text><text x="376.4" y="76.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">alerts, triage, scoping, declare</text><rect x="726.7855" y="12" width="210" height="104" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="831.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Containment, Eradication</text><text x="831.8" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">and Recovery</text><text x="831.8" y="83.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">stop harm, remove attacker,</text><text x="831.8" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">restore</text><rect x="992.7855" y="35.58333333333333" width="210" height="85.25" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="1097.8" y="63.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Post-Incident Activity</text><text x="1097.8" y="88.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">lessons learned, evidence</text><text x="1097.8" y="104.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">retention</text></g><rect x="36" y="150.810864963403" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="150.810864963403" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="171.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Analysis and containment alternate until the scope stops growing; every incident feeds back into preparation.</text></g><text x="964" y="288" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>