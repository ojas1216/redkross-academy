<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" width="1000" height="378" role="img" aria-label="Two-column comparison. Classic tiered SOC: work organised by depth (T1, T2, T3); case changes hands at each escalation; clear entry role and career ladder; Tier 1 queue is repetitive, burnout risk; easy to staff and measure per tier. Versus Functional teams: work organised by function (detect, respond, hunt); one analyst owns a case end to end; mixed seniority within each team; repetitive triage automated (SOAR); needs strong automation and mentoring."><title>Classic tiers versus functional teams</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="377" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-L01-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Classic tiers versus functional teams</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="207.125" rx="12" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle">Classic tiered SOC</text><circle cx="56" cy="70" r="3.5" fill="#2563EB"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Work organised by depth: T1, T2, T3</text><circle cx="56" cy="98.225" r="3.5" fill="#2563EB"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Case changes hands at each escalation</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#2563EB"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Clear entry role and career ladder</text><circle cx="56" cy="154.67499999999998" r="3.5" fill="#2563EB"/><text x="68.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Tier 1 queue is repetitive, burnout risk</text><circle cx="56" cy="182.89999999999998" r="3.5" fill="#2563EB"/><text x="68.0" y="186.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Easy to staff and measure per tier</text><rect x="511" y="4" width="453" height="207.125" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Functional teams</text><circle cx="531" cy="70" r="3.5" fill="#16A34A"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Work organised by function: detect, respond, hunt</text><circle cx="531" cy="98.225" r="3.5" fill="#16A34A"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">One analyst owns a case end to end</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#16A34A"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Mixed seniority within each team</text><circle cx="531" cy="154.67499999999998" r="3.5" fill="#16A34A"/><text x="543.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Repetitive triage automated (SOAR)</text><circle cx="531" cy="182.89999999999998" r="3.5" fill="#16A34A"/><text x="543.0" y="186.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Needs strong automation and mentoring</text><circle cx="500" cy="107.5625" r="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="112.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">vs</text><rect x="36" y="229.125" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="229.125" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="249.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Most real SOCs blend the two: what matters is clear ownership, written criteria and a working feedback loop.</text></g><text x="964" y="366" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>