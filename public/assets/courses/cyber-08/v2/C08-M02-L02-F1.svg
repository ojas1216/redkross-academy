E8F0"/><rect x="36" y="773.6853634477362" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="794.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Each log is a view from one vantage point; traffic that avoids a point is invisible to it.</text></g><text x="964" y="910" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>