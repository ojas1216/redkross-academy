<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 922" width="1000" height="922" role="img" aria-label="Graph diagram. Workstation WS-104 (10.40.0.23, finance) sends a name lookup to the DNS resolver (query logs: client, name, type, rcode), HTTP(S) requests to the Web proxy / SWG (URL, user, status, bytes) and SMB on port 445 to the Internal file server (east-west destination). The DHCP server (lease logs: IP to host over time) assigns the workstation&#39;s address. The proxy sends egress to the Perimeter firewall (5-tuple, action, rule, NAT), which connects to the Internet (203.0.113.0/24 and other external hosts). A dashed SPAN / tap copy goes from the firewall to the NSM / IDS sensor (Zeek logs, Suricata alerts). A Flow exporter (switch / router: NetFlow, IPFIX) summarises the file-server traffic. The DNS resolver, DHCP server, proxy, firewall, sensor and flow exporter each send logs to the SIEM."><title>Network vantage points and the telemetry each produces</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="921" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-L02-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Network vantage points and the telemetry each produces</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.789)"><path d="M112.5,213.0 L112.5,91.0 L300.5,91.0 L300.5,81.0" fill="none" stroke="#64748B" s