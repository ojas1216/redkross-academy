<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" width="1000" height="434" role="img" aria-label="Comparison of two columns. minisiem load() (teaching): one file, one line per event; source copied from the event; event time only, no ingest time; everything in one table; duplicates stored silently (341 vs 340); one bad line aborts the load, table left empty; raw kept beside 12 columns. Production ingestion: many inputs, per-source-type breaking rules; host, source and source type set and validated; event time plus ingest time recorded; routing by data type, retention and access; de-duplication or a duplicate-rate check; bad events quarantined, the rest ingested; raw kept beside parsed fields."><title>minisiem load() versus production ingestion</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="433" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L01-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">minisiem load() versus production ingestion</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="263.575" rx="12" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7A3A06" text-anchor="middle">minisiem load() (teaching)</text><circle cx="56" cy="70" r="3.5" fill="#EA6A0A"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">One file, one line per event</text><circle cx="56" cy="98.225" r="3.5" fill="#EA6A0A"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">source copied from the event</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#EA6A0A"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Event time only; no ingest time</text><circle cx="56" cy="154.67499999999998" r="3.5" fill="#EA6A0A"/><text x="68.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Everything in one table</text><circle cx="56" cy="182.89999999999998" r="3.5" fill="#EA6A0A"/><text x="68.0" y="186.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Duplicates stored silently (341 vs 340)</text><circle cx="56" cy="211.12499999999997" r="3.5" fill="#EA6A0A"/><text x="68.0" y="215.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">One bad line aborts the load; table left empty</text><circle cx="56" cy="239.34999999999997" r="3.5" fill="#EA6A0A"/><text x="68.0" y="243.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Raw kept beside 12 columns</text><rect x="511" y="4" width="453" height="263.575" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Production ingestion</text><circle cx="531" cy="70" r="3.5" fill="#16A34A"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Many inputs, per-source-type breaking rules</text><circle cx="531" cy="98.225" r="3.5" fill="#16A34A"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">host, source and source type set and validated</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#16A34A"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Event time plus ingest time recorded</text><circle cx="531" cy="154.67499999999998" r="3.5" fill="#16A34A"/><text x="543.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Routing by data type, retention and access</text><circle cx="531" cy="182.89999999999998" r="3.5" fill="#16A34A"/><text x="543.0" y="186.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">De-duplication or a duplicate-rate check</text><circle cx="531" cy="211.12499999999997" r="3.5" fill="#16A34A"/><text x="543.0" y="215.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Bad events quarantined, the rest ingested</text><circle cx="531" cy="239.34999999999997" r="3.5" fill="#16A34A"/><text x="543.0" y="243.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Raw kept beside parsed fields</text><circle cx="500" cy="135.7875" r="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="140.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">vs</text><rect x="36" y="285.575" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="285.575" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="306.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Test ingestion with imperfect input before trusting it.</text></g><text x="964" y="422" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>