A6A0A"/><text x="56.0" y="337.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A responsibility map, not a headcount chart: one person may hold several boxes, but every box needs an owner.</text></g><text x="964" y="454" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>