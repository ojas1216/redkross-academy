<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 609" width="1000" height="609" role="img" aria-label="Graph, top to bottom. Three blue boxes at the top: Functional impact (none, low, medium, high), Information impact (none, privacy, proprietary, integrity) and Recoverability (regular, supplemented, extended, not recoverable). All three point to the orange box Impact level (highest of the three, 1 to 4). Impact level and the slate box Scope (contained, several, widespread) both point to the violet box Base SEV from the matrix (impact x scope). Base SEV points to the dark box Incident severity of record (SEV1 to SEV4, owned by the IR lead). The red box Urgency (immediate, pressing, deferred) also points to it, with the edge label adjust by one level, and the violet box Floor rules (for example, confirmed attacker access: at least SEV2) points to it with the label never below."><title>How the Banyan matrix turns facts into an incident severity</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="608" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M08-L05-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">How the Banyan matrix turns facts into an incident severity</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.902)"><path d="M100.0,97.3 L100.0,153.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M338.0,97.3 L338.0,107.3 L140.5,107.3 L140.5,153.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M638.1,97.3 L638.1,117.3 L181.0,117.3 L181.0,153.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M140.5,222.3 L140.5,278.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M360.1,222.3 L360.1,232.3 L211.4,232.3 L211.4,278.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M175.9,347.3 L175.9,403.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M599.9,222.3 L599.9,357.3 L231.6,357.3 L231.6,403.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="480.47849999999994" y="302.75" width="113.384" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="537.2" y="316.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">adjust by one level</text><path d="M876.1,222.3 L876.1,367.3 L287.2,367.3 L287.2,403.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="883.10625" y="302.75" width="78.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="922.5" y="316.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">never below</text><rect x="12" y="28.25" width="175.9" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="100.0" y="56.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Functional impact</text><text x="100.0" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">none / low / medium / high</text><rect x="221.9" y="28.25" width="232.16249999999997" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="338.0" y="56.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Information impact</text><text x="338.0" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">none / privacy / proprietary / integrity</text><rect x="488.0625" y="12" width="300" height="85.25" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="638.1" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Recoverability</text><text x="638.1" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">regular / supplemented / extended / not</text><text x="638.1" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">recoverable</text><rect x="59.44375" y="153.25" width="162.025" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="140.5" y="181.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Impact level</text><text x="140.5" y="206.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">highest of the three, 1-4</text><rect x="255.46875" y="153.25" width="209.25" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="360.1" y="181.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Scope</text><text x="360.1" y="206.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">contained / several / widespread</text><rect x="69.48505" y="278.25" width="212.9136" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="175.9" y="306.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Base SEV from the matrix</text><text x="175.9" y="331.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">impact x scope</text><rect x="498.71875" y="153.25" width="202.2875" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="599.9" y="181.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Urgency</text><text x="599.9" y="206.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">immediate / pressing / deferred</text><rect x="735.00625" y="153.25" width="282.2" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="876.1" y="181.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Floor rules</text><text x="876.1" y="206.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">e.g. confirmed attacker access: at least SEV2</text><rect x="120.326225" y="403.25" width="222.4625" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="231.6" y="431.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Incident severity of record</text><text x="231.6" y="456.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">SEV1-SEV4, owned by the IR lead</text></g><rect x="36" y="460.6316275284959" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="460.6316275284959" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="481.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Impact is the worst of three answers, not their sum; urgency changes the tempo, never the facts.</text></g><text x="964" y="597" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>