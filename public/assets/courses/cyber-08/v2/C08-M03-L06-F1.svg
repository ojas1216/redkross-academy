<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1016" width="1000" height="1016" role="img" aria-label="Top-to-bottom flow of seven steps: Question (what else did WS-104 do?); Time range first (window around the known events); Filter (source and normalised fields); Inspect raw events (check fields, case, nulls); Aggregate (count, distinct, first and last seen, stack); Pivot on an entity (a value becomes the next filter); Record query + result (range, time run, output). A feedback arrow from the last step back to the first is labelled new entity: new question."><title>Query thinking: from question to recorded evidence</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1015" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L06-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Query thinking: from question to recorded evidence</text><g transform="translate(0,68)"><g transform="translate(295.2,4) scale(1.000)"><path d="M123.6,81.0 L123.6,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M123.6,206.0 L123.6,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M123.6,331.0 L123.6,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M123.6,456.0 L123.6,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M123.6,581.0 L123.6,637.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M123.6,706.0 L123.6,762.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M184.4,762.0 L184.4,716.0 L245.1,716.0 L245.1,91.0 L182.2,91.0 L182.2,81.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="252.13750000000002" y="411.5" width="145.39999999999998" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="324.8" y="425.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">new entity: new question</text><rect x="64.93541666666667" y="12" width="175.9" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="152.9" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Question</text><text x="152.9" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">what else did WS-104 do?</text><rect x="16.16250000000001" y="137" width="214.8125" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="123.6" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Time range first</text><text x="123.6" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">window around the known events</text><rect x="29.025000000000006" y="262" width="189.0875" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="123.6" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Filter</text><text x="123.6" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">source and normalised fields</text><rect x="42.28960000000001" y="387" width="162.5583" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="123.6" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Inspect raw events</text><text x="123.6" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">check fields, case, nulls</text><rect x="12" y="512" width="223.13750000000002" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="123.6" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Aggregate</text><text x="123.6" y="565.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">count, distinct, first/last seen, stack</text><rect x="23.806250000000006" y="637" width="199.525" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="123.6" y="665.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Pivot on an entity</text><text x="123.6" y="690.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">a value becomes the next filter</text><rect x="62.757650000000005" y="762" width="182.4333" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="154.0" y="790.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Record query + result</text><text x="154.0" y="815.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">range, time run, output</text></g><rect x="36" y="867" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="867" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="887.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Inspect before you aggregate: a summary of broken data looks as tidy as a summary of good data.</text></g><text x="964" y="1004" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>