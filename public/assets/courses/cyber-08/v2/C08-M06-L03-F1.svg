<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1319" width="1000" height="1319" role="img" aria-label="Graph, top to bottom. Entities from alerts (588 values from normalised fields) leads to Canonicalise + dedupe (20 distinct values, placeholder dropped), which leads to Classify + privacy gate. The gate branches to Internal sources only (CMDB, identity, history) and to a cascade for external values: 1 Allowlists / warning lists, then 2 Cache, then 3 Internal TIP + ISAC data, then 4 Approved external service. Each cascade box and the internal branch lead to Record with provenance (source, time, as-of, marking, cache or live), which leads to Attach to alert + feed back."><title>An intelligence-driven enrichment pipeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1318" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L03-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">An intelligence-driven enrichment pipeline</text><g transform="translate(0,68)"><g transform="translate(271.1,4) scale(1.000)"><path d="M139.4,81.0 L139.4,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M139.4,206.0 L139.4,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M100.3,331.0 L100.3,588.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="40.998700000000014" y="387" width="53.348" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="67.7" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">internal</text><path d="M178.4,331.0 L178.4,341.0 L341.2,341.0 L341.2,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="348.19165000000004" y="387" width="56.684" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="376.5" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">external</text><path d="M306.3,532.0 L306.3,588.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M278.4,657.0 L278.4,713.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M242.4,782.0 L242.4,838.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M100.3,657.0 L100.3,963.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M376.1,532.0 L376.1,542.0 L407.5,542.0 L407.5,947.0 L274.6,947.0 L274.6,963.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M334.2,657.0 L334.2,667.0 L396.5,667.0 L396.5,937.0 L231.0,937.0 L231.0,963.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M314.4,782.0 L314.4,792.0 L366.0,792.0 L366.0,927.0 L187.5,927.0 L187.5,963.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M242.4,907.0 L242.4,917.0 L143.9,917.0 L143.9,963.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M187.5,1032.0 L187.5,1088.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="31.296700000000016" y="12" width="216.175" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="139.4" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Entities from alerts</text><text x="139.4" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">588 values from normalised fields</text><rect x="15.996700000000033" y="137" width="246.77499999999998" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="139.4" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Canonicalise + dedupe</text><text x="139.4" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">20 distinct values, placeholder dropped</text><rect x="22.27170000000001" y="262" width="234.22500000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="139.4" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Classify + privacy gate</text><text x="139.4" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">internal list, source permissions, TLP</text><rect x="12" y="588" width="176.69340000000003" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="100.3" y="616.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Internal sources only</text><text x="100.3" y="641.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">CMDB, identity, history</text><rect x="236.51565000000005" y="463" width="209.352" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="341.2" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">1 Allowlists / warning lists</text><text x="341.2" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">known-benign values</text><rect x="222.69340000000003" y="588" width="167.2125" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="306.3" y="616.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">2 Cache</text><text x="306.3" y="641.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">key: value + source, TTL</text><rect x="170.40795000000003" y="713" width="216.04590000000002" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="278.4" y="741.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">3 Internal TIP + ISAC data</text><text x="278.4" y="766.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">curated, marked</text><rect x="128.89095" y="838" width="227.0646" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="242.4" y="866.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">4 Approved external service</text><text x="242.4" y="891.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">quota, reveals the query</text><rect x="56.79253333333335" y="963" width="261.325" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="187.5" y="991.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Record with provenance</text><text x="187.5" y="1016.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">source, time, as-of, marking, cache or live</text><rect x="79.86933333333334" y="1088" width="215.1714" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="187.5" y="1116.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Attach to alert + feed back</text></g><rect x="36" y="1170.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="1170.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="1191.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">No value reaches a source before the gate has decided it may go there.</text></g><text x="964" y="1307" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>