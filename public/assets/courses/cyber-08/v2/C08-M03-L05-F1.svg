<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1016" width="1000" height="1016" role="img" aria-label="Top-to-bottom flow of seven steps: Question (is a critical source silent for more than 30 minutes?); Audience and action (who reads it, what they do); Data and query (sources, fields, time range, refresh); Baseline and threshold (what is normal, when the state changes); Visual form (number, line, table or top-N); Context and drilldown (underlying events, runbook link); Owner and review (retire if nobody acts). A feedback arrow returns from the last step to the first, labelled review: rewrite, merge or retire panels nobody acts on."><title>Designing a dashboard panel from a question</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1015" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L05-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Designing a dashboard panel from a question</text><g transform="translate(0,68)"><g transform="translate(192.7,4) scale(1.000)"><path d="M136.8,81.0 L136.8,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.8,206.0 L136.8,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.8,331.0 L136.8,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.8,456.0 L136.8,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.8,581.0 L136.8,637.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.8,706.0 L136.8,762.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M189.5,762.0 L189.5,716.0 L295.6,716.0 L295.6,91.0 L210.3,91.0 L210.3,81.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="302.55" y="411.5" width="300.104" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="452.6" y="425.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">review: rewrite, merge or retire panels nobody acts on</text><rect x="63.212500000000006" y="12" width="220.6875" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="173.6" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Question</text><text x="173.6" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">is a critical source silent &gt; 30 min?</text><rect x="49.16875" y="137" width="175.2125" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="136.8" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Audience and action</text><text x="136.8" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">who reads it, what they do</text><rect x="25.90625" y="262" width="221.7375" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="136.8" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Data and query</text><text x="136.8" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">sources, fields, time range, refresh</text><rect x="12" y="387" width="249.55" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="136.8" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Baseline and threshold</text><text x="136.8" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">what is normal, when the state changes</text><rect x="46.05000000000001" y="512" width="181.45" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="136.8" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Visual form</text><text x="136.8" y="565.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">number, line, table or top-N</text><rect x="35.625" y="637" width="202.3" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="136.8" y="665.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Context and drilldown</text><text x="136.8" y="690.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">underlying events, runbook link</text><rect x="84.0676" y="762" width="158.12220000000002" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="163.1" y="790.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Owner and review</text><text x="163.1" y="815.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">retire if nobody acts</text></g><rect x="36" y="867" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="867" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="887.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">If no audience and action can be named, do not build the panel; if the threshold is precise, make it an alert too.</text></g><text x="964" y="1004" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>