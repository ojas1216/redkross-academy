<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 842" width="1000" height="842" role="img" aria-label="Top-to-bottom graph. A blue node Proxy event (URL ends .docm or .xlsm) and a slate node Sysmon event 1 (Word or Excel starts PowerShell or cmd.exe) both point into a violet node Join on host (same workstation). That points into a violet node 0 to 600 s after download (integer seconds). From it, a solid arrow labelled pass leads to a dark node R7 alert (host, user, URL, both times), which points to a green node Triage queue (RULE_META R7: 3, 0.9). A dashed arrow labelled fail leads to a red node No alert (other host, before download, or later than 600 s)."><title>R7 macro_doc_then_shell: correlating two log sources</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="841" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L08-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">R7 macro_doc_then_shell: correlating two log sources</text><g transform="translate(0,68)"><g transform="translate(234.0,4) scale(1.000)"><path d="M116.3,81.0 L116.3,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M372.7,81.0 L372.7,91.0 L158.7,91.0 L158.7,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M137.5,206.0 L137.5,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M102.7,331.0 L102.7,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="57.38099999999999" y="387" width="39.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="77.1" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">pass</text><path d="M172.2,331.0 L172.2,341.0 L373.8,341.0 L373.8,463.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="380.775" y="387" width="29.336" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="395.4" y="401.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">fail</text><path d="M102.7,532.0 L102.7,588.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="31.11726666666666" y="12" width="170.3125" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="116.3" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Proxy event</text><text x="116.3" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">URL ends .docm or .xlsm</text><rect x="235.42976666666667" y="12" width="274.5125" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="372.7" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Sysmon event 1</text><text x="372.7" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Word or Excel starts PowerShell or cmd.exe</text><rect x="73.85685" y="137" width="127.25" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="137.5" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Join on host</text><text x="137.5" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">same workstation</text><rect x="33.211299999999994" y="262" width="208.5411" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="137.5" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">0 to 600 s after download</text><text x="137.5" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">integer seconds</text><rect x="12" y="463" width="181.45" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="102.7" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">R7 alert</text><text x="102.7" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">host, user, URL, both times</text><rect x="21.381249999999994" y="588" width="162.6875" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="102.7" y="616.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Triage queue</text><text x="102.7" y="641.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">RULE_META R7: 3, 0.9</text><rect x="227.45" y="463" width="292.65" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="373.8" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">No alert</text><text x="373.8" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">other host, before download, or later than 600 s</text></g><rect x="36" y="693" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="693" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="713.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">On the Banyan data the pair is WS-104: invoice.docm at 06:12:00, Word starts PowerShell at 06:14:00 (120 s), giving one hit.</text></g><text x="964" y="830" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>