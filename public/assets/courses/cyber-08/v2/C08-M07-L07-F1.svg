 stroke="#E2E8F0"/><rect x="44" y="240.25" width="122" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="105.0" y="261.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Metadata</text><line x1="174.0" y1="256.3" x2="204.0" y2="256.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="212" y="241.3125" width="200.3235" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="312.2" y="261.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Title and description accurate</text><rect x="420.32349999999997" y="241.3125" width="144.04199999999997" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="492.3" y="261.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Fresh id; references</text><rect x="572.3655" y="241.3125" width="163.536" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="654.1" y="261.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Realistic false positives</text><rect x="36" y="288.375" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="296.375" width="122" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="105.0" y="317.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">ATT&amp;CK tags</text><line x1="174.0" y1="312.4" x2="204.0" y2="312.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="212" y="297.4375" width="158.3115" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="291.2" y="317.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Justified and complete</text><rect x="378.3115" y="2