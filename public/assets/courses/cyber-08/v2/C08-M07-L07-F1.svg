<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 559" width="1000" height="559" role="img" aria-label="Six rows, each with an arrow from an area label to its questions. Logic: condition matches the description and requirement; translation means the same; which values does the attacker control. Data: log source collected and mapped; fields exist after parsing; query restricted to the intended log. Tests: a positive test per branch; a near-miss negative per condition; boundary tests on thresholds and windows. Metadata: title, description, fresh id, references, false positives. ATT&amp;CK tags: justified, complete, valid in the pinned version, version recorded. Severity: level justified; maps consistently to the triage scale."><title>The rule review checklist: six areas</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="558" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M07-L07-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The rule review checklist: six areas</text><g transform="translate(0,68)"><text x="101.0" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">AREA</text><text x="216.0" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="start">REVIEWER ASKS</text><rec