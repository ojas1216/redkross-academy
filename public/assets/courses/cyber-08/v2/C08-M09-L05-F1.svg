n Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">High if unexplained</text><text x="840.3" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Unavailable</text><rect x="36" y="122.44999999999999" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="122.44999999999999" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="50.0" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">Inbox / forwarding rule</text><text x="247.3" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Mailbox audit</text><text x="415.4" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Approved filing rule</text><text x="650.6" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">High when unexpected</text><text x="840.3" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Unavailable</text><rect x="36" y="162.67499999999998" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="162.67499999999998" width="4" height="36.225" rx="2" fill="#2563EB"/><text x="50.0" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="start">Unusual logon</text><text x="247.3" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Windows and VPN</text><text x="415.4" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Approved admin work</text><text x="650.6" y="18