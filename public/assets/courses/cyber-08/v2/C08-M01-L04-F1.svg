<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1108" width="1000" height="1108" role="img" aria-label="Top-to-bottom diagram of seven steps: Read the handover; Check SOC health (log sources, intel, change calendar); Pick and acknowledge (highest priority, then oldest); Handle the alert (read rule, scope, enrich, validate, related alerts); Document as you go (UTC, exact queries, evidence references); Decide (close, keep investigating in the time box, or escalate now). From Decide a dashed loop arrow labelled next alert returns to Pick and acknowledge, and an arrow labelled shift ends leads to Write the handover."><title>The analyst&#39;s shift: orient once, loop per alert, hand over</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1107" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-L04-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The analyst&#39;s shift: orient once, loop per alert, hand over</text><g transform="translate(0,68)"><g transform="translate(290.9,4) scale(1.000)"><path d="M188.3,81.0 L188.3,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M188.3,206.0 L188.3,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M156.9,331.0 L156.9,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M156.9,456.0 L156.9,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M156.9,581.0 L156.9,637.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M256.9,637.0 L256.9,591.0 L335.8,591.0 L335.8,341.0 L219.6,341.0 L219.6,331.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="342.8375" y="411.5" width="63.35600000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="374.5" y="425.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">next alert</text><path d="M206.9,722.3 L206.9,854.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="135.55874999999997" y="778.25" width="65.36" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="168.2" y="792.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">shift ends</text><rect x="87.82109999999999" y="12" width="200.92499999999998" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="188.3" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Read the handover</text><text x="188.3" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">open cases, pending decisions</text><rect x="76.70859999999998" y="137" width="223.15" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="188.3" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Check SOC health</text><text x="188.3" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">log sources, intel, change calendar</text><rect x="94.18904999999998" y="262" width="188.1891" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="188.3" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Pick and acknowledge</text><text x="188.3" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">highest priority, then oldest</text><rect x="12" y="387" width="289.8375" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="156.9" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Handle the alert</text><text x="156.9" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">read rule, scope, enrich, validate, related alerts</text><rect x="47.787499999999994" y="512" width="218.2625" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="156.9" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Document as you go</text><text x="156.9" y="565.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">UTC, exact queries, evidence refs</text><rect x="56.91874999999999" y="637" width="300" height="85.25" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="206.9" y="665.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Decide</text><text x="206.9" y="690.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">close / keep investigating (time box) / escalate</text><text x="206.9" y="706.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">now</text><rect x="99.71249999999999" y="854.25" width="214.4125" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="206.9" y="882.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Write the handover</text><text x="206.9" y="907.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">becomes the next shift&#39;s first step</text></g><rect x="36" y="959.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="959.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="979.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Orientation happens once per shift; the pick-handle-document-decide loop repeats for every alert.</text></g><text x="964" y="1096" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>