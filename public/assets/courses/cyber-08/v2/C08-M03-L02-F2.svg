<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" role="img" aria-label="Two code panels. Left, red, Brittle: one positional regex. The pattern requires SRC, DST, PROTO=(\w+) DPT=(\d+) in fixed order; the code uses m[1] without checking for a match. Results: ICMP with no port, keys reordered and new [FW-IN] prefix all fail with TypeError; parsed 2 of 5. Right, green, Tolerant: header regex + key-value. An anchored header with an optional [prefix]; if no match, return a _parse_failure tag with the original; kv = dict of key=value tokens; fields read with kv.get; the port is added only if present. Results: all 4 firewall drops parsed; link-down line tagged _parse_failure."><title>Brittle versus tolerant firewall parser</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="415" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L02-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Brittle versus tolerant firewall parser</text><g transform="translate(0,68)"><rect x="36" y="4" width="455" height="245.5" rx="10" fill="#0F172A" stroke="#F19A9A" stroke-width="1.5"/><rect x="36" y="4" width="455" height="32" rx="10" fill="#FEF2F2"/><rect x="36" y="26" width="455" height="10" fill="#FEF2F2"/><text x="50.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#7F1D1D" text-anchor="start">Brittle: one positional regex</text><text x="50" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">re.match(r&quot;... kernel: (\w+) .*SRC=(\S+)</text><text x="50" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  DST=(\S+) PROTO=(\w+) DPT=(\d+)&quot;, line)</text><text x="50" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">ts = ... m[1] ...   # no None check</text><text x="50" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">ICMP, no port   -&gt; TypeError</text><text x="50" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">keys reordered  -&gt; TypeError</text><text x="50" y="168.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">[FW-IN] prefix  -&gt; TypeError</text><text x="50" y="187.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">parsed 2 of 5; parse failures: 3</text><rect x="509" y="4" width="455" height="245.5" rx="10" fill="#0F172A" stroke="#6CCB95" stroke-width="1.5"/><rect x="509" y="4" width="455" height="32" rx="10" fill="#ECFDF3"/><rect x="509" y="26" width="455" height="10" fill="#ECFDF3"/><text x="523.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#14532D" text-anchor="start">Tolerant: header regex + key-value</text><text x="523" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">HEADER = ^... kernel: (?:\[...\] )?</text><text x="523" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">         ([A-Z]+) (.*)$</text><text x="523" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">if not m: return {tags: [_parse_failure],</text><text x="523" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">                  event.original: line}</text><text x="523" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">kv = dict(tok.split(&quot;=&quot;, 1) ...)</text><text x="523" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">source.ip = kv.get(&quot;SRC&quot;)</text><text x="523" y="168.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">if &quot;DPT&quot; in kv: add destination.port</text><text x="523" y="187.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="523" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">all 4 firewall drops parsed</text><text x="523" y="224.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">link-down line -&gt; _parse_failure</text><rect x="36" y="267.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="267.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="288.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Parse by label, check every match, and tag failures instead of crashing.</text></g><text x="964" y="404" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>