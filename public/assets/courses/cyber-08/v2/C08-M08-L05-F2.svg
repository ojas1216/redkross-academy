<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" role="img" aria-label="Table with four columns: Impact level, Contained (1 host or account), Several (2-10 or one team) and Widespread (critical service or many). Row Severe (4), red: SEV2 marked CASE-0001 base, SEV1 marked if CASE-0002 merges, SEV1. Row Significant (3), orange: SEV3, SEV2, SEV1. Row Limited (2), blue: SEV4 marked CASE-0002 base, SEV3, SEV2. Row Minimal (1), slate: SEV4, SEV4, SEV3. Note: Immediate urgency raises one level, to SEV1 at most; floor rules set a minimum; a contained incident keeps its peak severity of record."><title>The Banyan severity matrix with the two cases placed</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="363" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M08-L05-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The Banyan severity matrix with the two cases placed</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">IMPACT LEVEL</text><text x="189.2" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">CONTAINED (1 HOST OR ACCOUNT)</text><text x="433.4" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">SEVERAL (2-10 OR ONE TEAM)</text><text x="681.5" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">WIDESPREAD (CRITICAL SERVICE OR MANY)</text><rect x="36" y="42" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="42" width="4" height="36.225" rx="2" fill="#DC2626"/><text x="50.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7F1D1D" text-anchor="start">Severe (4)</text><text x="189.2" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV2 (CASE-0001 base)</text><text x="433.4" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV1 (if CASE-0002 merges)</text><text x="681.5" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV1</text><rect x="36" y="82.225" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="82.225" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="50.0" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="start">Significant (3)</text><text x="189.2" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV3</text><text x="433.4" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV2</text><text x="681.5" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV1</text><rect x="36" y="122.44999999999999" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="122.44999999999999" width="4" height="36.225" rx="2" fill="#2563EB"/><text x="50.0" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="start">Limited (2)</text><text x="189.2" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV4 (CASE-0002 base)</text><text x="433.4" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV3</text><text x="681.5" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV2</text><rect x="36" y="162.67499999999998" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="162.67499999999998" width="4" height="36.225" rx="2" fill="#475569"/><text x="50.0" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start">Minimal (1)</text><text x="189.2" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV4</text><text x="433.4" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV4</text><text x="681.5" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SEV3</text><rect x="36" y="214.89999999999998" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="214.89999999999998" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="235.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Immediate urgency raises one level (SEV1 at most); floor rules set a minimum; a contained incident keeps its peak severity of record.</text></g><text x="964" y="352" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>