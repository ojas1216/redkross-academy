<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1293" width="1000" height="1293" role="img" aria-label="Top-to-bottom graph. Match (ioc_match.py against minisiem.db) leads to Verify sightings (minisiem.py search on raw events), then Grade (intel_grade.py: reliability + credibility), then Age (validity at three check dates), then Derive first-party IOCs (R3 and R4 hits: domain, account), then Draft note (attacker-side facts, TLP per item), then Scrub check (scrub_check.py). From Scrub check a dashed arrow labelled findings greater than 0 returns to Draft note. A solid arrow labelled 0 findings leads to two outputs: TLP:GREEN peer note (first-party plus GREEN items), shown in green, and TLP:AMBER sighting to ISAC-A (asks permission to widen), shown in dark."><title>The intel lab route: from feed match to released note</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1292" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L08-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The intel lab route: from feed match to released note</text><g transform="translate(0,68)"><g transform="translate(247.9,4) scale(1.000)"><path d="M142.8,81.0 L142.8,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M142.8,206.0 L142.8,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M142.8,331.0 L142.8,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M142.8,456.0 L142.8,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M142.8,581.0 L142.8,637.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M107.9,706.0 L107.9,838.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M147.9,838.0 L147.9,792.0 L177.8,792.0 L177.8,706.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="184.83445" y="762" width="75.70400000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="222.7" y="776.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">findings &gt; 0</text><path d="M107.9,907.0 L107.9,1039.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="36.49945000000001" y="963" width="65.36" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="69.2" y="977.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">0 findings</text><path d="M147.9,907.0 L147.9,917.0 L364.9,917.0 L364.9,1039.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="371.9411" y="963" width="65.36" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="404.6" y="977.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">0 findings</text><rect x="34.06570000000002" y="12" width="217.5625" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="142.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Match</text><text x="142.8" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ioc_match.py against minisiem.db</text><rect x="33.72195000000002" y="137" width="218.25" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="142.8" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Verify sightings</text><text x="142.8" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">minisiem.py search on raw events</text><rect x="27.64070000000001" y="262" width="230.41250000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="142.8" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Grade</text><text x="142.8" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">intel_grade.py: reliability + credibility</text><rect x="50.728200000000015" y="387" width="184.2375" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="142.8" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Age</text><text x="142.8" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">validity at three check dates</text><rect x="37.17820000000002" y="512" width="211.3375" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="142.8" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Derive first-party IOCs</text><text x="142.8" y="565.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">R3 and R4 hits: domain, account</text><rect x="37.884450000000015" y="637" width="209.925" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="142.8" y="665.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Draft note</text><text x="142.8" y="690.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">attacker-side facts, TLP per item</text><rect x="67.85945000000001" y="838" width="120" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="127.9" y="866.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Scrub check</text><text x="127.9" y="891.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">scrub_check.py</text><rect x="12" y="1039" width="191.71890000000002" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="107.9" y="1067.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">TLP:GREEN peer note</text><text x="107.9" y="1092.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">first-party + GREEN items</text><rect x="237.71890000000002" y="1039" width="254.44440000000003" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="364.9" y="1067.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">TLP:AMBER sighting to ISAC-A</text><text x="364.9" y="1092.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">asks permission to widen</text></g><rect x="36" y="1144" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="1144" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="1164.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A match is where the lab starts, not where it ends: every indicator is verified, graded and aged before anything is shared.</text></g><text x="964" y="1281" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>