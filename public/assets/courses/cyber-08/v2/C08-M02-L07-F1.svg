<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 377" width="1000" height="377" role="img" aria-label="Graph diagram. Windows workstations (Security log, Sysmon) send events via WEF over WinRM to the Windows Event Collector. Network devices (firewall, proxy) push syslog over TLS to the Syslog relay. Linux servers are read by an Agent on host. Cloud and SaaS audit APIs are pulled over HTTPS by the API poller. The Windows Event Collector, Syslog relay, Agent on host and API poller all send events to the Buffer / message queue, which feeds Parse + normalise, which feeds SIEM storage, which feeds Rules, searches, dashboards. Dashed arrows from the Buffer / message queue (queue depth) and from SIEM storage (last seen, volume, parse errors) go to the Source-health monitor, which raises health alerts to the SOC queue."><title>A collection pipeline from source to rules, with health checks</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="376" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-L07-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">A collection pipeline from source to rules, with health checks</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.507)"><path d="M199.3,46.5 L426.6,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="257.9489" y="53.5" width="110" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="312.9" y="67.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">WEF over WinRM</text><path d="M199.3,149.5 L469.8,149.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="274.26890000000003" y="156.5" width="77.36" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="312.9" y="170.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">syslog push</text><path d="M199.3,252.5 L441.5,252.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="279.9389" y="259.5" width="66.02" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="312.9" y="273.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">local read</text><path d="M199.3,355.5 L460.1,355.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="255.26690000000002" y="362.5" width="115.36399999999999" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="312.9" y="376.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">pulled over HTTPS</text><path d="M633.3,46.5 L643.3,46.5 L643.3,135.7 L689.3,135.7" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M590.1,149.5 L689.3,149.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M618.5,252.5 L643.3,252.5 L643.3,163.3 L689.3,163.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M599.9,355.5 L653.3,355.5 L653.3,177.1 L689.3,177.1" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M888.2,144.9 L944.2,144.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1102.7,144.9 L1158.7,144.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M1310.0,133.4 L1366.0,133.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M888.2,167.9 L898.2,167.9 L898.2,238.2 L1586.0,238.2 L1586.0,250.2 L1632.0,250.2" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="1193.9862" y="245.15" width="80.72" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1234.3" y="259.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">queue depth</text><path d="M1310.0,156.4 L1320.0,156.4 L1320.0,227.2 L1632.0,227.2" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="1381.6091999999999" y="200.15" width="178.724" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1471.0" y="214.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">last seen, volume, parse errors</text><rect x="12" y="12" width="187.26690000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="105.6" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Windows workstations</text><text x="105.6" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Security log, Sysmon</text><rect x="52.6404" y="115" width="146.62650000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="126.0" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Network devices</text><text x="126.0" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">firewall, proxy</text><rect x="74.72550000000003" y="218" width="124.5414" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="137.0" y="246.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Linux servers</text><text x="137.0" y="271.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">files, journal</text><rect x="53.48310000000001" y="321" width="145.7838" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="126.4" y="349.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Cloud and SaaS</text><text x="126.4" y="374.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">audit APIs</text><rect x="426.6309" y="12" width="206.7126" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="530.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Windows Event Collector</text><text x="530.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">WEF subscriptions</text><rect x="469.8247" y="115" width="120.325" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="530.0" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Syslog relay</text><text x="530.0" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">TLS, disk queue</text><rect x="441.5122" y="218" width="176.95" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="530.0" y="246.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Agent on host</text><text x="530.0" y="271.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">read position + local buffer</text><rect x="460.10595" y="321" width="139.7625" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="530.0" y="349.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">API poller</text><text x="530.0" y="374.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">read-only credential</text><rect x="689.3435" y="121.9" width="198.81030000000004" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="788.7" y="150.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Buffer / message queue</text><text x="788.7" y="174.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">turns outages into delay</text><rect x="944.1538" y="110.4" width="158.56740000000002" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="1023.4" y="138.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Parse + normalise</text><text x="1023.4" y="163.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">fields, UTC, keep raw</text><rect x="1158.7212" y="110.4" width="151.25" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="1234.3" y="138.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">SIEM storage</text><text x="1234.3" y="163.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">hot search + retention</text><rect x="1365.9712" y="100.65" width="210" height="65.5" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="1471.0" y="128.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Rules, searches,</text><text x="1471.0" y="147.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">dashboards</text><rect x="1631.9712" y="204.15" width="186.40830000000003" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="1725.2" y="232.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Source-health monitor</text><text x="1725.2" y="257.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">health alerts to SOC queue</text></g><rect x="36" y="227.81347146862169" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="227.81347146862169" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="248.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Each hand-off can fail silently; the health monitor measures the pipeline itself.</text></g><text x="964" y="365" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>