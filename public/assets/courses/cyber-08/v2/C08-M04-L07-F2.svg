<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" width="1000" height="472" role="img" aria-label="Two code panels. Left panel, red, titled Imprecise: a confident wrong answer. Block one: IOC search by substring, url LIKE &#39;%cdn%&#39;, result 64 rows of which 46 are cdn.example.org. Block two: up to 07:02 on text timestamps, ts BETWEEN &#39;...T06:00&#39; AND &#39;...T07:02&#39;, result 15 rows with the 07:02 events excluded. Block three: accounts never created, user NOT IN (SELECT target_user FROM events), result 0 because a NULL poisons NOT IN. Right panel, green, titled Precise: says what the question means. Block one: compare the extracted domain, domain = &#39;cdn-telemetry-sync.example&#39;, result 18 rows. Block two: half-open interval in full format, ts &gt;= &#39;...T06:00:00Z&#39; AND ts &lt; &#39;...T07:03:00Z&#39;, result 17 rows. Block three: anti-join that ignores NULLs, NOT EXISTS (SELECT 1 FROM events c WHERE c.target_user = e.user), result 8 accounts."><title>Three conditions that run cleanly and answer wrongly</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="471" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M04-L07-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Three conditions that run cleanly and answer wrongly</text><g transform="translate(0,68)"><rect x="36" y="4" width="455" height="301.75" rx="10" fill="#0F172A" stroke="#F19A9A" stroke-width="1.5"/><rect x="36" y="4" width="455" height="32" rx="10" fill="#FEF2F2"/><rect x="36" y="26" width="455" height="10" fill="#FEF2F2"/><text x="50.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#7F1D1D" text-anchor="start">Imprecise: a confident wrong answer</text><text x="50" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">-- IOC search by substring</text><text x="50" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">WHERE url LIKE &#39;%cdn%&#39;</text><text x="50" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  = 64 rows (46 are cdn.example.org)</text><text x="50" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">-- &#39;up to 07:02&#39; on text timestamps</text><text x="50" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">ts BETWEEN &#39;…T06:00&#39; AND &#39;…T07:02&#39;</text><text x="50" y="168.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  = 15 rows (07:02 events excluded)</text><text x="50" y="187.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">-- accounts never created</text><text x="50" y="224.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">user NOT IN (SELECT target_user</text><text x="50" y="243.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">             FROM events)</text><text x="50" y="262.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  = 0 (one NULL poisons NOT IN)</text><rect x="509" y="4" width="455" height="301.75" rx="10" fill="#0F172A" stroke="#6CCB95" stroke-width="1.5"/><rect x="509" y="4" width="455" height="32" rx="10" fill="#ECFDF3"/><rect x="509" y="26" width="455" height="10" fill="#ECFDF3"/><text x="523.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#14532D" text-anchor="start">Precise: says what the question means</text><text x="523" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">-- compare the extracted domain</text><text x="523" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">domain = &#39;cdn-telemetry-sync.example&#39;</text><text x="523" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  = 18 rows</text><text x="523" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="523" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">-- half-open interval, full format</text><text x="523" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">ts &gt;= &#39;…T06:00:00Z&#39;</text><text x="523" y="168.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  AND ts &lt; &#39;…T07:03:00Z&#39;</text><text x="523" y="187.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  = 17 rows</text><text x="523" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="523" y="224.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">-- anti-join that ignores NULLs</text><text x="523" y="243.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">NOT EXISTS (SELECT 1 FROM events c</text><text x="523" y="262.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  WHERE c.target_user = e.user)</text><text x="523" y="281.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  = 8 accounts</text><rect x="36" y="323.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="323.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="344.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Each left-hand form is a precision, recall or NULL-logic failure; none of them raises an error.</text></g><text x="964" y="460" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>