<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 967" width="1000" height="967" role="img" aria-label="Decision graph, top to bottom. An alert fired leads to a violet decision box: Did the rule match what it was written to detect? If no, the alert is a False positive (logic or data error), which leads to Close and raise a tuning ticket. If yes, a second violet decision box asks: Is the activity authorised, with evidence? If yes with a change or ticket reference, it is a Benign true positive, which leads to Close with the reference and consider a scoped suppression. If no, it is a True positive, which leads to Investigate or escalate. If the evidence is insufficient to answer either question, the alert is Undetermined, which leads to Record the gap and keep open or escalate."><title>Classifying an alert: FP, benign TP, TP or undetermined</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="966" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L05-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Classifying an alert: FP, benign TP, TP or undetermined</text><g transform="translate(0,68)"><g transform="translate(109.1,4) scale(1.000)"><path d="M156.7,81.0 L156.7,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M98.8,206.0 L98.8,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="65.46039999999999" y="262" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="79.1" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M156.7,206.0 L156.7,226.0 L320.5,226.0 L320.5,338.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="281.80775000000006" y="262" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="298.1" y="276.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M214.5,206.0 L214.5,216.0 L680.6,216.0 L680.6,542.0 L717.1,542.0 L717.1,588.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="687.5944916666667" y="362.5" width="68.696" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="721.9" y="376.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">cannot tell</text><path d="M258.6,407.0 L258.6,588.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="219.95757500000002" y="487.5" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="236.3" y="501.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M320.5,407.0 L320.5,427.0 L488.3,427.0 L488.3,588.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="454.97532500000005" y="487.5" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="468.6" y="501.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M382.3,407.0 L382.3,417.0 L669.6,417.0 L669.6,588.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="594.8984916666667" y="487.5" width="68.696" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="629.2" y="501.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">cannot tell</text><path d="M98.8,407.0 L98.8,463.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M693.4,657.0 L693.4,713.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M258.6,657.0 L258.6,713.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M488.3,657.0 L488.3,713.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="74.28810000000001" y="12" width="164.775" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="156.7" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Alert fired</text><text x="156.7" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">rule, entities, raw events</text><rect x="40.93319999999999" y="137" width="231.48480000000004" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="156.7" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Did the rule match its intent?</text><text x="156.7" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">what it was written to detect</text><rect x="34.8294" y="338" width="127.95" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="98.8" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">False positive</text><text x="98.8" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">logic or data error</text><rect x="196.7794" y="338" width="247.4007" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="320.5" y="366.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Is it authorised, with evidence?</text><text x="320.5" y="391.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">change, ticket, owner</text><rect x="622.0778250000001" y="588" width="142.55" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="693.4" y="616.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Undetermined</text><text x="693.4" y="641.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">evidence insufficient</text><rect x="173.812675" y="588" width="169.6338" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="258.6" y="616.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Benign true positive</text><text x="258.6" y="641.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">real activity, approved</text><rect x="409.39432500000004" y="588" width="157.85" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="488.3" y="616.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">True positive</text><text x="488.3" y="641.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">real and not authorised</text><rect x="12" y="463" width="173.6088" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="98.8" y="491.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Close + tuning ticket</text><text x="98.8" y="516.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">fix the cause</text><rect x="616.8590750000001" y="713" width="152.9875" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="693.4" y="741.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Record the gap</text><text x="693.4" y="766.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">keep open or escalate</text><rect x="157.479575" y="713" width="202.3" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="258.6" y="741.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Close with the reference</text><text x="258.6" y="766.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">consider a scoped suppression</text><rect x="393.779575" y="713" width="189.07950000000002" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="488.3" y="741.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Investigate or escalate</text><text x="488.3" y="766.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Lesson 6 criteria</text></g><rect x="36" y="818" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="818" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="838.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Authorisation must be proven by a record, never assumed from who the user is.</text></g><text x="964" y="955" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>