<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1092" width="1000" height="1092" role="img" aria-label="Graph. Four slate source boxes - Open feeds (free, thin context), Commercial feeds (curated, licensed), ISAC / community (relevant, under TLP) and Internal cases (proven against us) - each point into Normalise (canonical type + value). The chain continues to Deduplicate and merge (one record, all sources), then the green Allowlist filter (own and shared infrastructure), then the orange Score (confidence x reliability x age), then the violet Age out (past valid_until: history only). From Age out an arrow labelled high score, current leads to the dark Detect / block box, and an arrow labelled low score or expired leads to the blue Enrich / hunt box. A dashed arrow labelled false matches, sightings returns from Enrich / hunt to ISAC / community."><title>Feed-management pipeline: from four sources to action</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1091" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M06-L05-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Feed-management pipeline: from four sources to action</text><g transform="translate(0,68)"><g transform="translate(105.3,4) scale(1.000)"><path d="M73.2,81.0 L73.2,91.0 L216.7,91.0 L216.7,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M247.5,81.0 L247.5,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M575.9,81.0 L575.9,101.0 L309.1,101.0 L309.1,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M425.0,81.0 L425.0,91.0 L278.3,91.0 L278.3,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M262.9,206.0 L262.9,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M262.9,331.0 L262.9,387.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M262.9,456.0 L262.9,512.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M262.9,581.0 L262.9,637.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M232.4,706.0 L232.4,838.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="113.02323333333331" y="762" width="113.37200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="169.7" y="776.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">high score, current</text><path d="M293.3,706.0 L293.3,716.0 L389.0,716.0 L389.0,838.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="261.6458166666667" y="762" width="121.36399999999999" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="322.3" y="776.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">low score or expired</text><path d="M442.8,838.0 L442.8,792.0 L628.3,792.0 L628.3,81.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="635.3175" y="411.5" width="142.052" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="706.3" y="425.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">false matches, sightings</text><rect x="12" y="12" width="122.4125" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="73.2" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Open feeds</text><text x="73.2" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">free, thin context</text><rect x="168.4125" y="12" width="158.1063" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="247.5" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Commercial feeds</text><text x="247.5" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">curated, licensed</text><rect x="523.4963" y="12" width="157.23180000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="602.1" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">ISAC / community</text><text x="602.1" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">relevant, under TLP</text><rect x="360.5188" y="12" width="128.97750000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="425.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Internal cases</text><text x="425.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">proven against us</text><rect x="185.85565" y="137" width="154.025" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="262.9" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Normalise</text><text x="262.9" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">canonical type + value</text><rect x="165.68105" y="262" width="194.3742" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="262.9" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Deduplicate and merge</text><text x="262.9" y="315.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">one record, all sources</text><rect x="165.19315" y="387" width="195.35" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="262.9" y="415.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Allowlist filter</text><text x="262.9" y="440.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">own and shared infrastructure</text><rect x="168.46189999999999" y="512" width="188.8125" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="262.9" y="540.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Score</text><text x="262.9" y="565.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">confidence × reliability × age</text><rect x="171.4494" y="637" width="182.8375" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="262.9" y="665.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Age out</text><text x="262.9" y="690.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">past valid_until: history only</text><rect x="163.55148333333332" y="838" width="137.6875" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="232.4" y="866.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Detect / block</text><text x="232.4" y="891.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">with change control</text><rect x="335.2389833333333" y="838" width="161.3125" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="415.9" y="866.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Enrich / hunt</text><text x="415.9" y="891.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">analyst reads in context</text></g><rect x="36" y="943" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="943" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="963.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Never connect a feed straight to a blocklist.</text></g><text x="964" y="1080" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>