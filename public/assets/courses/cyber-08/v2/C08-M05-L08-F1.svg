<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1217" width="1000" height="1217" role="img" aria-label="Top-to-bottom graph of eight boxes. Load + build queue (minisiem.py load; triage.py) leads to Order the work (urgency by score, story by time), then Enrich (asset, user, IP, ioc_match.py), Validate (raw events via minisiem.py search), Disposition (TP, BTP, FP or undetermined, with confidence) and Write the note (CHECKED, FOUND, ASSESS, NEXT). A dashed arrow labelled next alert runs from Write the note back to Enrich. A solid arrow labelled queue empty runs from Write the note to Group + scope (cases by shared entities; hunt.py H3), which leads to Export evidence + summary (SHA-256, custody, queue table), shown in dark."><title>The triage lab route: one loop for every alert</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="1216" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L08-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The triage lab route: one loop for every alert</text><g transform="translate(0,68)"><g transform="translate(313.5,4) scale(1.000)"><path d="M178.1,81.0 L178.1,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M178.1,206.0 L178.1,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M146.3,331.0 L146.3,387.0" fill="none" stroke="#64748B" strok