<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 644" width="1000" height="644" role="img" aria-label="Sequence diagram with four lanes, left to right: SOC analyst (orange), Incident lead (dark), Business owner (blue, head of finance), IT ops / identity (green). 1, analyst to incident lead: Recommendation: actions, order, impact. 2, incident lead to business owner: Impact: payments approver offline. 3, dashed reply from business owner to incident lead: Workaround: deputy approves payments. 4, dashed, incident lead to analyst: Approved: execute together. 5, incident lead to IT ops / identity: Execute: isolate, block, disable, revoke. 6, dashed, IT ops / identity to analyst: Done + time of each action. 7, analyst to incident lead: Verified: no beacon, no sign-ins."><title>One containment decision: recommend, approve, execute, verify</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="643" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M08-L03-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">One containment decision: recommend, approve, execute, verify</text><g transform="translate(0,68)"><line x1="152" y1="75" x2="152" y2="477" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="46" y="6" width="212" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="152.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">SOC analyst</text><text x="152.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">recommends, verifies</text><line x1="384" y1="75" x2="384" y2="477" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="278" y="6" width="212" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="384.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Incident lead</text><text x="384.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">containment authority</text><line x1="616" y1="75" x2="616" y2="477" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="510" y="6" width="212" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="616.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Business owner</text><text x="616.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">head of finance</text><line x1="848" y1="75" x2="848" y2="477" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="742" y="6" width="212" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="848.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">IT ops / identity</text><text x="848.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">executes</text><line x1="156.0" y1="109.0" x2="378.0" y2="109.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="86.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Recommendation: actions, order,</text><text x="268.0" y="101.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">impact</text><circle cx="152" cy="109" r="9" fill="#EA6A0A"/><text x="152.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="388.0" y1="163.0" x2="610.0" y2="163.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="155.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Impact: payments approver offline</text><circle cx="384" cy="163" r="9" fill="#EA6A0A"/><text x="384.0" y="167.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="612.0" y1="217.0" x2="390.0" y2="217.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="194.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Workaround: deputy approves</text><text x="500.0" y="209.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">payments</text><circle cx="616" cy="217" r="9" fill="#EA6A0A"/><text x="616.0" y="221.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="380.0" y1="271.0" x2="158.0" y2="271.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="268.0" y="263.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Approved: execute together</text><circle cx="384" cy="271" r="9" fill="#EA6A0A"/><text x="384.0" y="275.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="388.0" y1="325.0" x2="842.0" y2="325.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="616.0" y="317.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Execute: isolate, block, disable, revoke</text><circle cx="384" cy="325" r="9" fill="#EA6A0A"/><text x="384.0" y="329.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><line x1="844.0" y1="379.0" x2="158.0" y2="379.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="371.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Done + time of each action</text><circle cx="848" cy="379" r="9" fill="#EA6A0A"/><text x="848.0" y="383.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><line x1="156.0" y1="433.0" x2="378.0" y2="433.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="425.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Verified: no beacon, no sign-ins</text><circle cx="152" cy="433" r="9" fill="#EA6A0A"/><text x="152.0" y="437.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><rect x="36" y="495" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="495" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="515.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Every arrow is recorded with a UTC time in the incident log.</text></g><text x="964" y="632" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>