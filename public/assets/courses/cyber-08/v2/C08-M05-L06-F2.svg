<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 644" width="1000" height="644" role="img" aria-label="Sequence diagram with four lanes, left to right: Tier 1 analyst, On-call IR lead, CISO / legal POC, CERT-In. 1, analyst to IR lead: Page: SEV1 WS-104 + case link. 2, dashed reply: Ack 08:31Z, IR lead now owns the case. 3, analyst to IR lead: Escalation package, what, so what, evidence. 4, IR lead to CISO / legal POC: Possible reportable incident, noticed 08:25Z. 5, dashed reply from CISO / legal POC to IR lead: Decision: report; containment approved. 6, CISO / legal POC to CERT-In: Report within 6 h of noticing. 7, dashed, IR lead to analyst: Tasks: preserve evidence, watch gopal."><title>An escalation as a hand-off of ownership</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="643" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M05-L06-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">An escalation as a hand-off of ownership</text><g transform="translate(0,68)"><line x1="152" y1="75" x2="152" y2="477" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="46" y="6" width="212" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="152.0" y="45.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Tier 1 analyst</text><line x1="384" y1="75" x2="384" y2="477" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="278" y="6" width="212" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="384.0" y="45.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">On-call IR lead</text><line x1="616" y1="75" x2="616" y2="477" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="510" y="6" width="212" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="616.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">CISO / legal POC</text><text x="616.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">designated point of contact</text><line x1="848" y1="75" x2="848" y2="477" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="742" y="6" width="212" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="848.0" y="45.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">CERT-In</text><line x1="156.0" y1="109.0" x2="378.0" y2="109.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="101.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Page: SEV1 WS-104 + case link</text><circle cx="152" cy="109" r="9" fill="#EA6A0A"/><text x="152.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="380.0" y1="163.0" x2="158.0" y2="163.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="268.0" y="155.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Ack 08:31Z: IR lead owns the case</text><circle cx="384" cy="163" r="9" fill="#EA6A0A"/><text x="384.0" y="167.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="156.0" y1="217.0" x2="378.0" y2="217.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="268.0" y="209.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Package: what, so what, evidence</text><circle cx="152" cy="217" r="9" fill="#EA6A0A"/><text x="152.0" y="221.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="388.0" y1="271.0" x2="610.0" y2="271.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="263.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Possibly reportable, noticed 08:25Z</text><circle cx="384" cy="271" r="9" fill="#EA6A0A"/><text x="384.0" y="275.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="612.0" y1="325.0" x2="390.0" y2="325.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="500.0" y="302.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Decision: report; containment</text><text x="500.0" y="317.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">approved</text><circle cx="616" cy="325" r="9" fill="#EA6A0A"/><text x="616.0" y="329.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><line x1="620.0" y1="379.0" x2="842.0" y2="379.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="732.0" y="371.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Report within 6 h of noticing</text><circle cx="616" cy="379" r="9" fill="#EA6A0A"/><text x="616.0" y="383.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><line x1="380.0" y1="433.0" x2="158.0" y2="433.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="268.0" y="410.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Tasks: preserve evidence, watch</text><text x="268.0" y="425.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">gopal</text><circle cx="384" cy="433" r="9" fill="#EA6A0A"/><text x="384.0" y="437.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><rect x="36" y="495" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="495" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="515.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Escalation is complete only when the receiver acknowledges ownership; times are illustrative.</text></g><text x="964" y="632" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>