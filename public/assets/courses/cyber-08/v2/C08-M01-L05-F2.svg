<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="Mapping of seven handover note sections to their required content, top to bottom: Headline maps to most important fact, say quiet if quiet. Active incidents maps to severity, status, owner, next step, deadline. Open cases maps to status, next action, time due. Pending decisions maps to what we wait for, from whom, since when. Platform health maps to sources reporting, lag, parse errors, tickets. Intel and changes maps to advisories, watchlists, maintenance windows. Handover actions maps to numbered, named owner, time."><title>The seven sections of a handover note</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="579" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-L05-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The seven sections of a handover note</text><g transform="translate(0,68)"><text x="115.4" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">SECTION</text><text x="244.7" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="start">MUST CONTAIN</text><rect x="36" y="28" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="36" width="150.72755" height="32.125" rx="8" fill="#1F2937" stroke="#111827"/><text x="119.4" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Headline</text><line x1="202.7" y1="52.1" x2="232.7" y2="52.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240.72755" y="37.0625" width="249.0045" height="30" rx="15" fill="#FFFFFF" stroke="#111827"/><text x="365.2" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">most important fact; say &#39;quiet&#39; if quiet</text><rect x="36" y="84.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="92.125" width="150.72755" height="32.125" rx="8" fill="#FEF2F2" stroke="#F19A9A"/><text x="119.4" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">Active incidents</text><line x1="202.7" y1="108.2" x2="232.7" y2="108.2" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240.72755" y="93.1875" width="279.123" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="380.3" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">severity, status, owner, next step, deadline</text><rect x="36" y="140.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="148.25" width="150.72755" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="119.4" y="169.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Open cases</text><line x1="202.7" y1="164.3" x2="232.7" y2="164.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240.72755" y="149.3125" width="192.0885" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="336.8" y="169.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">status, next action, time due</text><rect x="36" y="196.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="204.375" width="150.72755" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="119.4" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Pending decisions</text><line x1="202.7" y1="220.4" x2="232.7" y2="220.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240.72755" y="205.4375" width="270.07800000000003" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="375.8" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">what we wait for, from whom, since when</text><rect x="36" y="252.5" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="260.5" width="150.72755" height="32.125" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="119.4" y="281.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1E293B" text-anchor="middle">Platform health</text><line x1="202.7" y1="276.6" x2="232.7" y2="276.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240.72755" y="261.5625" width="279.8385" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/><text x="380.6" y="281.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">sources reporting, lag, parse errors, tickets</text><rect x="36" y="308.625" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="316.625" width="150.72755" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="119.4" y="337.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Intel and changes</text><line x1="202.7" y1="332.7" x2="232.7" y2="332.7" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240.72755" y="317.6875" width="291.084" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="386.3" y="337.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">advisories, watchlists, maintenance windows</text><rect x="36" y="364.75" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="372.75" width="150.72755" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="119.4" y="393.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Handover actions</text><line x1="202.7" y1="388.8" x2="232.7" y2="388.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240.72755" y="373.8125" width="207.0735" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="344.3" y="393.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">numbered, named owner, time</text><rect x="36" y="430.875" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="430.875" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="451.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Write &#39;none&#39; under a section rather than deleting it, so the reader can tell &#39;nothing happened&#39; from &#39;forgotten&#39;.</text></g><text x="964" y="568" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>