<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 272" width="1000" height="272" role="img" aria-label="Flow diagram with five steps from left to right. Hot: days to weeks, SSD, fully indexed, written now. Warm: weeks to months, read-only, cheaper nodes. Cold: months, low-cost disks, slower search. Frozen / archive: months to years, object storage, restore first. Delete: irreversible unless a legal hold applies, shown in dark."><title>The storage lifecycle of SIEM data: hot to delete</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="271" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L07-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The storage lifecycle of SIEM data: hot to delete</text><g transform="translate(0,68)"><rect x="36" y="8" width="158.4" height="101.5" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="115.2" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Hot</text><text x="115.2" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">days to weeks: SSD,</text><text x="115.2" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">fully indexed, written</text><text x="115.2" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">now</text><line x1="197.4" y1="58.8" x2="225.4" y2="58.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="228.4" y="8" width="158.4" height="101.5" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="307.6" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Warm</text><text x="307.6" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">weeks to months:</text><text x="307.6" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">read-only, cheaper</text><text x="307.6" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">nodes</text><line x1="389.8" y1="58.8" x2="417.8" y2="58.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="420.8" y="8" width="158.4" height="101.5" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="44.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Cold</text><text x="500.0" y="69.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">months: low-cost disks,</text><text x="500.0" y="85.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">slower search</text><line x1="582.2" y1="58.8" x2="610.2" y2="58.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="613.2" y="8" width="158.4" height="101.5" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="692.4" y="44.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Frozen / archive</text><text x="692.4" y="69.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">months to years: object</text><text x="692.4" y="85.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">storage, restore first</text><line x1="774.6" y1="58.8" x2="802.6" y2="58.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="805.6" y="8" width="158.4" height="101.5" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="884.8" y="44.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Delete</text><text x="884.8" y="69.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">irreversible unless legal</text><text x="884.8" y="85.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">hold</text><rect x="36" y="123.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="123.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="144.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Speed and cost fall from left to right; the ages at each arrow come from the retention policy.</text></g><text x="964" y="260" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>