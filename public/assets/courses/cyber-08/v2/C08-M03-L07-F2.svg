or="middle">reach back past initial access</text><rect x="12" y="236.75" width="210" height="85.25" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="117.0" y="265.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Legal and regulatory</text><text x="117.0" y="289.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">CERT-In 180 days, PCI DSS,</text><text x="117.0" y="306.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">contracts</text><rect x="25.23750000000001" y="356" width="196.7625" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="123.6" y="384.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Privacy ceiling</text><text x="123.6" y="409.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">DPDP: no longer than needed</text><rect x="64.1625" y="459" width="157.8375" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="143.1" y="487.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Cost and capacity</text><text x="143.1" y="512.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">ingest, storage, restore</text><rect x="278" y="246.625" width="210" height="65.5" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="383.0" y="274.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Retention policy per data</text><text x="383.0" y="293.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">class</text><rect x="544" y="233.95833333333334" width="172.41250000000002" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="630.2" y="262.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Tier ages</text><text x="630.2" y="287.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">hot / warm / cold / archive</text><rect x="566.59995" y="336.95833333333337" width="127.2126" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="630.2" y="365.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Deletion point</text><text x="630.2" y="390.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">unless legal hold</text><rect x="893.7725" y="336.95833333333337" width="125.875" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="956.7" y="365.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Legal hold</text><text x="956.7" y="390.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">specific data only</text></g><rect x="36" y="509.7473119452139" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="509.7473119452139" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="530.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The floor is the longest need; the ceiling is privacy and cost; write the result down per data class.</text></g><text x="964" y="646" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>