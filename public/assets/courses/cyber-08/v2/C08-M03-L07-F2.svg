<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 658" width="1000" height="658" role="img" aria-label="Graph diagram. Five input nodes, Detection lookback (baselines, first-seen rules), Investigation and dwell time (reach back past initial access), Legal and regulatory (CERT-In 180 days, PCI DSS, contracts), Privacy ceiling (DPDP: no longer than needed) and Cost and capacity (ingest, storage, restore), each have an arrow to the dark node Retention policy per data class. That node has arrows to Tier ages (hot / warm / cold / archive) and Deletion point (unless legal hold). A red node Legal hold has a dashed arrow labelled suspends to Deletion point."><title>Deriving a retention policy from competing requirements</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="657" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L07-F2</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Deriving a retention policy from competing requirements</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.900)"><path d="M222.0,46.5 L242.0,46.5 L242.0,257.5 L278.0,257.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,158.9 L232.0,158.9 L232.0,268.5 L278.0,268.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,279.4 L278.0,279.4" fill="none" stroke="#64748B" stroke-width=