<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 739" width="1000" height="739" role="img" aria-label="Flow diagram, top to bottom. Receive (input: port, endpoint, agent, API; failure: wrong input defaults). Break into events (line, multi-line, size limit; failure: split or merged events). Label source + type (host, source, source type; failure: relay recorded as host). Assign time (event time + ingest time; failure: receipt time substituted). Route (index, tier, access, filter; failure: wrong index or dropped). Write + index (searchable after refresh; failure: indexing delay under load)."><title>Inside the SIEM ingestion layer: six filing decisions</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="738" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M03-L01-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Inside the SIEM ingestion layer: six filing decisions</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Receive</text><text x="500.0" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">input: port, endpoint, agent, API</text><line x1="784.0" y1="42.5" x2="800.0" y2="42.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="46.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">fails: wrong input defaults</text><line x1="500.0" y1="80.0" x2="500.0" y2="104.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="107" width="560" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="135.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Break into events</text><text x="500.0" y="160.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">line, multi-line, size limit</text><line x1="784.0" y1="141.5" x2="800.0" y2="141.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="145.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">fails: split or merged events</text><line x1="500.0" y1="179.0" x2="500.0" y2="203.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="206" width="560" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="234.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Label source + type</text><text x="500.0" y="259.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">host, source, source type</text><line x1="784.0" y1="240.5" x2="800.0" y2="240.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="244.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">fails: relay recorded as host</text><line x1="500.0" y1="278.0" x2="500.0" y2="302.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="305" width="560" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="333.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Assign time</text><text x="500.0" y="358.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">event time + ingest time</text><line x1="784.0" y1="339.5" x2="800.0" y2="339.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="343.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">fails: receipt time substituted</text><line x1="500.0" y1="377.0" x2="500.0" y2="401.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="404" width="560" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="432.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Route</text><text x="500.0" y="457.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">index, tier, access, filter</text><line x1="784.0" y1="438.5" x2="800.0" y2="438.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="434.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">fails: wrong index or</text><text x="806.0" y="450.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">dropped</text><line x1="500.0" y1="476.0" x2="500.0" y2="500.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="503" width="560" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="531.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Write + index</text><text x="500.0" y="556.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">searchable after refresh</text><line x1="784.0" y1="537.5" x2="800.0" y2="537.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="533.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">fails: indexing delay under</text><text x="806.0" y="549.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">load</text><rect x="36" y="590" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="590" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="610.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Delivered is not filed: each stage can mis-file evidence without raising an error.</text></g><text x="964" y="727" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>