<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" width="1000" height="345" role="img" aria-label="Two rows of tick marks: evenly spaced ticks for the beacon with coefficient of variation 0.004, and unevenly spaced ticks for human browsing with 0.345."><title>Beacon regularity</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="344" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M08-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Beacon regularity</text><g transform="translate(0,68)"><text x="36.0" y="30.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">WS-104 → cdn-telemetry-sync</text><line x1="249.09234" y1="38" x2="964" y2="38" stroke="#CBD5E1" stroke-width="2"/><rect x="260.9" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="343.1" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="425.3" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="507.5" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="589.7" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="672.0" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="754.2" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="836.4" y="22" width="5" height="32" rx="2" fill="#DC2626"/><rect x="918.6" y="22" width="5" height="32" rx="2" fill="#DC2626"/><text x="249.1" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#7F1D1D" text-anchor="start">gaps ≈ 300 s · cv = 0.004 → regular (machine beacon)</text><text x="36.0" y="112.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">WS-105 → maps.example.net</text><line x1="249.09234" y1="120" x2="964" y2="120" stroke="#CBD5E1" stroke-width="2"/><rect x="268.0" y="104" width="5" height="32" rx="2" fill="#2563EB"/><rect x="389.6" y="104" width="5" height="32" rx="2" fill="#2563EB"/><rect x="439.6" y="104" width="5" height="32" rx="2" fill="#2563EB"/><rect x="618.3" y="104" width="5" height="32" rx="2" fill="#2563EB"/><rect x="682.7" y="104" width="5" height="32" rx="2" fill="#2563EB"/><rect x="840.0" y="104" width="5" height="32" rx="2" fill="#2563EB"/><rect x="875.7" y="104" width="5" height="32" rx="2" fill="#2563EB"/><rect x="911.5" y="104" width="5" height="32" rx="2" fill="#2563EB"/><text x="249.1" y="156.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#123E73" text-anchor="start">cv = 0.345 → irregular (human browsing)</text><text x="964.0" y="176.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="end">time →</text><rect x="36" y="196" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="196" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="216.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A low coefficient of variation (cv) of the gaps between connections is a strong beacon signal.</text></g><text x="964" y="333" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>