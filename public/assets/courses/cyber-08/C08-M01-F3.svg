<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 283" width="1000" height="283" role="img" aria-label="Five acknowledge times listed, with bars showing a median of 4 minutes and a mean of 32.4 minutes, and a note that the outlier was a true positive."><title>Mean versus median MTTA (execution-tested data)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="282" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M01-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Mean versus median MTTA (execution-tested data)</text><g transform="translate(0,68)"><text x="36.0" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Acknowledge times (minutes): 5, 2, 1, 150, 4</text><text x="94.7" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Median</text><rect x="108.66036" y="44" width="745.33964" height="26" rx="6" fill="#F1F5F9"/><rect x="108.66036" y="44" width="92.01723950617284" height="26" rx="6" fill="#6CCB95"/><text x="210.7" y="62.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="start">4.0 min</text><text x="94.7" y="103.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Mean</text><rect x="108.66036" y="86" width="745.33964" height="26" rx="6" fill="#F1F5F9"/><rect x="108.66036" y="86" width="745.33964" height="26" rx="6" fill="#F19A9A"/><text x="864.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="start">32.4 min</text><rect x="36" y="134" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="134" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="154.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">One 150-minute outlier drags the mean up; and that case was a TRUE POSITIVE, so investigate why it waited.</text></g><text x="964" y="271" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>