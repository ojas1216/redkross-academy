"560" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="189.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Threat intel platform</text><text x="500.0" y="214.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">dedupe, score, age, TLP</text><line x1="500.0" y1="233.5" x2="500.0" y2="257.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="260.5" width="560" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="288.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Match against SIEM / EDR</text><text x="500.0" y="313.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">past + live</text><line x1="500.0" y1="332.5" x2="500.0" y2="356.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="359.5" width="560" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="387.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Analyst review in context (Module 4)</text><text x="500.0" y="412.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">enrich the alert · hunt (Module 8) · block (via change control)</text><line x1="500.0" y1="431.5" x2="500.0" y2="455.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="458.5" width="560" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="486.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middl