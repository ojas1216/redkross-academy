FF" stroke="#CBD5E1"/><text x="399.7" y="334.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M313.5,459.7 L313.5,475.3 L81.9,475.3 L81.9,521.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M376.4,459.7 L376.4,485.3 L261.6,485.3 L261.6,521.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M439.4,459.7 L439.4,521.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="225.46565000000004" y="12" width="235.0305" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="343.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Intel / ATT&amp;CK gap / incident</text><rect x="276.7352" y="114.75" width="132.4914" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="343.0" y="143.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">HYPOTHESIS</text><rect x="242.7092" y="217.5" width="200.54340000000002" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="343.0" y="245.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Data requirements met?</text><rect x="84.88540000000003" y="396.25" width="131.6169" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="150.7" y="424.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Telemetry gap</text><text x="150.7" y="449.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">fix collection first</text><rect x="250.50230000000002" y="412.9375" width=