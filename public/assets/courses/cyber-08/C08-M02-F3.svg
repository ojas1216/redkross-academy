<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 369" width="1000" height="369" role="img" aria-label="An IST and a UTC timestamp both mapping to the same UTC instant, with a warning about naive timestamps."><title>Same instant, two clocks</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="368" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Same instant, two clocks</text><g transform="translate(0,68)"><g transform="translate(275.9,4) scale(1.000)"><path d="M136.5,46.5 L314.5,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="192.5096" y="19.5" width="66.008" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="225.5" y="33.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">normalise</text><path d="M136.5,149.5 L268.5,149.5 L268.5,69.5 L314.5,69.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="192.5096" y="156.5" width="66.008" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="225.5" y="170.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">normalise</text><rect x="12" y="12" width="124.5096" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="74.3" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Firewall (IST)</text><text x="74.3" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">11:42+05:30</text><rect x="16.509600000000006" y="115" width="120" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="76.5" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Proxy (UTC)</text><text x="76.5" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">06:12+00:00</text><rect x="314.5176" y="23.5" width="121.71249999999999" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="375.4" y="51.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">06:12Z</text><text x="375.4" y="76.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">the same instant</text></g><rect x="36" y="220" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="220" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="240.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A naive &quot;11:42&quot; with no offset cannot be compared safely: fix it at ingestion.</text></g><text x="964" y="357" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>