<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 553" width="1000" height="553" role="img" aria-label="Three columns of sources - endpoint, network and identity/cloud - with arrows into a collection pipeline and SIEM."><title>Telemetry families</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="552" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C08-M02-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Telemetry families</text><g transform="translate(0,68)"><g transform="translate(187.5,4) scale(1.000)"><path d="M222.0,62.8 L232.0,62.8 L232.0,186.6 L278.0,186.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,198.3 L278.0,198.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,325.6 L232.0,325.6 L232.0,209.9 L278.0,209.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M437.0,198.3 L493.0,198.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="12" width="210" height="101.5" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="117.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">ENDPOINT</text><text x="117.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Windows Security/System ·</text><text x="117.0" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Sysmon (33) · PowerShell ·</text><text x="117.0" y="97.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">EDR · auditd · journal</text><rect x="12" y="147.5" width="210" height="101.5" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="117.0" y="175.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">NETWORK</text><text x="117.0" y="200.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">firewall, proxy (284) · DNS ·</text><text x="117.0" y="216.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">flow (NetFlow) · IDS / NDR ·</text><text x="117.0" y="233.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">packets</text><rect x="12" y="283" width="210" height="85.25" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="117.0" y="311.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">IDENTITY / CLOUD</text><text x="117.0" y="336.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">AD / IdP sign-ins · MFA · VPN</text><text x="117.0" y="352.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">(10) · CloudTrail / Activity Log</text><rect x="278" y="174.875" width="159.01260000000002" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="357.5" y="203.1" font-famil