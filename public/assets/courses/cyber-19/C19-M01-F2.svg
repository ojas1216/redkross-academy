FF" stroke="#F59E4B"/><text x="518.1" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Testing window</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="122" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="105.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Scope</text><rect x="184" y="69.1875" width="129.03" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="248.5" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">In-scope systems</text><rect x="321.03" y="69.1875" width="299.346" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="470.7" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Explicit out-of-scope (production, third parties)</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="122" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="105.0" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Safety</text><rect x="184" y="125.3125" width="74.274" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="221.1" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Isolation</text><rect x="266.274" y="125.3125" width="111.0345" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="321.8" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">No destruction</text><rect x="385.3085" y="125.3125" width="