font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Network boundary</text><text x="487.3" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">egress filter + proxy + flow logs</text><rect x="644.4124" y="23.125" width="120" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="704.4" y="51.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">C2 server</text></g><rect x="36" y="117" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="117" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="137.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">C2 must cross the boundary again and again, which makes the boundary a detection and containment point.</text></g><text x="964" y="254" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>