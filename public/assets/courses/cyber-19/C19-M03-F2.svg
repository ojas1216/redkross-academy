<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 566" width="1000" height="566" role="img" aria-label="A decision that refuses targets not provably in scope."><title>Fail-safe scope enforcement</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="565" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C19-M03-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Fail-safe scope enforcement</text><g transform="translate(0,68)"><g transform="translate(323.0,4) scale(1.000)"><path d="M192.0,58.8 L192.0,114.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M142.0,180.3 L142.0,190.3 L72.0,190.3 L72.0,312.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="33.328" y="236.25" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="49.7" y="250.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M242.0,180.3 L242.0,312.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="248.95265" y="236.25" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="262.6" y="250.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><rect x="131.95265" y="12" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="192.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Target</text><rect x="41.952650000000006" y="114.75" width="300" height="65.5" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="192.0" y="143.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">In the authorised network, or a listed</text><text x="192.0" y="161.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">host?</text><rect x="12" y="312.25" width="120" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="72.0" y="340.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">IN-SCOPE</text><text x="72.0" y="365.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">may act</text><rect x="166" y="312.25" width="151.9053" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="242.0" y="340.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">OUT-OF-SCOPE</text><text x="242.0" y="365.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">REFUSE</text></g><rect x="36" y="417.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="417.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="437.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">When unsure, the default is OUT-OF-SCOPE.</text></g><text x="964" y="554" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>