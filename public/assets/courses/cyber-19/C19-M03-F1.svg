<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 309" width="1000" height="309" role="img" aria-label="Mapping, validation and evidence shown inside a scope boundary with a scope check gating every action."><title>Mapping, validation and evidence within scope</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="308" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C19-M03-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Mapping, validation and evidence within scope</text><g transform="translate(0,68)"><rect x="240" y="6" width="520" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Authorised scope</text><text x="500.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">the boundary; every action is scope-checked first (fail-safe)</text><rect x="36" y="121" width="298.6666666666667" height="67.1" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="185.3" y="148.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">Map</text><text x="185.3" y="171.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">assets + identities, in scope only</text><rect x="350.6666666666667" y="121" width="298.6666666666667" height="67.1" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="148.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">Validate findings</text><text x="500.0" y="171.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">minimal, non-destructive, reversible</text><rect x="665.3333333333334" y="121" width="298.6666666666667" height="67.1" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="814.7" y="148.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Record evidence</text><text x="814.7" y="171.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">attribution + time + integrity</text><line x1="500" y1="75" x2="500" y2="98" stroke="#64748B" stroke-width="1.8"/><line x1="185.33333333333334" y1="98" x2="814.6666666666667" y2="98" stroke="#64748B" stroke-width="1.8"/><line x1="185.3" y1="98.0" x2="185.3" y2="118.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="500.0" y1="98.0" x2="500.0" y2="118.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="814.7" y1="98.0" x2="814.7" y2="118.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/></g><text x="964" y="297" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>