<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 287" width="1000" height="287" role="img" aria-label="A request path from client through service to database with transport encryption, field-level encryption and storage encryption, labelled with the threats each addresses."><title>Encryption layers</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="286" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C22-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Encryption layers</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="208.7493" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="148.4" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">TLS / mTLS</text><rect x="270.7493" y="13.0625" width="116.86649999999999" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="329.2" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Client ↔ service</text><rect x="395.6158" y="13.0625" width="168.045" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="479.6" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Covers: network sniffing</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="208.7493" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="148.4" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Field-level (FLE with CMK)</text><rect x="270.7493" y="69.1875" width="140.154" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="340.8" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Service → database</text><rect x="418.9033" y="69.1875" width="218.33249999999998" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="528.1" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Covers: DB admin / backup theft</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="208.7493" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="148.4" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Platform encryption at rest</text><rect x="270.7493" y="125.3125" width="106.52550000000001" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="324.0" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Disk / storage</text><rect x="385.2748" y="125.3125" width="141.04500000000002" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="455.8" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Covers: media theft</text></g><text x="964" y="275" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" f