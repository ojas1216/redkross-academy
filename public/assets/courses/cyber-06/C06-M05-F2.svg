<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="A worked example of a SQL injection authentication bypass in the vulnerable login query and the parameterised version that stops it."><title>SQL injection auth bypass in the lab</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="371" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M05-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">SQL injection auth bypass in the lab</text><g transform="translate(0,68)"><rect x="36" y="4" width="455" height="245.5" rx="10" fill="#0F172A" stroke="#F19A9A" stroke-width="1.5"/><rect x="36" y="4" width="455" height="32" rx="10" fill="#FEF2F2"/><rect x="36" y="26" width="455" height="10" fill="#FEF2F2"/><text x="50.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#7F1D1D" text-anchor="start">Vulnerable: string formatting</text><text x="50" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">q = &quot;...WHERE username=&#39;%s&#39;</text><text x="50" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">     AND password=&#39;%s&#39;&quot; % (user, pw)</text><text x="50" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">input: user = admin&#39;--   pw = x</text><text x="50" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">...WHERE username=&#39;admin&#39;--&#39;</text><text x="50" y="168.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">   AND password=&#39;x&#39;</text><text x="50" y="187.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">-- comments out the password check</text><text x="50" y="224.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">-&gt; admin row returns -&gt; logged in</text><rect x="509" y="4" width="455" height="245.5" rx="10" fill="#0F172A" stroke="#6CCB95" stroke-width="1.5"/><rect x="509" y="4" width="455" height="32" rx="10" fill="#ECFDF3"/><rect x="509" y="26" width="455" height="10" fill="#ECFDF3"/><text x="523.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#14532D" text-anchor="start">Fixed: parameterised query</text><text x="523" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">execute(</text><text x="523" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  &quot;...WHERE username=? AND password=?&quot;,</text><text x="523" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  (user, pw)</text><text x="523" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">)</text><text x="523" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="523" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">input stays data -&gt; no bypass</text></g><text x="964" y="360" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>