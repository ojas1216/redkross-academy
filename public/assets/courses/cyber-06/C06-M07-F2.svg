<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 321" width="1000" height="321" role="img" aria-label="A comparison of trusting a client-supplied price against looking the price up server-side, with validated quantity and single-use coupon rules."><title>Business logic flaw - client-trusted price</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="320" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M07-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Business logic flaw - client-trusted price</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="150.675" rx="12" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7F1D1D" text-anchor="middle">UNSAFE</text><circle cx="56" cy="70" r="3.5" fill="#DC2626"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">price = float(form[&quot;price&quot;])</text><circle cx="56" cy="98.225" r="3.5" fill="#DC2626"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">The attacker sets price = 0.01</text><rect x="511" y="4" width="453" height="150.675" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">SAFE</text><circle cx="531" cy="70" r="3.5" fill="#16A34A"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">price = catalogue.price_of(id): the server is authoritative</text><circle cx="531" cy="98.225" r="3.5" fill="#16A34A"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Quantity validated (&gt; 0, ≤ max)</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#16A34A"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Coupon atomically single-use</text><circle cx="500" cy="79.3375" r="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="83.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">vs</text><rect x="36" y="172.675" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="172.675" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="193.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rule: enforce every business rule and value on the server.</text></g><text x="964" y="309" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>