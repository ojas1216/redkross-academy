<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 343" width="1000" height="343" role="img" aria-label="A diagram of reflected, stored and DOM XSS contexts with the shared fix of contextual output encoding, CSP and HttpOnly cookies."><title>XSS contexts and the encoding fix</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M05-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">XSS contexts and the encoding fix</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="122" height="32.125" rx="8" fill="#FEF2F2" stroke="#F19A9A"/><text x="105.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">Reflected</text><rect x="184" y="13.0625" width="488.08950000000004" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="428.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">/search?q=&lt;script&gt; is echoed into the response and runs (delivered via a link)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="122" height="32.125" rx="8" fill="#FEF2F2" stroke="#F19A9A"/><text x="105.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">Stored</text><rect x="184" y="69.1875" width="361.6215" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="364.8" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Review body &lt;script&gt; is saved and runs for every viewer</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="122" height="32.125" rx="8" fill="#FEF2F2" stroke="#F19A9A"/><text x="105.0" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">DOM-based</text><rect x="184" y="125.3125" width="362.39099999999996" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="365.2" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Client-side JavaScript writes input into the page unsafely</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="122" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="105.0" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Fix</text><rect x="184" y="181.4375" width="280.6215" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="324.3" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Encode output for its context (html.escape)</text><rect x="472.6215" y="181.4375" width="165.03449999999998" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="555.1" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Content-Security-Policy</text><rect x="645.656" y="181.4375" width="126.033" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="708.7" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">HttpOnly cookies</text></g><text x="964" y="331" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>