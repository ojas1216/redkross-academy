<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 373" width="1000" height="373" role="img" aria-label="A flow showing an attacker page auto-submitting a state-changing request with the victim&#39;s cookie, accepted by the vulnerable app and rejected by the hardened app&#39;s CSRF token and SameSite cookie."><title>How CSRF works and how tokens stop it</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="372" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M06-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">How CSRF works and how tokens stop it</text><g transform="translate(0,68)"><g transform="translate(150.9,4) scale(1.000)"><path d="M154.2,74.7 L210.2,74.7" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M420.2,54.6 L476.2,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M420.2,94.7 L430.2,94.7 L430.2,182.0 L476.2,182.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="40.16666666666667" width="142.22220000000002" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="83.1" y="68.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Victim logged in</text><text x="83.1" y="93.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">session cookie set</text><rect x="210.22220000000002" y="14.541666666666671" width="210" height="120.25" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="315.2" y="42.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Attacker page</text><text x="315.2" y="61.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">auto-submits</text><text x="315.2" y="86.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">POST app/account/update; the</text><text x="315.2" y="102.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">browser attaches the victim</text><text x="315.2" y="118.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">cookie</text><rect x="476.22220000000004" y="12" width="210" height="85.25" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="581.2" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Vulnerable</text><text x="581.2" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">server only checks the cookie:</text><text x="581.2" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">email changed as the victim</text><rect x="476.22220000000004" y="131.25" width="210" height="101.5" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="581.2" y="159.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Fixed</text><text x="581.2" y="184.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">per-session CSRF token the</text><text x="581.2" y="200.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">attacker cannot read + SameSite</text><text x="581.2" y="216.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">cookie: request rejected</text></g></g><text x="964" y="361" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>