<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 331" width="1000" height="331" role="img" aria-label="A comparison of the vulnerable admin check that trusts a client-supplied role cookie against the hardened check that requires an authenticated admin session."><title>Broken function-level control in the lab</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M04-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Broken function-level control in the lab</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="191.70397" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="139.9" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">GET /admin with Cookie</text><rect x="253.70397" y="13.0625" width="240.4455" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="373.9" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Role=admin (no real admin session)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="191.70397" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="139.9" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Vuln</text><rect x="253.70397" y="69.1875" width="346.9875" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="427.2" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">If cookie role == admin -&gt; show all users (trusts client)</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="191.70397" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="139.9" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Fixed</text><rect x="253.70397" y="125.3125" width="218.7105" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="363.1" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">If session.role == admin -&gt; show</text><rect x="480.41447" y="125.3125" width="163.536" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="562.2" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Else 403 (trusts server)</text><rect x="36" y="182.375" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="182.375" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="202.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rule: decide from the authenticated session, deny by default</text></g><text x="964" y="319" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>