<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 297" width="1000" height="297" role="img" aria-label="A side-by-side HTTP request and response showing method, headers, the Set-Cookie line and the absent cookie security attributes."><title>Anatomy of an HTTP exchange</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="296" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M01-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Anatomy of an HTTP exchange</text><g transform="translate(0,68)"><rect x="36" y="4" width="455" height="170.5" rx="10" fill="#0F172A" stroke="#7FB0EE" stroke-width="1.5"/><rect x="36" y="4" width="455" height="32" rx="10" fill="#EFF6FF"/><rect x="36" y="26" width="455" height="10" fill="#EFF6FF"/><text x="50.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#123E73" text-anchor="start">Request</text><text x="50" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">GET /login?user=asha HTTP/1.1</text><text x="50" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Host: 127.0.0.1:8200</text><text x="50" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Cookie: session=...</text><text x="50" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="50" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">(body for POST / PUT)</text><rect x="509" y="4" width="455" height="170.5" rx="10" fill="#0F172A" stroke="#F59E4B" stroke-width="1.5"/><rect x="509" y="4" width="455" height="32" rx="10" fill="#FFF4E8"/><rect x="509" y="26" width="455" height="10" fill="#FFF4E8"/><text x="523.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#7A3A06" text-anchor="start">Response</text><text x="523" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">HTTP/1.1 200 OK</text><text x="523" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Content-Type: text/html</text><text x="523" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Set-Cookie: session=YXNoYQ==; Path=/</text><text x="523" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve"></text><text x="523" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">(missing: HttpOnly; Secure; SameSite)</text><text x="523" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">(body: HTML the browser renders)</text></g><text x="964" y="285" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>