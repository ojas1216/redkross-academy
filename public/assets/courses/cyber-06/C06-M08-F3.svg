<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 331" width="1000" height="331" role="img" aria-label="A summary showing all ten weaknesses present on the vulnerable app, none on the hardened app, and all ten confirmed closed by retest."><title>Closure proven by retest</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M08-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Closure proven by retest</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="131.94540999999998" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="110.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Vuln app 8200</text><rect x="193.94540999999998" y="13.0625" width="210.8265" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="299.4" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">10 / 10 weaknesses PRESENT</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="131.94540999999998" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="110.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Fixed app 8201</text><rect x="193.94540999999998" y="69.1875" width="184.58249999999998" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="286.2" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">0 / 10 weaknesses present</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="131.94540999999998" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="110.0" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Retest result</text><rect x="193.94540999999998" y="125.3125" width="368.4525" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="378.2" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">10 / 10 CLOSED (each present on 8200, absent on 8201)</text><rect x="36" y="182.375" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="182.375" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="202.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A finding is closed only when the retest proves it</text></g><text x="964" y="319" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>