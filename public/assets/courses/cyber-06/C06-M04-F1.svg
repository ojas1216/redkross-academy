<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 331" width="1000" height="331" role="img" aria-label="A diagram contrasting authentication (who you are) with authorisation (what you may do), split into object-level and function-level checks."><title>Authentication versus authorisation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M04-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Authentication versus authorisation</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="160.91786000000002" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="124.5" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">AUTHENTICATION</text><rect x="222.91786000000002" y="13.0625" width="271.2255" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="358.5" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Who are you? -&gt; verified by login/session</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="160.91786000000002" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="124.5" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">AUTHORISATION</text><rect x="222.91786000000002" y="69.1875" width="338.01000000000005" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="391.9" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">What may you do? -&gt; object check: own this record?</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="160.91786000000002" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="124.5" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Function check</text><rect x="222.91786000000002" y="125.3125" width="110.2785" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="278.1" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Hold this role?</text><rect x="36" y="182.375" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="182.375" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="202.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Broken access control = missing object or function check (server-side)</text></g><text x="964" y="319" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>