<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" width="1000" height="378" role="img" aria-label="A diagram showing categories of untrusted input on the left crossing a central trust boundary to reach trusted sinks on the right, with the definition of a weakness."><title>Attack surface and trust boundary</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="377" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M02-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Attack surface and trust boundary</text><g transform="translate(0,68)"><rect x="36" y="4" width="294.6666666666667" height="207.125" rx="12" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="183.3" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7F1D1D" text-anchor="middle">Untrusted inputs</text><circle cx="56" cy="70" r="3.5" fill="#DC2626"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">URL path / query</text><circle cx="56" cy="98.225" r="3.5" fill="#DC2626"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Form / JSON body</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#DC2626"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Headers / cookies</text><circle cx="56" cy="154.67499999999998" r="3.5" fill="#DC2626"/><text x="68.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">File uploads</text><rect x="352.6666666666667" y="4" width="294.6666666666667" height="207.125" rx="12" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">TRUST BOUNDARY</text><circle cx="372.6666666666667" cy="70" r="3.5" fill="#F59E4B"/><text x="384.7" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#E5E7EB" text-anchor="start">Server-side validation</text><circle cx="372.6666666666667" cy="98.225" r="3.5" fill="#F59E4B"/><text x="384.7" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#E5E7EB" text-anchor="start">Authorisation</text><circle cx="372.6666666666667" cy="126.44999999999999" r="3.5" fill="#F59E4B"/><text x="384.7" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#E5E7EB" text-anchor="start">Output encoding</text><rect x="669.3333333333334" y="4" width="294.6666666666667" height="207.125" rx="12" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="816.7" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle">Trusted sinks</text><circle cx="689.3333333333334" cy="70" r="3.5" fill="#2563EB"/><text x="701.3" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SQL query</text><circle cx="689.3333333333334" cy="98.225" r="3.5" fill="#2563EB"/><text x="701.3" y="102.2" font-family="Helvetica, 