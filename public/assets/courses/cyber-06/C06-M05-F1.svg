<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 369" width="1000" height="369" role="img" aria-label="A diagram showing untrusted data reaching a SQL string (cured by parameterisation) or HTML output (cured by output encoding), under the shared rule to keep data as data."><title>One root cause, two cures</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="368" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">One root cause, two cures</text><g transform="translate(0,68)"><g transform="translate(152.1,4) scale(1.000)"><path d="M222.0,46.5 L286.4,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M222.0,74.9 L232.0,74.9 L232.0,149.5 L278.0,149.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M445.2,46.5 L509.6,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M453.6,149.5 L509.6,149.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="18.083333333333332" width="210" height="85.25" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="117.0" y="46.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">ROOT CAUSE</text><text x="117.0" y="71.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">untrusted DATA interpreted as</text><text x="117.0" y="87.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">CODE / markup</text><rect x="286.3952" y="12" width="158.8536" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="365.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Input → SQL string</text><text x="365.8" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">SQL injection</text><rect x="278" y="115" width="175.644" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="365.8" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Input → HTML output</text><text x="365.8" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">cross-site scripting</text><rect x="509.644" y="12" width="166.0722" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="592.7" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Cure: parameterise</text><text x="592.7" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">bind data separately</text><rect x="509.644" y="115" width="174.0699" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="596.7" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Cure: encode output</text><text x="596.7" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">render as text</text></g><rect x="36" y="220" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="220" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="240.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Keep data as data; never let input cross into the code or markup channel.</text></g><text x="964" y="357" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>