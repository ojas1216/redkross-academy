<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 282" width="1000" height="282" role="img" aria-label="A two-box diagram showing an untrusted browser exchanging HTTP requests and responses with a trusted server, with the rule that security is enforced server-side."><title>The browser-server trust boundary</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="281" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M01-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The browser-server trust boundary</text><g transform="translate(0,68)"><g transform="translate(125.3,4) scale(1.000)"><path d="M222.0,40.4 L558.8,40.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="278" y="13.416666666666668" width="224.78000000000003" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="390.4" y="27.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">request: method, headers, cookie, body</text><path d="M558.8,63.4 L512.8,63.4 L512.8,68.8 L222.0,68.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="298.01" y="75.83333333333334" width="184.76" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="390.4" y="89.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">response: status, headers, body</text><rect x="12" y="12" width="210" height="85.25" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="117.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">BROWSER (untrusted)</text><text x="117.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">the user and any attacker control</text><text x="117.0" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">everything here</text><rect x="558.78" y="17.416666666666668" width="178.675" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="648.1" y="45.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">SERVER (trusted)</text><text x="648.1" y="70.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">enforces ALL security here</text></g><rect x="36" y="133.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="133.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="153.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rule: client-side checks are for user experience; security is enforced server-side.</text></g><text x="964" y="270" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>