<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="A diagram showing the server fetching attacker-chosen internal or metadata URLs, with the fix of a default-deny allowlist and blocked internal address ranges."><title>SSRF and the server&#39;s network position</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="349" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C06-M06-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">SSRF and the server&#39;s network position</text><g transform="translate(0,68)"><g transform="translate(58.5,4) scale(1.000)"><path d="M132.0,50.5 L360.0,50.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="188" y="57.5" width="116.036" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="246.0" y="71.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">URL of their choice</text><path d="M507.0,39.0 L721.7,39.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="562.9646" y="12" width="102.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="614.3" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">server-side fetch</text><path d="M507.0,62.0 L517.0,62.0 L517.0,130.9 L721.7,130.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="562.9646" y="137.875" width="102.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="614.3" y="151.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">server-side fetch</text><rect x="12" y="27.125" width="120" height="46.75" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="72.0" y="55.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Attacker</text><rect x="360.036" y="16" width="146.92860000000002" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="433.5" y="44.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">App /fetch?url=…</text><text x="433.5" y="69.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">inside the network</text><rect x="721.6566" y="15.625" width="137.80200000000002" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="790.6" y="43.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Internal service</text><rect x="721.6566" y="96.375" width="149.3454" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="796.3" y="124.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">169.254.169.254</text><text x="796.3" y="149.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">cloud metadata</text></g><rect x="36" y="201.375" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="201.375" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="221.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The app returns contents the attacker could not reach directly (SSRF). Fix: default-deny allowlist and block private, loopback and link-local ranges.</text></g><text x="964" y="338" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>