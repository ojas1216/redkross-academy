<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" width="1000" height="432" role="img" aria-label="User messages, documents and the system prompt join into one context for the model; its output passes through code-level tool policy and output filtering."><title>Trust boundaries in an LLM application</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="431" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C18-M01-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Trust boundaries in an LLM application</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.937)"><path d="M198.4,46.5 L208.4,46.5 L208.4,132.3 L254.4,132.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M198.4,149.5 L254.4,149.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M198.4,241.4 L208.4,241.4 L208.4,166.8 L254.4,166.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M443.5,149.5 L499.5,149.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M619.5,141.7 L832.2,141.7" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="675.456" y="114.70833333333333" width="100.724" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="725.8" y="128.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">untrusted output</text><path d="M619.5,157.3 L629.5,157.3 L629.5,233.6 L832.2,233.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="675.456" y="240.58333333333331" width="100.724" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="725.8" y="254.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">untrusted output</text><rect x="65.93280000000001" y="12" width="132.4914" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="132.2" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">User message</text><text x="132.2" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">untrusted</text><rect x="12" y="115" width="186.4242" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="105.2" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Knowledge-base docs</text><text x="105.2" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">mixed trust</text><rect x="61.51259999999999" y="218" width="136.91160000000002" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="130.0" y="246.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">System prompt</text><rect x="254.4242" y="115" width="189.0318" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="348.9" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Assembled CONTEXT</text><text x="348.9" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">one token stream</text><rect x="499.456" y="126.125" width="120" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="559.5" y="154.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">MODEL</text><rect x="832.1800000000001" y="107.20833333333333" width="122.4125" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="893.4" y="135.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Tool policy</text><text x="893.4" y="160.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">enforced in code</text><rect x="832.1800000000001" y="210.20833333333331" width="146.4675" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="905.4" y="238.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Output filter → UI</text></g><rect x="36" y="283.24862274421525" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="283.24862274421525" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="303.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Instructions and data share one token stream, so the model cannot reliably tell them apart: enforce trust boundaries in code around it.</text></g><text x="964" y="420" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>