<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 293" width="1000" height="293" role="img" aria-label="Two kinds of evidence: probes test system behaviour; unit tests prove the control."><title>Probe versus unit test</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="292" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C18-M05-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Probe versus unit test</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="122.45" rx="12" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#3B2A7A" text-anchor="middle">Probe (model-driven)</text><circle cx="56" cy="70" r="3.5" fill="#7C3AED"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Does the system propose or allow bad actions?</text><circle cx="56" cy="98.225" r="3.5" fill="#7C3AED"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Hardened P5: the model proposed none → 0 / 5</text><rect x="511" y="4" width="453" height="122.45" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Unit test (direct)</text><circle cx="531" cy="70" r="3.5" fill="#16A34A"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Does the policy block bad actions when proposed?</text><circle cx="531" cy="98.225" r="3.5" fill="#16A34A"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">7 / 7 tests pass (cross-customer, amount, window)</text><rect x="36" y="144.45" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="144.45" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="164.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">You need both: probes measure behaviour; unit tests prove the control works even if the model misbehaves.</text></g><text x="964" y="281" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>