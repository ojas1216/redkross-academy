<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 228" width="1000" height="228" role="img" aria-label="The API review failing on an insecure config and passing on a hardened one."><title>The API review, FAIL to PASS</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="227" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M07-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The API review, FAIL to PASS</text><g transform="translate(0,68)"><rect x="36" y="8" width="286.6666666666667" height="101.5" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="179.3" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Insecure config</text><text x="179.3" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">no auth, non-expiring tokens, cleartext, no</text><text x="179.3" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">authz, no rate limit, verbose errors, excess</text><text x="179.3" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">data → 7 findings, 5 HIGH: FAIL</text><line x1="325.7" y1="58.8" x2="353.7" y2="58.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="356.6666666666667" y="8" width="286.6666666666667" height="101.5" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="44.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Apply controls</text><text x="500.0" y="69.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">validated / expiring tokens, TLS, per-request</text><text x="500.0" y="85.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">authz, rate limit, generic errors, minimal data</text><line x1="646.3" y1="58.8" x2="674.3" y2="58.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="677.3333333333334" y="8" width="286.6666666666667" height="101.5" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="820.7" y="52.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Hardened config</text><text x="820.7" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">0 findings: PASS</text></g><text x="964" y="216" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>