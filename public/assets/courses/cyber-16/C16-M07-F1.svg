<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 284" width="1000" height="284" role="img" aria-label="An app as an untrusted client calling an API that enforces all security server-side."><title>The mobile app and its untrusted client</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="283" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M07-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The mobile app and its untrusted client</text><g transform="translate(0,68)"><g transform="translate(250.2,4) scale(1.000)"><path d="M132.0,46.5 L338.0,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="188" y="53.5" width="94.02799999999999" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="235.0" y="67.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">hostile network</text><rect x="12" y="12" width="120" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="72.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Mobile app</text><text x="72.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">untrusted client</text><rect x="338.028" y="12" width="149.5" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="412.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">API / backend</text><text x="412.8" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">the security boundary</text></g><rect x="36" y="117" width="928" height="54.45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="117" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="56.0" y="137.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The app cannot enforce security; the API must: authenticate every request (validated, expiring tokens), enforce TLS, authorise every object and</text><text x="56.0" y="155.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">action server-side, rate-limit, validate input, return minimal data and generic errors.</text></g><text x="964" y="272" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>