<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 231" width="1000" height="231" role="img" aria-label="Correct storage locations for sensitive data and keys versus insecure ones."><title>Where app data should live</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M05-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Where app data should live</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="122" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="105.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Correct</text><rect x="184" y="13.0625" width="410.964" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="389.5" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Sensitive data → INTERNAL (app-private) storage, ENCRYPTED</text><rect x="602.9639999999999" y="13.0625" width="335.202" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="770.6" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Keys → the platform KEYSTORE (hardware-backed)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="122" height="32.125" rx="8" fill="#FEF2F2" stroke="#F19A9A"/><text x="105.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">Insecure</text><rect x="184" y="69.1875" width="174.822" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="271.4" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">External / shared storage</text><rect x="366.822" y="69.1875" width="53.268" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="393.5" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Logs</text><rect x="428.09000000000003" y="69.1875" width="157.569" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="506.9" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Hard-coded in the app</text></g><text x="964" y="219" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>