<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 275" width="1000" height="275" role="img" aria-label="A comparison of WPA2 and WPA3 with the modern baseline of AES, WPA3 and required PMF."><title>WPA2 vs WPA3</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="274" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M02-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">WPA2 vs WPA3</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="122" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="105.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">WPA2 (2004)</text><rect x="184" y="13.0625" width="95.253" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="231.6" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">AES-CCMP</text><rect x="287.253" y="13.0625" width="346.65" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="460.6" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Personal=PSK (offline-guessable), Enterprise=802.1X</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="122" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="105.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">WPA3 (2018)</text><rect x="184" y="69.1875" width="261.46500000000003" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="314.7" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Personal=SAE (resists offline guessing)</text><rect x="453.46500000000003" y="69.1875" width="138.7905" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="522.9" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Enterprise stronger</text><rect x="36" y="126.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="126.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="146.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">PMF REQUIRED; mandatory for new certified devices Baseline: require AES; prefer WPA3; require PMF; never WEP/TKIP</text></g><text x="964" y="263" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>