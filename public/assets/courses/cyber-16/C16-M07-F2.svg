<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 252" width="1000" height="252" role="img" aria-label="Three pillars of mobile API security."><title>The three pillars</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="251" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M07-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The three pillars</text><g transform="translate(0,68)"><rect x="36" y="6" width="25.07232" height="20" rx="6" fill="#2563EB"/><text x="45.0" y="20.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">1</text><rect x="36" y="32" width="298.6666666666667" height="95.80000000000001" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="185.3" y="65.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle">Authentication</text><text x="185.3" y="91.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">validated, short-lived, revocable tokens; no</text><text x="185.3" y="108.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">client trust</text><rect x="350.6666666666667" y="6" width="25.07232" height="20" rx="6" fill="#7C3AED"/><text x="359.7" y="20.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">2</text><rect x="350.6666666666667" y="32" width="298.6666666666667" height="95.80000000000001" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="73.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#3B2A7A" text-anchor="middle">Transport</text><text x="500.0" y="99.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">strong TLS everywhere (pinning optional)</text><rect x="665.3333333333334" y="6" width="25.07232" height="20" rx="6" fill="#16A34A"/><text x="674.3" y="20.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">3</text><rect x="665.3333333333334" y="32" width="298.6666666666667" height="95.80000000000001" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="814.7" y="65.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Backend hardening</text><text x="814.7" y="91.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">per-request authorisation, rate limiting, input</text><text x="814.7" y="108.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">validation, generic errors, minimal data, logging</text></g><text x="964" y="240" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>