<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" width="1000" height="515" role="img" aria-label="A checklist of Bluetooth device-hardening settings."><title>Bluetooth hardening checklist</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="514" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M04-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Bluetooth hardening checklist</text><g transform="translate(0,68)"><rect x="36" y="6" width="456" height="78.9" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="264.0" y="39.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Authenticated association</text><text x="264.0" y="65.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">not Just Works</text><rect x="508" y="6" width="456" height="78.9" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="736.0" y="50.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">LE Secure Connections</text><rect x="36" y="100.9" width="456" height="78.9" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="264.0" y="134.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle">Discoverable on demand / limited</text><text x="264.0" y="160.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">not always on</text><rect x="508" y="100.9" width="456" height="78.9" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="736.0" y="145.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle">No default or fixed PIN</text><rect x="36" y="195.8" width="456" height="78.9" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="264.0" y="229.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#3B2A7A" text-anchor="middle">Maximum encryption key size</text><text x="264.0" y="255.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">16 bytes</text><rect x="508" y="195.8" width="456" height="78.9" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="736.0" y="240.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#3B2A7A" text-anchor="middle">Review and prune bonded devices</text><rect x="36" y="290.70000000000005" width="456" height="56" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="264.0" y="323.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7A3A06" text-anchor="middle">Disable Bluetooth when unused</text><rect x="508" y="290.70000000000005" width="456" height="56" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="736.0" y="323.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7A3A06" text-anchor="middle">Patch firmware</text><rect x="36" y="366.70000000000005" width="928" height="36.225" rx="8" fill="#F8FA