<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 387" width="1000" height="387" role="img" aria-label="The four association models ranked by MITM protection, with the rule to prefer authenticated models."><title>Association models and MITM protection</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="386" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M04-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Association models and MITM protection</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="170.32430000000002" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="129.2" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Just Works</text><rect x="232.32430000000002" y="13.0625" width="310.956" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="387.8" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">No interaction -&gt; NO MITM protection (weakest)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="170.32430000000002" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="129.2" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Numeric Comparison</text><rect x="232.32430000000002" y="69.1875" width="395.736" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="430.2" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Confirm matching number -&gt; MITM protected (needs displays)</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="170.32430000000002" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="129.2" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Passkey Entry</text><rect x="232.32430000000002" y="125.3125" width="266.7165" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="365.7" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Enter shown passkey -&gt; MITM protected</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="170.32430000000002" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="129.2" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">OOB (e.g. NFC)</text><rect x="232.32430000000002" y="181.4375" width="358.26000000000005" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="411.5" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Keys via other channel -&gt; MITM protected (per channel)</text><rect x="36" y="238.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="238.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="259.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rule: use an authenticated model wherever I/O allows</text></g><text x="964" y="375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>