<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 267" width="1000" height="267" role="img" aria-label="A checklist of secure WLAN deployment settings, and weak pseudo-controls to avoid relying on."><title>Secure-deployment checklist</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="266" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Secure-deployment checklist</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="132.76002" height="68" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="110.4" y="51.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Do</text><rect x="194.76002" y="12" width="277.57050000000004" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="333.5" y="32.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">WPA3 (or WPA2-AES); never WEP / TKIP</text><rect x="480.33052000000004" y="12" width="169.5435" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="565.1" y="32.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">PMF required (802.11w)</text><rect x="657.87402" y="12" width="108.78" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="712.3" y="32.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">WPS disabled</text><rect x="194.76002" y="50" width="219.84449999999998" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="304.7" y="70.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Strong, long random passphrase</text><rect x="422.60452" y="50" width="287.34450000000004" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="566.3" y="70.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Unique admin credentials; firmware patched</text><rect x="717.94902" y="50" width="239.3655" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="837.6" y="70.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Guest on a separate, isolated VLAN</text><rect x="36" y="96" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="104" width="132.76002" height="32.125" rx="8" fill="#FEF2F2" stroke="#F19A9A"/><text x="110.4" y="125.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">Do NOT rely on</text><rect x="194.76002" y="105.0625" width="172.5405" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="281.0" y="125.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">MAC filtering (spoofable)</text><rect x="375.30052" y="105.0625" width="183.813" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="467.2" y="125.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">SSID hiding (hygiene only)</text></g><text x="964" y="255" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>