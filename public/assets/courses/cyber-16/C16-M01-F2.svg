<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 349" width="1000" height="349" role="img" aria-label="The three Wi-Fi frame types and how unprotected management frames enable deauth attacks, defeated by PMF."><title>Wi-Fi frame types and the deauth threat</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="348" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C16-M01-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Wi-Fi frame types and the deauth threat</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="166.9429" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="127.5" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Data frames</text><rect x="228.9429" y="13.0625" width="317.355" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="387.6" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">The traffic itself (encrypted under WPA2 / WPA3)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="166.9429" height="32.125" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="127.5" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1E293B" text-anchor="middle">Control frames</text><rect x="228.9429" y="69.1875" width="225.798" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/><text x="341.8" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Medium access: ACK, RTS / CTS</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="166.9429" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="127.5" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Management frames</text><rect x="228.9429" y="125.3125" width="69.77850000000001" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="263.8" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Beacon</text><rect x="306.7214" y="125.3125" width="60.018" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="336.7" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Probe</text><rect x="374.73940000000005" y="125.3125" width="51.7695" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="400.6" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Auth</text><rect x="434.50890000000004" y="125.3125" width="116.2725" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="492.6" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">ASSOCIATION</text><rect x="558.7814000000001" y="125.3125" width="161.2545" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="639.4" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">DEAUTHENTICATION</text><rect x="36" y="182.375" width="928" height="54.45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="182.375" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="56.0" y="202.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Unprotected management frames let an attacker forge DEAUTH and knock clients off (DoS, or push them to an evil twin). Defence: Protected</text><text x="56.0" y="221.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Management Frames (802.11w), required by WPA3.</text></g><text x="964" y="337" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>