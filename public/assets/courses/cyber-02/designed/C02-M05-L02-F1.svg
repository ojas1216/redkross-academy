<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 459" width="1000" height="459" role="img" aria-label="Kaminsky cache-poisoning race"><title>Kaminsky cache-poisoning race</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="458" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="118.83736000000002" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="95.41868000000001" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C02-M05-L02-F1</text><text x="168.8" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Kaminsky cache-poisoning race</text><g transform="translate(0,68)"><line x1="190.66666666666666" y1="52.75" x2="190.66666666666666" y2="292.75" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="80.66666666666666" y="6" width="220" height="46.75" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="190.7" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Attacker (spoofer)</text><line x1="500" y1="52.75" x2="500" y2="292.75" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="390" y="6" width="220" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Recursive resolver</text><line x1="809.3333333333333" y1="52.75" x2="809.3333333333333" y2="292.75" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="699.3333333333333" y="6" width="220" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="809.3" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Legitimate authoritative NS</text><line x1="194.7" y1="86.8" x2="494.0" y2="86.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="345.3" y="78.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Query 12345.bank.example (uncached name)</text><circle cx="190.66666666666666" cy="86.75" r="9" fill="#EA6A0A"/><text x="190.7" y="90.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="504.0" y1="140.8" x2="803.3" y2="140.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="654.7" y="117.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Iterative query: random UDP source port + 16-bit</text><text x="654.7" y="132.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">TXID</text><circle cx="500" cy="140.75" r="9" fill="#EA6A0A"/><text x="500.0" y="144.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="194.7" y1="194.8" x2="494.0" y2="194.8" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="345.3" y="171.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Flood ~1,000 forged replies (Authority:</text><text x="345.3" y="186.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">bank.example NS = attacker)</text><circle cx="190.66666666666666" cy="194.75" r="9" fill="#EA6A0A"/><text x="190.7" y="198.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="805.3" y1="248.8" x2="506.0" y2="248.8" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="654.7" y="240.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">Authentic NXDOMAIN</text><circle cx="809.3333333333333" cy="248.75" r="9" fill="#EA6A0A"/><text x="809.3" y="252.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="36" y="310.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="310.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="331.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Without RFC 5452 defences, one forged reply with a matching TXID can cache a rogue NS delegation.</text></g><text x="964" y="447" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>