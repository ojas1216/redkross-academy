<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 304" width="1000" height="304" role="img" aria-label="A diagram showing a stateful firewall recording an outbound connection and automatically permitting the return traffic without a separate rule."><title>Stateful inspection</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="303" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C07-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Stateful inspection</text><g transform="translate(0,68)"><g transform="translate(91.4,4) scale(1.000)"><path d="M132.0,46.5 L404.7,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="203.34199999999998" y="19.5" width="130.02800000000002" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="268.4" y="33.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">SYN (allowed by rule)</text><path d="M607.0,46.5 L663.0,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M663.0,62.1 L617.0,62.1 L617.0,91.0 L142.0,91.0 L142.0,62.1 L132.0,62.1" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="188" y="98" width="160.71200000000002" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="268.4" y="112.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">reply: automatically allowed</text><rect x="12" y="30.916666666666668" width="120" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="72.0" y="59.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">App</text><rect x="404.712" y="12" width="202.3" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="505.9" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Firewall state table</text><text x="505.9" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">records the allowed connection</text><rect x="663.012" y="30.916666666666668" width="142.254" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="734.1" y="59.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Database :5432</text></g><rect x="36" y="155" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="155" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="175.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">No separate inbound rule is needed for return traffic; packets not in the state table are dropped.</text></g><text x="964" y="292" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>