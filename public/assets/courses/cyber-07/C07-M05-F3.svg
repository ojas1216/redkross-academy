<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" width="1000" height="305" role="img" aria-label="A comparison of the weak TLS configuration (legacy protocols, weak ciphers, 1024-bit key, near-expiry cert) and the hardened one."><title>TLS configuration review - weak versus hardened</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="304" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C07-M05-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">TLS configuration review - weak versus hardened</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="178.9" rx="12" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7F1D1D" text-anchor="middle">Pre-hardening (5 HIGH)</text><circle cx="56" cy="70" r="3.5" fill="#DC2626"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">TLS 1.0 / 1.1 / 1.2</text><circle cx="56" cy="98.225" r="3.5" fill="#DC2626"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">RC4, 3DES, AES-GCM</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#DC2626"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">RSA 1024-bit</text><circle cx="56" cy="154.67499999999998" r="3.5" fill="#DC2626"/><text x="68.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Certificate expires in 12 days</text><rect x="511" y="4" width="453" height="178.9" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Hardened (0)</text><circle cx="531" cy="70" r="3.5" fill="#16A34A"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">TLS 1.2 / 1.3 only</text><circle cx="531" cy="98.225" r="3.5" fill="#16A34A"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">AES-GCM, ChaCha20-Poly1305</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#16A34A"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">RSA 2048-bit</text><circle cx="531" cy="154.67499999999998" r="3.5" fill="#16A34A"/><text x="543.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Certificate expiry far off</text><circle cx="500" cy="93.45" r="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="98.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">vs</text></g><text x="964" y="293" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>