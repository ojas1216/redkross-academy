<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" width="1000" height="248" role="img" aria-label="A diagram of TLS protections and the certificate chain from the server certificate up through an intermediate CA to a trusted root."><title>TLS protections and the certificate chain</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="247" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C07-M05-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">TLS protections and the certificate chain</text><g transform="translate(0,68)"><g transform="translate(115.8,4) scale(1.000)"><path d="M154.2,35.4 L308.2,35.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="210.22220000000002" y="42.375" width="42.008" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="231.2" y="56.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">signs</text><path d="M453.1,35.4 L607.1,35.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="509.1077" y="42.375" width="42.008" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="530.1" y="56.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">signs</text><rect x="12" y="12" width="142.22220000000002" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="83.1" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Trusted root CA</text><rect x="308.2302" y="12" width="144.8775" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="380.7" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Intermediate CA</text><rect x="607.1157000000001" y="12" width="149.2818" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="681.8" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Server certificate</text></g><rect x="36" y="99.375" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="99.375" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="119.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">TLS gives confidentiality, integrity and authentication. The client checks the signature chain, domain match, validity and revocation.</text></g><text x="964" y="236" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>