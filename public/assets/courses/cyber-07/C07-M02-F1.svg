<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-label="A trace of a user-to-database flow through an ordered ruleset, matching an over-broad rule and being allowed before later rules are reached."><title>First-match evaluation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="403" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C07-M02-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">First-match evaluation</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">RULE</text><text x="195.5" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">MATCHES</text><text x="433.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">RESULT FOR FLOW USER → DB TCP/5432</text><rect x="36" y="42" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="42" width="4" height="36.225" rx="2" fill="#475569"/><text x="50.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start">Rule 0</text><text x="195.5" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">internet → dmz : 443</text><text x="433.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">No match</text><rect x="36" y="82.225" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="82.225" width="4" height="36.225" rx="2" fill="#475569"/><text x="50.0" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start">Rule 1</text><text x="195.5" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">dmz → app : 8080</text><text x="433.0" y="104.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">No match</text><rect x="36" y="122.44999999999999" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="122.44999999999999" width="4" height="36.225" rx="2" fill="#475569"/><text x="50.0" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start">Rule 2</text><text x="195.5" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">app → db : 5432</text><text x="433.0" y="144.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">No match</text><rect x="36" y="162.67499999999998" width="928" height="36.225" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="36" y="162.67499999999998" width="4" height="36.225" rx="2" fill="#DC2626"/><text x="50.0" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7F1D1D" text-anchor="start">Rule 3</text><text x="195.5" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">user → any : 1–65535</text><text x="433.0" y="185.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">MATCH → ALLOW (over-broad; the decision is made here)</text><rect x="36" y="202.89999999999998" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="202.89999999999998" width="4" height="36.225" rx="2" fill="#475569"/><text x="50.0" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start">Later rules</text><text x="195.5" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">…</text><text x="433.0" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Never consulted</text><rect x="36" y="255.12499999999997" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="255.12499999999997" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="275.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Firewalls evaluate rules top to bottom and stop at the first match.</text></g><text x="964" y="392" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>