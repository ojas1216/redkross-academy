<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 275" width="1000" height="275" role="img" aria-label="A contrast of signature-based detection (precise, misses novel) and anomaly-based detection (catches novel, more false positives), recommending both."><title>Signatures versus anomalies</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="274" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C07-M03-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Signatures versus anomalies</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="122" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="105.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">SIGNATURE</text><rect x="184" y="13.0625" width="251.70450000000002" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="309.9" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Match KNOWN bad pattern -&gt; precise</text><rect x="443.70450000000005" y="13.0625" width="69.765" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="478.6" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Low FP</text><rect x="521.4695" y="13.0625" width="102.0165" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="572.5" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Misses novel</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="122" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="105.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">ANOMALY</text><rect x="184" y="69.1875" width="274.9515" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="321.5" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Deviation from NORMAL -&gt; catches novel</text><rect x="466.9515" y="69.1875" width="75.759" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="504.8" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">More FP</text><rect x="550.7105" y="69.1875" width="117.042" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="609.2" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Needs baseline</text><rect x="36" y="126.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="126.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="146.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Use BOTH: signatures for known threats, anomalies for the unknown</text></g><text x="964" y="263" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>