<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" width="1000" height="305" role="img" aria-label="A comparison of personal pre-shared-key authentication and enterprise per-user 802.1X authentication."><title>Personal versus enterprise authentication</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="304" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C07-M06-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Personal versus enterprise authentication</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="178.9" rx="12" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7A3A06" text-anchor="middle">Personal (PSK)</text><circle cx="56" cy="70" r="3.5" fill="#EA6A0A"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">One shared passphrase</text><circle cx="56" cy="98.225" r="3.5" fill="#EA6A0A"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Hard to revoke</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#EA6A0A"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Offline-guessable (WPA2)</text><circle cx="56" cy="154.67499999999998" r="3.5" fill="#EA6A0A"/><text x="68.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Use for small / guest networks with a strong key</text><rect x="511" y="4" width="453" height="178.9" rx="12" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Enterprise (802.1X / EAP)</text><circle cx="531" cy="70" r="3.5" fill="#16A34A"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Per-user credentials or certificates via RADIUS</text><circle cx="531" cy="98.225" r="3.5" fill="#16A34A"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Revocable per user</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#16A34A"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Use for corporate wireless</text></g><text x="964" y="293" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>