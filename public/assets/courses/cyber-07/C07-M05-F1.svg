<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 263" width="1000" height="263" role="img" aria-label="A diagram of a remote device tunnelling to a corporate gateway with the note that post-connection access must still be least-privilege."><title>VPN extends a trusted boundary</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="262" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C07-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">VPN extends a trusted boundary</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.830)"><path d="M148.0,54.6 L520.2,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="204.0371" y="61.625" width="260.12" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="334.1" y="75.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">encrypted tunnel across the untrusted network</text><path d="M684.5,54.6 L895.9,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="740.4803" y="61.625" width="99.38" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="790.2" y="75.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">after connecting</text><rect x="12" y="31.25" width="136.0371" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="80.0" y="59.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Remote device</text><rect x="520.1571" y="31.25" width="164.3232" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="602.3" y="59.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Corporate gateway</text><rect x="895.8603" y="12" width="210" height="85.25" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="1000.9" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Least-privilege access</text><text x="1000.9" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">segmentation / ZTNA, not flat</text><text x="1000.9" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">access</text></g><rect x="36" y="114.69469592935718" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="114.69469592935718" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="135.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The tunnel provides confidentiality, integrity and endpoint authentication.</text></g><text x="964" y="251" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>