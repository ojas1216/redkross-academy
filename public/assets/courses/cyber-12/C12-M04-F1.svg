<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 299" width="1000" height="299" role="img" aria-label="A flow from a request parameter through a variable and a function to a database sink, with a sanitiser check determining whether a finding is raised."><title>Taint analysis</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="298" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M04-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Taint analysis</text><g transform="translate(0,68)"><rect x="36" y="8" width="206.5" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="139.3" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">SOURCE</text><text x="139.3" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">request parameter</text><line x1="245.5" y1="42.5" x2="273.5" y2="42.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="276.5" y="8" width="206.5" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="379.8" y="47.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Variable</text><line x1="486.0" y1="42.5" x2="514.0" y2="42.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="517" y="8" width="206.5" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="620.3" y="47.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Function call</text><line x1="726.5" y1="42.5" x2="754.5" y2="42.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="757.5" y="8" width="206.5" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="860.8" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">SINK</text><text x="860.8" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">db.execute</text><line x1="620.25" y1="79" x2="620.25" y2="89" stroke="#CBD5E1" stroke-width="1.5"/><text x="620.3" y="105.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">sanitiser here?</text><text x="620.3" y="121.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">validate / parameterise</text><rect x="36" y="150" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="150" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="170.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">No sanitiser on the path from source to sink = FINDING; a sanitiser present = no finding.</text></g><text x="964" y="287" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>