<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 623" width="1000" height="623" role="img" aria-label="A flow that rejects invalid IDs, returns the same not-found response for missing or other users&#39; records, and otherwise returns the record."><title>Object-level authorisation decision</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="622" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M03-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Object-level authorisation decision</text><g transform="translate(0,68)"><g transform="translate(248.4,4) scale(1.000)"><path d="M301.3,58.8 L301.3,68.8 L95.0,68.8 L95.0,190.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="61.700050000000005" y="114.75" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="75.4" y="128.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M351.7,58.8 L351.7,190.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="358.6805" y="114.75" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="375.0" y="128.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M305.1,237.5 L305.1,247.5 L190.4,247.5 L190.4,369.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="157.0271" y="293.5" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="170.7" y="307.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M398.2,237.5 L398.2,369.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="405.2113" y="293.5" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="421.5" y="307.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><rect x="250.9721" y="12" width="151.0626" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="326.5" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Valid tracking id?</text><rect x="12" y="190.75" width="166.0881" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="95.0" y="219.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">400 validation error</text><rect x="212.0881" y="190.75" width="279.1848" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="351.7" y="219.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Record exists AND owner == user?</text><rect x="93.38984999999998" y="369.5" width="193.9625" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="190.4" y="397.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">&quot;not found&quot;</text><text x="190.4" y="422.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">the same reply for both cases</text><rect x="321.35235" y="369.5" width="153.7179" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="398.2" y="397.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Return the record</text><text x="398.2" y="422.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">encoded on output</text></g><rect x="36" y="474.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="474.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="495.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Answering &quot;not found&quot; for both missing and not-yours records stops attackers from probing which ids exist.</text></g><text x="964" y="611" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>