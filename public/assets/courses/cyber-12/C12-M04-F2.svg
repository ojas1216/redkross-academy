<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 775" width="1000" height="775" role="img" aria-label="A flow from the IDE to a pull-request scan whose non-zero exit blocks the merge until fixed or justifiably suppressed, followed by nightly full scans and backlog triage."><title>SAST in the pipeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="774" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M04-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">SAST in the pipeline</text><g transform="translate(0,68)"><g transform="translate(277.9,4) scale(1.000)"><path d="M149.1,81.0 L149.1,137.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M149.1,206.0 L149.1,262.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M129.1,308.8 L129.1,440.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="90.39805000000001" y="364.75" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="106.7" y="378.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M169.1,308.8 L169.1,318.8 L340.1,318.8 L340.1,451.9" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="347.1401" y="364.75" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="360.8" y="378.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M340.1,498.6 L340.1,565.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="82.37915000000001" y="12" width="133.3818" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="149.1" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Developer IDE</text><text x="149.1" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">fast rules</text><rect x="40.97630000000001" y="137" width="216.1875" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="149.1" y="165.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Pull request</text><text x="149.1" y="190.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">semgrep --error on changed code</text><rect x="89.07005000000001" y="262" width="120" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="149.1" y="290.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Exit code 1?</text><rect x="12" y="440.75" width="234.14010000000002" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="129.1" y="469.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Block; show the finding inline</text><text x="129.1" y="493.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">fix, or a justified suppression</text><rect x="280.14