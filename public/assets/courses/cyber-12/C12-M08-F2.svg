<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 231" width="1000" height="231" role="img" aria-label="Two lines comparing an SBOM of 42 components when tools were installed in the release environment with 7 components when they were kept outside."><title>Tooling contaminating the SBOM</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M08-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Tooling contaminating the SBOM</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="238.72080000000003" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="163.4" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Release env + tools installed</text><line x1="290.7" y1="28.1" x2="320.7" y2="28.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="328.72080000000005" y="13.0625" width="213.06750000000002" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="435.3" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">SBOM: 42 components (wrong)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="238.72080000000003" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="163.4" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Release env only, tools outside</text><line x1="290.7" y1="84.2" x2="320.7" y2="84.2" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="328.72080000000005" y="69.1875" width="232.575" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="445.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">SBOM: 7 components (what ships)</text></g><text x="964" y="219" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>