<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Two boxes compare three manifest pins with six resolved packages, including three transitive ones, showing a manifest-only SBOM misses half of them."><title>Direct versus transitive coverage</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="349" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Direct versus transitive coverage</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="178.9" rx="12" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7A3A06" text-anchor="middle">requirements.txt (manifest)</text><circle cx="56" cy="70" r="3.5" fill="#EA6A0A"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">requests 2.25.0</text><circle cx="56" cy="98.225" r="3.5" fill="#EA6A0A"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">urllib3 1.26.4</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#EA6A0A"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">PyYAML 6.0.1</text><circle cx="56" cy="154.67499999999998" r="3.5" fill="#EA6A0A"/><text x="68.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SBOM from the manifest: 3 components</text><rect x="511" y="4" width="453" height="178.9" rx="12" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle">Resolved environment</text><circle cx="531" cy="70" r="3.5" fill="#2563EB"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">requests, urllib3, PyYAML</text><circle cx="531" cy="98.225" r="3.5" fill="#2563EB"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">+ idna, chardet, certifi (transitive)</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#2563EB"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">SBOM / SCA from the environment: 6 components</text><rect x="36" y="200.9" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="200.9" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="221.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Scan the resolved environment, not just the manifest, or transitive dependencies are missed.</text></g><text x="964" y="338" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>