<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 302" width="1000" height="302" role="img" aria-label="Gates run in three container images and on the host, each writing a result file; a report script reads them and decides whether the release is approved or blocked."><title>The lab release pipeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="301" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M08-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The lab release pipeline</text><g transform="translate(0,68)"><rect x="36" y="6" width="220" height="82.7" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="146.0" y="33.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">python:3.12-slim</text><text x="146.0" y="56.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">tests → semgrep --error → pip-audit →</text><text x="146.0" y="72.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">SBOM + licences</text><rect x="272" y="6" width="220" height="82.7" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="382.0" y="41.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">gitleaks</text><text x="382.0" y="64.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">secret scan (app/)</text><rect x="508" y="6" width="220" height="82.7" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="618.0" y="41.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Host</text><text x="618.0" y="64.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">tar artefact</text><rect x="744" y="6" width="220" height="82.7" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="854.0" y="41.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">cosign</text><text x="854.0" y="64.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">sign → verify</text><line x1="146" y1="88.7" x2="146" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="382" y1="88.7" x2="382" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="618" y1="88.7" x2="618" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="854" y1="88.7" x2="854" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="146" y1="111.7" x2="854" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="500.0" y1="111.7" x2="500.0" y2="131.7" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="508" y="113.7" width="225.76" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="620.9" y="127.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">every step writes out/&lt;gate&gt;.rc + JSON</text><rect x="240" y="134.7" width="520" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="162.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">release_report.py → DECISION: APPROVED / BLOCKED</text></g><text x="964" y="290" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>