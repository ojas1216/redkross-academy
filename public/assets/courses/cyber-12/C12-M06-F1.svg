<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 282" width="1000" height="282" role="img" aria-label="Configuration in git contains only a secret reference; the service uses its workload identity to fetch the value from a secrets manager that logs access and supports rotation."><title>Secret delivery without secrets in code</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="281" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M06-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Secret delivery without secrets in code</text><g transform="translate(0,68)"><g transform="translate(89.2,4) scale(1.000)"><path d="M222.0,54.6 L278.0,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M404.3,46.8 L619.7,46.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="460.3063" y="19.833333333333332" width="103.364" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="512.0" y="33.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">workload identity</text><path d="M619.7,69.8 L573.7,69.8 L573.7,62.4 L404.3,62.4" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="465.31030000000004" y="69.41666666666666" width="93.35600000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="512.0" y="83.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">current version</text><rect x="12" y="12" width="210" height="85.25" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="117.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Config in git</text><text x="117.0" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">DB_PASSWORD=secretref:prod/</text><text x="117.0" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">shipments/db</text><rect x="278" y="31.25" width="126.30630000000001" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="341.2" y="59.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Service starts</text><rect x="619.6703" y="23.833333333333332" width="189.90630000000002" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="714.6" y="52.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">SECRETS MANAGER</text><text x="714.6" y="76.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">audit log</text></g><rect x="36" y="133.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="133.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="153.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rotation: the manager issues a new version and the service re-reads it on an authentication failure. No secret ever lives in the code.</text></g><text x="964" y="270" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>