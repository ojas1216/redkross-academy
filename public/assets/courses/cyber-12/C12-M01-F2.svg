<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" width="1000" height="355" role="img" aria-label="Four boxes in a grid naming the SSDF groups PO, PS, PW and RV."><title>NIST SSDF practice groups</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="354" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M01-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">NIST SSDF practice groups</text><g transform="translate(0,68)"><rect x="36" y="6" width="36.3804" height="20" rx="6" fill="#2563EB"/><text x="45.0" y="20.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">PO</text><rect x="36" y="32" width="456" height="56" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="264.0" y="65.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle">Prepare the Organization</text><rect x="508" y="6" width="34.96848" height="20" rx="6" fill="#7C3AED"/><text x="517.0" y="20.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">PS</text><rect x="508" y="32" width="456" height="56" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="736.0" y="65.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#3B2A7A" text-anchor="middle">Protect the Software</text><rect x="36" y="104" width="38.49192" height="20" rx="6" fill="#EA6A0A"/><text x="45.0" y="118.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">PW</text><rect x="36" y="130" width="456" height="56" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="264.0" y="163.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7A3A06" text-anchor="middle">Produce Well-Secured Software</text><rect x="508" y="104" width="35.66808" height="20" rx="6" fill="#16A34A"/><text x="517.0" y="118.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">RV</text><rect x="508" y="130" width="456" height="56" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="736.0" y="163.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">Respond to Vulnerabilities</text><rect x="36" y="206" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="206" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="226.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The four practice groups of the NIST Secure Software Development Framework (SSDF).</text></g><text x="964" y="343" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>