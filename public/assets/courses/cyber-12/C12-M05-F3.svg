<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 682" width="1000" height="682" role="img" aria-label="A decision tree prioritising exploited vulnerabilities first, then reachable and exposed ones, and otherwise routine upgrades or time-limited waivers."><title>Prioritising an advisory</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="681" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C12-M05-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Prioritising an advisory</text><g transform="translate(0,68)"><g transform="translate(230.8,4) scale(1.000)"><path d="M355.3,58.8 L355.3,114.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M327.8,161.5 L327.8,171.5 L132.2,171.5 L132.2,293.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="93.48265" y="217.5" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="109.8" y="231.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M382.8,161.5 L382.8,293.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="389.84450000000004" y="217.5" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="403.5" y="231.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M350.7,340.3 L350.7,350.3 L161.5,350.3 L161.5,472.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="122.80700000000002" y="396.25" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="139.1" y="410.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M415.0,340.3 L415.0,472.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="422.02290000000005" y="396.25" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="435.7" y="410.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><rect x="295.30625000000003" y="12" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="355.3" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Advisory</text><rect x="272.6915" y="114.75" width="165.22950000000003" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="355.3" y="143.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">In KEV / exploited?</text><rect x="12" y="293.5" width="240.3093" height="46.75" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="132.2" y="321.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Fix within the emergency SLA</text><rect x="286.3093" y="293.5" width="193.0704" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="382.8" y="321.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Reachable + exposed?</text