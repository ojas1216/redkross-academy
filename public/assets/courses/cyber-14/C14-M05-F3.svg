<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 367" width="1000" height="367" role="img" aria-label="Two bars; the naive bar is split into 43, 30 and 8 events, the managed bar contains only the 8 campaign events."><title>81 alerts versus 8</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="366" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C14-M05-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">81 alerts versus 8</text><g transform="translate(0,68)"><text x="36.0" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Alerts produced by the same feed, with and without IOC management</text><text x="189.5" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Naive: update service</text><rect x="203.51764" y="44" width="650.48236" height="26" rx="6" fill="#F1F5F9"/><rect x="203.51764" y="44" width="650.48236" height="26" rx="6" fill="#94A3B8"/><text x="864.0" y="62.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start">43</text><text x="189.5" y="103.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Naive: shared hosting</text><rect x="203.51764" y="86" width="650.48236" height="26" rx="6" fill="#F1F5F9"/><rect x="203.51764" y="86" width="453.8249023255814" height="26" rx="6" fill="#94A3B8"/><text x="667.3" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start">30</text><text x="189.5" y="145.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Naive: campaign</text><rect x="203.51764" y="128" width="650.48236" height="26" rx="6" fill="#F1F5F9"/><rect x="203.51764" y="128" width="121.01997395348836" height="26" rx="6" fill="#F59E4B"/><text x="334.5" y="146.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="start">8</text><text x="189.5" y="187.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Managed: campaign</text><rect x="203.51764" y="170" width="650.48236" height="26" rx="6" fill="#F1F5F9"/><rect x="203.51764" y="170" width="121.01997395348836" height="26" rx="6" fill="#6CCB95"/><text x="334.5" y="188.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="start">8 (u017 only)</text><rect x="36" y="218" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="218" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="238.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Naively loading every indicator produced 81 alerts; managing them (allowlists, ageing, context) left the 8 that matter.</text></g><text x="964" y="355" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>