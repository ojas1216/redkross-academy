<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 628" width="1000" height="628" role="img" aria-label="A vertical flow from a requirement through planning, inquiry, collection, preservation, verification, minimisation and analysis to judgments."><title>A disciplined open-source inquiry</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="627" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C14-M02-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">A disciplined open-source inquiry</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Requirement</text><text x="500.0" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">SIR-1.1</text><line x1="500.0" y1="80.0" x2="500.0" y2="104.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="107" width="560" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="135.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Plan</text><text x="500.0" y="160.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">sources, tools, personal data, legal check, stop criteria</text><line x1="500.0" y1="179.0" x2="500.0" y2="203.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="206" width="560" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="234.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Online inquiry → preliminary assessment → passive collection</text><line x1="784.0" y1="229.4" x2="800.0" y2="229.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="225.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">preserve: file + SHA-256 +</text><text x="806.0" y="241.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">log entry</text><line x1="500.0" y1="255.8" x2="500.0" y2="279.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="282.75" width="560" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="311.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Verification</text><text x="500.0" y="335.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">dates, provenance, consistency</text><line x1="500.0" y1="354.8" x2="500.0" y2="378.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="381.75" width="560" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="410.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Minimisation → analysis</text><line x1="500.0" y1="431.5" x2="500.0" y2="455.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="458.5" width="560" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="486.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Graded, cited judgments</text></g><text x="964" y="616" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>