<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-label="A horizontal scale from 0 to 99 percent divided into seven labelled bands, and an example judgment showing the likelihood term and the separate confidence sentence."><title>Likelihood scale and separate confidence</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="306" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C14-M01-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Likelihood scale and separate confidence</text><g transform="translate(0,68)"><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#86EFAC"/><stop offset="0.5" stop-color="#FCD34D"/><stop offset="1" stop-color="#FCA5A5"/></linearGradient></defs><rect x="76" y="66" width="848" height="8" rx="4" fill="url(#sg)"/><circle cx="76" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="76.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Almost no chance</text><text x="76.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">0–5%</text><circle cx="217.33333333333334" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="217.3" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Very unlikely</text><text x="217.3" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">5–20%</text><circle cx="358.6666666666667" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="358.7" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Unlikely</text><text x="358.7" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">20–45%</text><circle cx="500" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="500.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Even chance</text><text x="500.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">45–55%</text><circle cx="641.3333333333334" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="641.3" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Likely</text><text x="641.3" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">55–80%</text><circle cx="782.6666666666666" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="782.7" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Very likely</text><text x="782.7" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">80–95%</text><circle cx="924" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="924.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Almost certain</text><text x="924.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">95–99%</text><rect x="36" y="140" width="928" height="54.45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="140" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="56.0" y="160.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Example: &quot;X is very likely active now. Confidence: moderate. [RPT-004]&quot;. Likelihood describes the event; confidence describes the basis for the</text><text x="56.0" y="178.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">judgment, stated separately.</text></g><text x="964" y="295" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>