<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 256" width="1000" height="256" role="img" aria-label="Two log entries, the second containing the hash of the first, and a note showing that editing the first breaks verification."><title>The hash-chained collection log</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="255" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C14-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The hash-chained collection log</text><g transform="translate(0,68)"><rect x="36" y="8" width="286.6666666666667" height="85.25" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="179.3" y="44.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Entry 1</text><text x="179.3" y="69.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">{file, url, SIR-1.1, sha256, prev = 000…0} → H1</text><line x1="325.7" y1="50.6" x2="353.7" y2="50.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="356.6666666666667" y="8" width="286.6666666666667" height="85.25" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="44.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Entry 2</text><text x="500.0" y="69.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">{file, url, PIR-1, sha256, prev = H1} → H2</text><line x1="646.3" y1="50.6" x2="674.3" y2="50.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="677.3333333333334" y="8" width="286.6666666666667" height="85.25" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="820.7" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Tamper check</text><text x="820.7" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">edit entry 1 → recomputed hash ≠ H1 →</text><text x="820.7" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">&quot;TAMPERED OR OUT OF ORDER&quot;</text><rect x="36" y="107.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="107.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="127.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Each entry stores the previous entry’s hash, so editing or reordering any entry breaks the chain.</text></g><text x="964" y="244" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>