<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" width="1000" height="458" role="img" aria-label="A tree with PIR-2 at the top, one SIR below and two EEIs, each annotated with the report that addresses it."><title>Requirement hierarchy for Nilgiri PIR-2</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="457" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C14-M01-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Requirement hierarchy for Nilgiri PIR-2</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="85.25" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">PIR-2</text><text x="500.0" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Is MONSOON LANTERN infrastructure active against us now? · consumer: SOC lead · priority</text><text x="500.0" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">1</text><line x1="500.0" y1="96.3" x2="500.0" y2="120.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="123.25" width="560" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="151.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">SIR-2.1</text><text x="500.0" y="176.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">Do proxy or DNS logs show contact with campaign infrastructure?</text><line x1="500.0" y1="195.3" x2="500.0" y2="219.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="222.25" width="560" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="250.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">EEIs</text><text x="500.0" y="275.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">matches of current IOCs in proxy_log · first and last contact times</text><line x1="784.0" y1="256.8" x2="800.0" y2="256.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="260.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">answered by RPT-006 (A1)</text><rect x="36" y="309.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="309.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="329.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Priority intelligence requirement → specific requirement → essential elements of information.</text></g><text x="964" y="446" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>