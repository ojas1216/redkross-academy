<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 699" width="1000" height="699" role="img" aria-label="Internet traffic enters a WAF and load balancer in public subnets, reaches app instances in private subnets and a database in data subnets; services are reached via private endpoints; outbound traffic passes a NAT and firewall."><title>Workload VPC</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="698" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C11-M03-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Workload VPC</text><g transform="translate(0,68)"><g transform="translate(111.2,4) scale(1.000)"><path d="M197.9,58.8 L197.9,114.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M197.9,183.8 L197.9,239.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.7,308.8 L136.7,489.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="389.25" width="118.724" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="71.4" y="403.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">SG reference :5432</text><path d="M197.9,308.8 L197.9,328.8 L321.5,328.8 L321.5,364.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M259.1,308.8 L259.1,318.8 L635.5,318.8 L635.5,364.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="137.89275" y="12" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="197.9" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Internet</text><rect x="79.4365" y="114.75" width="236.91250000000002" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="197.9" y="143.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">WAF + ALB</text><text x="197.9" y="167.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">public subnets; route 0.0.0.0/0 → IGW</text><rect x="75.55525000000002" y="239.75" width="244.67499999999998" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="197.9" y="268.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">App instances</text><text x="197.9" y="292.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">private subnets, IMDSv2, no public IPs</text><rect x="34.51775000000001" y="489.75" width="204.4125" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="136.7" y="518.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Database</text><text x="136.7" y="542.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">data subnets, no gateway route</text><rect x="171.724" y="364.75" width="299.5527" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="321.5" y="393.0" font-family="Helvetica, Arial, 