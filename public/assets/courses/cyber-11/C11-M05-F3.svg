<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 367" width="1000" height="367" role="img" aria-label="Four investigative questions mapped to log families."><title>Which log answers which question</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="366" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C11-M05-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Which log answers which question</text><g transform="translate(0,68)"><text x="139.3" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">QUESTION</text><text x="292.6" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="start">LOG SOURCE THAT ANSWERS IT</text><rect x="36" y="28" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="36" width="198.57435999999998" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="143.3" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Who changed what?</text><line x1="250.6" y1="52.1" x2="280.6" y2="52.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="288.57435999999996" y="37.0625" width="245.319" height="30" rx="15" fill="#FFFFFF" stroke="#F59E