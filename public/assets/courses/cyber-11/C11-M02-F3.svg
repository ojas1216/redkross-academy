<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-label="Nested layers from organisation guardrails down to resource policies, with effective permissions as their intersection."><title>Layers that bound privilege</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="403" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C11-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Layers that bound privilege</text><g transform="translate(0,68)"><rect x="244.79999999999998" y="4" width="510.40000000000003" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="32.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Resource policy / session policy</text><rect x="175.20000000000002" y="58.75" width="649.5999999999999" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="87.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Identity policy or role assignment</text><rect x="105.60000000000001" y="113.5" width="788.8" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="141.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Permission boundary / PIM eligibility</text><rect x="36" y="168.25" width="928" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="196.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Organisation guardrails</text><text x="500.0" y="221.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">SCP / Azure Policy</text><rect x="36" y="255.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="255.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="275.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Effective permission = the intersection of all the allows, minus any deny.</text></g><text x="964" y="392" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>