<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 315" width="1000" height="315" role="img" aria-label="The PE layout from the MZ header through the PE headers, section table and import directory."><title>The PE format at a glance</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="314" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C10-M03-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The PE format at a glance</text><g transform="translate(0,68)"><rect x="37" y="30" width="109.80722891566263" height="96" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="91.9" y="64.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">MZ DOS</text><text x="91.9" y="80.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">header</text><text x="91.9" y="102.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">e_lfanew → PE</text><rect x="148.80722891566262" y="30" width="109.80722891566263" height="96" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="203.7" y="73.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">PE\0\0</text><text x="203.7" y="89.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">signature</text><rect x="260.61445783132524" y="30" width="109.80722891566263" height="96" rx="6" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="315.5" y="81.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="middle">COFF header</text><rect x="372.42168674698786" y="30" width="143.34939759036143" height="96" rx="6" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="444.1" y="65.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="middle">Optional header</text><text x="444.1" y="86.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">+ data directories →</text><text x="444.1" y="100.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">import table</text><rect x="517.7710843373493" y="30" width="109.80722891566263" height="96" rx="6" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="572.7" y="72.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#7A3A06" text-anchor="middle">.text</text><text x="572.7" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">code, X+R</text><rect x="629.578313253012" y="30" width="109.80722891566263" height="96" rx="6" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="684.5" y="72.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">.rdata</text><text x="684.5" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">read-only</text><rect x="741.3855421686746" y="30" width="109.80722891566263" height="96" rx="6" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="796.3" y="72.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#14532D" text-anchor="middle">.data</text><text x="796.3" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">read-write</text><rect x="853.1927710843373" y="30" width="109.80722891566263" height="96" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="908.1" y="72.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">.rsrc</text><text x="908.1" y="93.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">resources</text><rect x="36" y="148" width="928" height="54.45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="148" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="56.0" y="168.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The import table lists DLLs and function names (capabilities). Addresses are RVAs from the image base; convert an RVA to a file offset with the</text><text x="56.0" y="186.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">section table.</text></g><text x="964" y="303" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>