<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 443" width="1000" height="443" role="img" aria-label="Malware categories grouped by behaviour - replication, disguise, access, payload and delivery - with the note that real samples combine several."><title>Malware categories by behaviour</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="442" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C10-M01-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Malware categories by behaviour</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="122" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="105.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Replication</text><rect x="184" y="13.0625" width="134.26799999999997" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="251.1" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Virus (infects files)</text><rect x="326.268" y="13.0625" width="222.7875" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="437.7" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Worm (self-spreads on networks)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="122" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="105.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Disguise</text><rect x="184" y="69.1875" width="174.066" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="271.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Trojan (hidden in benign)</text><rect x="366.06600000000003" y="69.1875" width="142.52999999999997" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="437.3" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Rootkit (hides itself)</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="122" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="105.0" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Access</text><rect x="184" y="125.3125" width="81.024" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="224.5" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Backdoor</text><rect x="273.024" y="125.3125" width="174.03900000000002" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="360.0" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Bot/RAT (remote control)</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="122" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="105.0" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Payload</text><rect x="184" y="181.4375" width="167.2755" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="267.6" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Ransomware (encrypts)</text><rect x="359.27549999999997" y="181.4375" width="200.29649999999998" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="459.4" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Spyware/infostealer (collects)</text><rect x="36" y="228.5" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="236.5" width="122" height="32.125" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="105.0" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1E293B" text-anchor="middle">Delivery</text><rect x="184" y="237.5625" width="187.5525" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/><text x="277.8" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Downloader (pulls payload)</text><rect x="379.5525" y="237.5625" width="177.036" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/><text x="468.1" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Dropper (carries payload)</text><rect x="36" y="294.625" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="294.625" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="315.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Real malware usually combines several of these</text></g><text x="964" y="431" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>