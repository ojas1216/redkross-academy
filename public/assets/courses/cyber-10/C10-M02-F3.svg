<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" role="img" aria-label="The behaviour harness creating a sandbox and loopback sink, running the simulator, capturing events and discarding the sandbox."><title>Containment in the lab harness</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="451" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C10-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Containment in the lab harness</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Create a throwaway sandbox directory</text><line x1="784.0" y1="31.4" x2="800.0" y2="31.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="27.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">the only place the simulator</text><text x="806.0" y="43.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">may write</text><line x1="500.0" y1="57.8" x2="500.0" y2="81.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="84.75" width="560" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Bind a loopback sink on 127.0.0.1</text><line x1="784.0" y1="108.1" x2="800.0" y2="108.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">the only place it may</text><text x="806.0" y="120.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">connect</text><line x1="500.0" y1="134.5" x2="500.0" y2="158.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="161.5" width="560" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="189.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Run rksim.py in the sandbox</text><line x1="500.0" y1="211.3" x2="500.0" y2="235.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="238.25" width="560" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="266.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Capture events, then DISCARD the sandbox</text><line x1="784.0" y1="261.6" x2="800.0" y2="261.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="265.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">detonate and revert</text><rect x="36" y="303" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="303" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="323.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The steps behaviour.py follows to keep the simulator contained.</text></g><text x="964" y="440" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>