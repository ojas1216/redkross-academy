beration Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Dynamic APIs</text><rect x="188.78109" y="69.1875" width="284.334" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="330.9" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">LoadLibrary/GetProcAddress (hide imports)</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="126.78109" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="107.4" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Trigger checks</text><rect x="188.78109" y="125.3125" width="256.605" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="317.1" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Date/locale/domain/VM gate behaviour</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="126.78109" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="107.4" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Persistence</text><rect x="188.78109" y="181.4375" width="267.09450000000004" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="322.3" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Write Run key / service / task T1547.001</text><rect x="36" y="228.5" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="236.5" width="126.78109" height="32.125" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="107.4" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', 