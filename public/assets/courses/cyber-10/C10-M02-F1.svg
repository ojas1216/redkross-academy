font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">folders or clipboard</text><rect x="477.372" y="12" width="210" height="104" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="582.4" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Analysis / &quot;fake internet&quot;</text><text x="582.4" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">VM</text><text x="582.4" y="83.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">DNS + canned responses, no</text><text x="582.4" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">egress; monitoring and capture</text></g><rect x="36" y="152" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="152" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="172.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Both run on a host with no production access. Detonate in the victim, observe, then REVERT the snapshot.</text></g><text x="964" y="289" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>