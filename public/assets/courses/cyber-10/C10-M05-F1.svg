<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="The three parts of a YARA rule - meta, strings with identifiers, and a boolean condition."><title>Anatomy of a YARA rule</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="359" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C10-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Anatomy of a YARA rule</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="189.25" rx="10" fill="#0F172A" stroke="#F59E4B" stroke-width="1.5"/><rect x="36" y="4" width="928" height="32" rx="10" fill="#FFF4E8"/><rect x="36" y="26" width="928" height="10" fill="#FFF4E8"/><text x="50.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#7A3A06" text-anchor="start">Anatomy of a YARA rule</text><text x="50" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">rule NAME {</text><text x="50" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  meta:       author / description / reference</text><text x="50" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  strings:    $a = &quot;text&quot;</text><text x="50" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">              $b = { DE AD BE EF }</text><text x="50" y="131.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">              $c = &quot;wide&quot; wide</text><text x="50" y="149.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  condition:  all of them | any of them | N of them</text><text x="50" y="168.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">}</text><rect x="36" y="211.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="211.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="231.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A rule matches a file when the condition is true over the strings found. meta is documentation only.</text></g><text x="964" y="348" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>