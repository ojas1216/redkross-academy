<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 258" width="1000" height="258" role="img" aria-label="Bytes hashed to a fingerprint recorded with source and authorisation, the avalanche effect, and the exact-copy limitation."><title>Provenance and hashing</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="257" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C10-M02-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Provenance and hashing</text><g transform="translate(0,68)"><rect x="36" y="8" width="286.6666666666667" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="179.3" y="47.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Sample bytes</text><line x1="325.7" y1="42.5" x2="353.7" y2="42.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="356.6666666666667" y="8" width="286.6666666666667" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="47.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">SHA-256</text><line x1="646.3" y1="42.5" x2="674.3" y2="42.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="677.3333333333334" y="8" width="286.6666666666667" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="820.7" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Fixed fingerprint</text><text x="820.7" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">e.g. 5f51d1…af51</text><rect x="36" y="91" width="928" height="54.45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="91" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="56.0" y="111.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Record sha256 + md5 + sha1 + source + time + authorisation. Change one byte and every hash changes (avalanche). A hash gives identity, an IOC</text><text x="56.0" y="129.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">and integrity proof, but only catches EXACT copies.</text></g><text x="964" y="246" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>