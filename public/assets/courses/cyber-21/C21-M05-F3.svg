<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 302" width="1000" height="302" role="img" aria-label="Two columns of example signals, one for the API audit log and one for node sensors, both feeding a SIEM."><title>Two detection layers</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="301" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C21-M05-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Two detection layers</text><g transform="translate(0,68)"><rect x="36" y="6" width="456" height="82.7" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="264.0" y="33.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">API audit log (control plane)</text><text x="264.0" y="56.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">exec / attach / port-forward · secret reads by service accounts · powerful</text><text x="264.0" y="72.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">bindings · admission denials · token requests</text><rect x="508" y="6" width="456" height="82.7" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="736.0" y="33.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">Node sensor (data plane)</text><text x="736.0" y="56.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">shell in a distroless container · writes to /usr/bin, ld.so.preload · outbound to</text><text x="736.0" y="72.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">unknown hosts · scans of 10250 / 2379 · token or metadata reads</text><line x1="264" y1="88.7" x2="264" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="736" y1="88.7" x2="736" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="264" y1="111.7" x2="736" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="500.0" y1="111.7" x2="500.0" y2="131.7" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240" y="134.7" width="520" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="162.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">SIEM / SOC triage</text></g><text x="964" y="290" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>