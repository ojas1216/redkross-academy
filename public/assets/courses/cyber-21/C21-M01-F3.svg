<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" role="img" aria-label="A vertical chain from code execution in a container to control of the node, with five branches naming privileged mode, host namespaces, the Docker socket, writable host paths and added capabilities or disabled seccomp."><title>Isolation-breaking options</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="443" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C21-M01-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Isolation-breaking options</text><g transform="translate(0,68)"><rect x="240" y="6" width="520" height="46.75" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="500.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Code execution in a container</text><rect x="36" y="98.75" width="298.6666666666667" height="67.1" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="185.3" y="126.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">privileged: true</text><text x="185.3" y="149.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">all capabilities + all devices</text><rect x="350.6666666666667" y="98.75" width="298.6666666666667" height="67.1" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="126.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">hostPID / hostNetwork</text><text x="500.0" y="149.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">host processes / host network</text><rect x="665.3333333333334" y="98.75" width="298.6666666666667" height="67.1" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="814.7" y="126.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">docker.sock mounted</text><text x="814.7" y="149.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">start any container = root</text><line x1="500" y1="52.75" x2="500" y2="75.75" stroke="#64748B" stroke-width="1.8"/><line x1="185.33333333333334" y1="75.75" x2="814.6666666666667" y2="75.75" stroke="#64748B" stroke-width="1.8"/><line x1="185.3" y1="75.8" x2="185.3" y2="95.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="500.0" y1="75.8" x2="500.0" y2="95.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="814.7" y1="75.8" x2="814.7" y2="95.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="36" y="211.85" width="298.6666666666667" height="67.1" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="185.3" y="239.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">hostPath &quot;/&quot; writable</text><text x="185.3" y="262.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">edit host files</text><rect x="350.6666666666667" y="211.85" width="298.6666666666667" height="67.1" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="239.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#3B2A7A" text-anchor="middle">SYS_ADMIN cap, seccomp off</text><text x="500.0" y="262.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">kernel attack surface</text><rect x="665.3333333333334" y="211.85" width="298.6666666666667" height="67.1" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="814.7" y="239.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">→ Control of the node</text><text x="814.7" y="262.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">other workloads, secrets, credentials</text><line x1="500" y1="165.85" x2="500" y2="188.85" stroke="#64748B" stroke-width="1.8"/><line x1="185.33333333333334" y1="188.85" x2="814.6666666666667" y2="188.85" stroke="#64748B" stroke-width="1.8"/><line x1="185.3" y1="188.8" x2="185.3" y2="208.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="500.0" y1="188.8" x2="500.0" y2="208.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="814.7" y1="188.8" x2="814.7" y2="208.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="36" y="294.95" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="294.95" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="315.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Each of these options breaks the isolation that makes a container safe.</text></g><text x="964" y="432" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>