<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 511" width="1000" height="511" role="img" aria-label="Seven rows, each pairing a permission with the access it effectively provides."><title>Escalation routes to watch</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="510" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C21-M04-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Escalation routes to watch</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="180.62220000000002" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="134.3" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Create pods</text><line x1="232.6" y1="28.1" x2="262.6" y2="28.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="270.6222" y="13.0625" width="255.8625" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="398.6" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Mount any secret / run as any SA in ns</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="180.62220000000002" height="32.125" rx="8" fill="#E