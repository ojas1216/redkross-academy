 Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Nodes watch the API and report back; the API server reaches kubelets on port 10250 for logs, exec and port-forward.</text></g><text x="964" y="678" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>