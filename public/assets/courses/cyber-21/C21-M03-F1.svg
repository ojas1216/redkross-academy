TLS</text><path d="M341.0,457.0 L341.0,289.8 L134.0,289.8 L134.0,259.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="289.68805" y="348.375" width="45.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="312.4" y="362.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">watch</text><path d="M169.4,259.8 L169.4,279.8 L647.0,279.8 L647.0,457.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="482.8796" y="348.375" width="158.072" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="561.9" y="362.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">kubelet :10250 (logs, exec)</text><path d="M204.8,259.8 L204.8,269.8 L832.0,269.8 L832.0,315.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="58.02654999999999" y="12" width="187.26690000000002" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="151.7" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Users / CI / controllers</text><rect x="63.15375000000001" y="190.75" width="177.0125" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="151.7" y="219.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">kube-apiserver</text><text x="151.7" y="243.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">authn → authz → admission</text><rect x="12" y="457" width="173.1125" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="98.6" y="485.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle