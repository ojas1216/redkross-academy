<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 614" width="1000" height="614" role="img" aria-label="A loop from scope through baseline evidence, prioritisation, change, verification, re-run, report and scheduling back to scope, annotated with the lab scores."><title>The hardening loop</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="613" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C21-M08-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The hardening loop</text><g transform="translate(0,68)"><circle cx="500" cy="240" r="200" fill="none" stroke="#E2E8F0" stroke-width="10"/><path d="M525.6886269004333,41.65662489518252 A200,200 0 0 1 564.5813102554561,50.7138294388929" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M671.087691892086,136.41910560803876 A200,200 0 0 1 688.2556756754384,172.47370455900787" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M687.6542353360962,309.18011246322885 A200,200 0 0 1 670.1696775958661,345.08225743159016" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M562.9133121232236,429.84708361648813 A200,200 0 0 1 523.942441457784,438.5617271707732" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M390.79738168387433,407.5553286317763 A200,200 0 0 1 359.6860585651899,382.5201664292765" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M300.91325016402425,259.0909936815143 A200,200 0 0 1 301.0889354558007,219.15801348495347" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M360.9455019002621,96.25075110377097 A200,200 0 0 1 392.27590099446496,71.49030148550594" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><rect x="417.5" y="17.25" width="165" height="45.5" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="44.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">Scope</text><rect x="573.866296493606" y="81.7520396282533" width="165" height="67.1" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="656.4" y="109.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">Baseline evidence</text><text x="656.4" y="132.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">2 / 10</text><rect x="612.4855824363647" y="261.7541867912629" width="165" height="45.5" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="695.0" y="289.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Prioritise</text><rect x="504.27674782351164" y="397.4437735804838" width="165" height="45.5" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="586.8" y="424.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#3B2A7A" text-anchor="middle">Change via Git</text><rect x="330.72325217648836" y="386.6437735804838" width="165" height="67.1" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="413.2" y="413.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Verify each control</text><text x="413.2" y="437.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">7 / 10 → fix → 10 / 10</text><rect x="222.51441756363528" y="253.0041867912629" width="165" height="63" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="305.0" y="280.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">Re-run evidence →</text><text x="305.0" y="297.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">report</text><rect x="261.133703506394" y="92.55203962825333" width="165" height="45.5" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="343.6" y="119.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">Schedule &amp; alert</text><text x="500.0" y="245.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Hardening loop</text></g><text x="964" y="602" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>