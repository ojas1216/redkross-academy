<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 304" width="1000" height="304" role="img" aria-label="Nested boxes show a signed envelope containing a statement with subject, predicate type and predicate."><title>Anatomy of an attestation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="303" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C21-M07-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Anatomy of an attestation</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="133" rx="10" fill="#0F172A" stroke="#6CCB95" stroke-width="1.5"/><rect x="36" y="4" width="928" height="32" rx="10" fill="#ECFDF3"/><rect x="36" y="26" width="928" height="10" fill="#ECFDF3"/><text x="50.0" y="25.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#14532D" text-anchor="start">Signed envelope (key or keyless identity)</text><text x="50" y="56.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">statement:</text><text x="50" y="74.8" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  subject:       kestrel-api @ sha256:07dc...</text><text x="50" y="93.5" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#FDBA74" xml:space="preserve">  predicateType: https://cyclonedx.org/bom</text><text x="50" y="112.3" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E2E8F0" xml:space="preserve">  predicate:     { 39 components ... }</text><rect x="36" y="155" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="155" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="175.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">An attestation binds a claim (here an SBOM) to an exact image digest, signed by whoever vouches for it.</text></g><text x="964" y="292" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>