<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 399" width="1000" height="399" role="img" aria-label="Two horizontal chains show the Docker and Kubernetes paths from client to kernel through containerd and runc, with notes on each layer&#39;s job; below, an image is shown as index, manifest, config and layers, with a tag pointing to a digest."><title>From command to kernel</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="398" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C21-M01-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">From command to kernel</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="143.05792" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="115.5" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Docker host</text><line x1="195.1" y1="28.1" x2="225.1" y2="28.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="233.05792" y="13.0625" width="325.76550000000003" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="395.9" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">docker CLI → dockerd → containerd → runc → kernel</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="143.05792" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="115.5" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Kubernetes node</text><line x1="195.1" y1="84.2" x2="225.1" y2="84.2" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="233.05792" y="69.1875" width="325.887" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="396.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">kubelet → (CRI) containerd / CRI-O → runc → kernel</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="143.05792" height="32.125" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="115.5" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1E293B" text-anchor="middle">containerd</text><line x1="195.1" y1="140.3" x2="225.1" y2="140.3" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="233.05792" y="125.3125" width="307.608" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/><text x="386.9" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Pulls images, snapshots, supervises containers</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="143.05792" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="115.5" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">runc</text><line x1="195.1" y1="196.4" x2="225.1" y2="196.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="233.05792" y="181.4375" width="420.171" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="443.1" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Reads config.json: namespaces, cgroups, caps, seccomp, mounts</text><rect x="36" y="228.5" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="236.5" width="143.05792" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="115.5" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Image</text><line x1="195.1" y1="252.6" x2="225.1" y2="252.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="233.05792" y="237.5625" width="357.96299999999997" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="412.0" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">index → manifest → config + layers (all by sha256 digest)</text><rect x="599.0209199999999" y="237.5625" width="281.2155" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="739.6" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Tag &quot;1.0.0&quot; is a movable pointer to a digest</text></g><text x="964" y="387" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>