<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 368" width="1000" height="368" role="img" aria-label="Two boxes labelled container A and container B each list root filesystem, namespaces, cgroups and privilege restrictions; both sit on a single bar labelled one shared Linux kernel."><title>A container is a restricted process on a shared kernel</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="367" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C21-M01-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">A container is a restricted process on a shared kernel</text><g transform="translate(0,68)"><rect x="36" y="6" width="456" height="82.7" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="264.0" y="33.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">Container A (a process)</text><text x="264.0" y="56.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">rootfs: read-only image layers + writable layer · namespaces: mnt pid net uts ipc</text><text x="264.0" y="72.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">· cgroups: mem, pids, cpu · caps / seccomp / user</text><rect x="508" y="6" width="456" height="82.7" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="736.0" y="33.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#3B2A7A" text-anchor="middle">Container B (a process)</text><text x="736.0" y="56.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">rootfs: read-only image layers + writable layer · namespaces: mnt pid net uts ipc</text><text x="736.0" y="72.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">· cgroups: mem, pids, cpu · caps / seccomp / user</text><line x1="264" y1="88.7" x2="264" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="736" y1="88.7" x2="736" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="264" y1="111.7" x2="736" y2="111.7" stroke="#64748B" stroke-width="1.8"/><line x1="500.0" y1="111.7" x2="500.0" y2="131.7" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240" y="134.7" width="520" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="162.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">ONE SHARED LINUX KERNEL</text><text x="500.0" y="187.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">a kernel bug or a broken boundary affects every container on the host</text><rect x="36" y="219.7" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="219.7" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="240.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">A container is a restricted process, not a virtual machine.</text></g><text x="964" y="356" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>