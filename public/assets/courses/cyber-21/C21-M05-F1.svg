<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 421" width="1000" height="421" role="img" aria-label="Inside a namespace box, frontend connects to api on port 8080, batch is blocked from api, all pods may reach DNS, and the API server is blocked."><title>The Kestrel namespace after segmentation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C21-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The Kestrel namespace after segmentation</text><g transform="translate(0,68)"><g transform="translate(201.3,4) scale(1.000)"><path d="M132.0,35.4 L359.4,35.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="188" y="42.375" width="115.376" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="245.7" y="56.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">TCP 8080: allowed</text><path d="M132.0,110.4 L386.7,110.4" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="188" y="83.375" width="142.7" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="259.4" y="97.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">UDP / TCP 53 (all pods)</text><path d="M132.0,126.0 L142.0,126.0 L142.0,202.3 L386.7,202.3" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="234.338" y="209.25" width="50.024" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="259.4" y="223.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">denied</text><rect x="12" y="12" width="120" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="72.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">frontend</text><rect x="359.376" y="12" width="120" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="419.4" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">api ×2</text><rect x="12" y="94.79166666666667" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="72.0" y="123.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">batch</text><rect x="386.7" y="87" width="198.7785" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="486.1" y="115.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">kube-system / kube-dns</text><rect x="386.7" y="167.75" width="189.954" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="481.7" y="196.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Kubernetes API server</text><text x="481.7" y="220.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">not needed: denied</text></g><rect x="36" y="272.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="272.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="293.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Namespace kestrel is default-deny: batch → api has no allow rule, so it is blocked.</text></g><text x="964" y="409" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>