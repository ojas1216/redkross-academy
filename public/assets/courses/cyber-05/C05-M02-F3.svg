<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 399" width="1000" height="399" role="img" aria-label="The gap between the owner&#39;s intent to hide paths and the reality that robots.txt publicly lists them to testers."><title>robots.txt is not a control</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="398" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C05-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">robots.txt is not a control</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="128.50252999999998" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="108.3" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Owner intent</text><rect x="190.50252999999998" y="13.0625" width="305.205" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="343.1" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">&quot;hide /admin and /invoice from search engines&quot;</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="128.50252999999998" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="108.3" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Reality</text><rect x="190.50252999999998" y="69.1875" width="237.8265" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="309.4" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Robots.txt is PUBLIC and lists them</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="128.50252999999998" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="108.3" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Crawler</text><rect x="190.50252999999998" y="125.3125" width="216.78" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="298.9" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Obeys Disallow (may skip them)</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="128.50252999999998" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="108.3" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Tester/attacker</text><rect x="190.50252999999998" y="181.4375" width="253.20300000000003" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="317.1" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Reads robots.txt first -&gt; priority targets</text><rect x="36" y="228.5" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="236.5" width="128.50252999999998" height="32.125" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="108.3" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1E293B" text-anchor="middle">Fix</text><rect x="190.50252999999998" y="237.5625" width="321.89099999999996" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/><text x="351.4" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Protect endpoints with authorisation, not obscurity</text></g><text x="964" y="387" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>