<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 209" width="1000" height="209" role="img" aria-label="Four phases in sequence from planning to reporting, with a feedback arrow from attack back to discovery."><title>NIST SP 800-115 four phases</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="208" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C05-M01-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">NIST SP 800-115 four phases</text><g transform="translate(0,68)"><rect x="36" y="8" width="206.5" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="139.3" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Planning</text><line x1="245.5" y1="31.4" x2="273.5" y2="31.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="276.5" y="8" width="206.5" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="379.8" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Discovery</text><line x1="486.0" y1="31.4" x2="514.0" y2="31.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="517" y="8" width="206.5" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="620.3" y="36.