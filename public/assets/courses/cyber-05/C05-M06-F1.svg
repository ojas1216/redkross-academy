<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 838" width="1000" height="838" role="img" aria-label="The lifecycle from discovery through proof of impact, with the ethical tester stopping before the attacker&#39;s later stages."><title>The exploit lifecycle and where the ethical tester stops</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="837" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C05-M06-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The exploit lifecycle and where the ethical tester stops</text><g transform="translate(0,68)"><g transform="translate(245.2,4) scale(1.000)"><path d="M180.5,58.8 L180.5,114.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M180.5,161.5 L180.5,217.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M157.6,264.3 L157.6,320.3" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M203.3,264.3 L203.3,274.3 L337.3,274.3 L337.3,445.3" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="344.2625" y="344.75" width="153.404" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="421.0" y="358.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">only an attacker continues</text><path d="M337.3,492.0 L337.3,548.