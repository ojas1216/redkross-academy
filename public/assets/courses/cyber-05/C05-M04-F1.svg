<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 334" width="1000" height="334" role="img" aria-label="A contrast between CVE as a specific product flaw and CWE as a product-independent weakness type, with three example CWEs."><title>CVE versus CWE</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="333" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C05-M04-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">CVE versus CWE</text><g transform="translate(0,68)"><rect x="36" y="4" width="453" height="207.125" rx="12" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="262.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#123E73" text-anchor="middle">CVE</text><circle cx="56" cy="70" r="3.5" fill="#2563EB"/><text x="68.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">A SPECIFIC flaw in a specific product / version</text><circle cx="56" cy="98.225" r="3.5" fill="#2563EB"/><text x="68.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">What scanners cite</text><circle cx="56" cy="126.44999999999999" r="3.5" fill="#2563EB"/><text x="68.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Use for known, versioned flaws</text><rect x="511" y="4" width="453" height="207.125" rx="12" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="737.5" y="34.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#3B2A7A" text-anchor="middle">CWE</text><circle cx="531" cy="70" r="3.5" fill="#7C3AED"/><text x="543.0" y="74.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">A TYPE of weakness, product-independent</text><circle cx="531" cy="98.225" r="3.5" fill="#7C3AED"/><text x="543.0" y="102.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">CWE-798 hard-coded credentials</text><circle cx="531" cy="126.44999999999999" r="3.5" fill="#7C3AED"/><text x="543.0" y="130.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">CWE-639 IDOR / authorisation bypass</text><circle cx="531" cy="154.67499999999998" r="3.5" fill="#7C3AED"/><text x="543.0" y="158.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">CWE-209 error-message disclosure</text><circle cx="531" cy="182.89999999999998" r="3.5" fill="#7C3AED"/><text x="543.0" y="186.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="start">Use to classify what you find</text></g><text x="964" y="322" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>