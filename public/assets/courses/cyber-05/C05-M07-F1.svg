<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444" width="1000" height="444" role="img" aria-label="A diagram contrasting vertical escalation to admin with horizontal access to another user&#39;s data at the same level."><title>Vertical versus horizontal escalation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="443" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C05-M07-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Vertical versus horizontal escalation</text><g transform="translate(0,68)"><g transform="translate(224.9,4) scale(1.000)"><path d="M208.1,58.8 L208.1,190.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="114.75" width="190.076" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="107.0" y="128.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">VERTICAL: lab default credential</text><path d="M248.1,58.8 L248.1,68.8 L383.9,68.8 L383.9,190.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="390.9135" y="114.75" width="147.356" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="464.6" y="128.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">HORIZONTAL: lab IDOR</text><rect x="168.076" y="12" width="120" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="228.1" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">User A</text><rect x="314.0385" y="190.75" width="139.75" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="383.9" y="219.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">User B&#39;s data</text><text x="383.9" y="243.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">same privilege level</text><rect x="136.1135" y="190.75" width="143.925" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="208.1" y="219.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Admin</text><text x="208.1" y="243.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">higher privilege level</text></g><rect x="36" y="295.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="295.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="316.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Least privilege, authorisation checks and patching prevent both kinds of escalation.</text></g><text x="964" y="432" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>