<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 411" width="1000" height="411" role="img" aria-label="The fields of an evidence record - title, vector, minimal evidence and timestamp - feeding the report."><title>Evidence record</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="410" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C05-M05-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Evidence record</text><g transform="translate(0,68)"><text x="114.0" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">EVIDENCE FIELD</text><text x="214.1" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="start">WHY IT MATTERS</text><rect x="36" y="28" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="36" width="148.09928000000002" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="118.0" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Title + CWE</text><rect x="210.09928000000002" y="37.0625" width="79.512" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="249.9" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">What it is</text><rect x="36" y="84.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="92.125" width="148.09928000000002" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="118.0" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Vector + CVSS</text><rect x="210.09928000000002" y="93.1875" width="95.2665" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="257.7" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">How severe</text><rect x="36" y="140.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="148.25" width="148.09928000000002" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="118.0" y="169.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Evidence</text><rect x="210.09928000000002" y="149.3125" width="246.8445" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="333.5" y="169.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Minimal request / response: the proof</text><rect x="36" y="196.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="204.375" width="148.09928000000002" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="118.0" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Timestamp (UTC)</text><rect x="210.09928000000002" y="205.4375" width="183.057" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="301.6" y="225.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">When, so it is reproducible</text><rect x="36" y="262.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="262.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="283.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">One record per confirmed finding; data/findings.json feeds the report (Module 8).</text></g><text x="964" y="399" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>