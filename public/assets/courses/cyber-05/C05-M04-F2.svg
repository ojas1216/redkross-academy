<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 307" width="1000" height="307" role="img" aria-label="The eight CVSS base metrics feed a formula producing a 0 to 10 score mapped to five severity bands, with a worked example."><title>CVSS base metrics to severity</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="306" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C05-M04-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">CVSS base metrics to severity</text><g transform="translate(0,68)"><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#86EFAC"/><stop offset="0.5" stop-color="#FCD34D"/><stop offset="1" stop-color="#FCA5A5"/></linearGradient></defs><rect x="76" y="66" width="848" height="8" rx="4" fill="url(#sg)"/><circle cx="76" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="76.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">None</text><text x="76.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">0.0</text><circle cx="288" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="288.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Low</text><text x="288.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">0.1 – 3.9</text><circle cx="500" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="500.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Medium</text><text x="500.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">4.0 – 6.9</text><circle cx="712" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="712.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">High</text><text x="712.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">7.0 – 8.9</text><circle cx="924" cy="70" r="9" fill="#FFFFFF" stroke="#EA6A0A" stroke-width="3"/><text x="924.0" y="48.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Critical</text><text x="924.0" y="100.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">9.0 – 10.0</text><rect x="36" y="140" width="928" height="54.45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="140" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="56.0" y="160.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Base metrics AV AC PR UI S C I A go through the CVSS v3.1 formula to a 0.0–10.0 score. Example: AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H = 9.8</text><text x="56.0" y="178.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Critical.</text></g><text x="964" y="295" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>