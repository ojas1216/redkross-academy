<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 343" width="1000" height="343" role="img" aria-label="The four safe-PoC principles with the rule that if any fails, use an isolated lab or do not run the proof."><title>Safe proof-of-concept principles</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C05-M06-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Safe proof-of-concept principles</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="124.21430000000001" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="106.1" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Isolation</text><rect x="186.2143" y="13.0625" width="246.10200000000003" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="309.3" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Own, separated target (loopback lab)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="124.21430000000001" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="106.1" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Minimal action</text><rect x="186.2143" y="69.1875" width="216.82049999999998" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="294.6" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Smallest step that shows impact</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="124.21430000000001" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="106.1" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">Reversibility</text><rect x="186.2143" y="125.3125" width="296.3895" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="334.4" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Change nothing, or undo fully (keep backups)</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="124.21430000000001" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="106.1" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">Containment</text><rect x="186.2143" y="181.4375" width="253.5945" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="313.0" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Cannot spread or reach other systems</text></g><text x="964" y="331" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>