<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 283" width="1000" height="283" role="img" aria-label="Bars showing the Security log on 4 of 16 hosts and Sysmon on 16 of 16, with the resulting precise statement of what the hunt can conclude."><title>Data requirements decide what &quot;nothing found&quot; means</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="282" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C20-M05-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Data requirements decide what &quot;nothing found&quot; means</text><g transform="translate(0,68)"><text x="36.0" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Hosts sending each data source (fleet of 16)</text><text x="155.7" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Security 4698</text><rect x="169.68244" y="44" width="684.31756" height="26" rx="6" fill="#F1F5F9"/><rect x="169.68244" y="44" width="171.07939" height="26" rx="6" fill="#F59E4B"/><text x="350.8" y="62.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="start">4 / 16: H1 primary covers 25%</text><text x="155.7" y="103.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Sysmon process</text><rect x="169.68244" y="86" width="684.31756" height="26" rx="6" fill="#F1F5F9"/><rect x="169.68244" y="86" width="684.31756" height="26" rx="6" fill="#6CCB95"/><text x="844.0" y="104.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="end">16 / 16: fallback (schtasks.exe only)</text><rect x="36" y="134" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="134" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="154.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">So &quot;nothing found&quot; means: no other suspicious tasks on 4 hosts; no schtasks.exe creation on 16 hosts; other creation methods unseen on 12.</text></g><text x="964" y="271" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>