<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-label="A frequency table of parent-child pairs from common to rare, with rare pairs labelled as baseline or finding."><title>Stacking parent-child pairs</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="403" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C20-M05-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Stacking parent-child pairs</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="34" rx="8" fill="#1F2937"/><text x="50.0" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">PARENT → CHILD</text><text x="570.7" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">HOSTS</text><text x="746.1" y="26.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="start">VERDICT</text><rect x="36" y="42" width="928" height="36.225" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="42" width="4" height="36.225" rx="2" fill="#16A34A"/><text x="50.0" y="64.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#14532D" text-anchor="start">userinit → e