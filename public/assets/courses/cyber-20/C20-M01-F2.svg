<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 309" width="1000" height="309" role="img" aria-label="Three inventories - telemetry, priority techniques and the detection pack - feed a coverage matrix with scores from 0 blind to 3 tested, with an asterisk for partial fleet coverage."><title>The coverage join</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="308" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C20-M01-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The coverage join</text><g transform="translate(0,68)"><rect x="36" y="6" width="298.6666666666667" height="67.1" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="185.3" y="33.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">Telemetry inventory</text><text x="185.3" y="56.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">log, hosts, retention</text><rect x="350.6666666666667" y="6" width="298.6666666666667" height="67.1" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="500.0" y="33.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">Priority techniques</text><text x="500.0" y="56.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">ATT&amp;CK ID, log needed</text><rect x="665.3333333333334" y="6" width="298.6666666666667" height="67.1" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="814.7" y="33.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Detection pack</text><text x="814.7" y="56.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">rules (tags), tests</text><line x1="185.33333333333334" y1="73.1" x2="185.33333333333334" y2="96.1" stroke="#64748B" stroke-width="1.8"/><line x1="500" y1="73.1" x2="500" y2="96.1" stroke="#64748B" stroke-width="1.8"/><line x1="814.6666666666667" y1="73.1" x2="814.6666666666667" y2="96.1" stroke="#64748B" stroke-width="1.8"/><line x1="185.33333333333334" y1="96.1" x2="814.6666666666667" y2="96.1" stroke="#64748B" stroke-width="1.8"/><line x1="500.0" y1="96.1" x2="500.0" y2="116.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="240" y="119.1" width="520" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="147.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">COVERAGE MATRIX</text><text x="500.0" y="172.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">0 blind · 1 visible · 2 detected · 3 tested (* = only part of the fleet sends this log)</text></g><text x="964" y="297" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>