<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 499" width="1000" height="499" role="img" aria-label="A six-row checklist: what, where, how, how long, when and trust, each with a short description."><title>Six questions for every telemetry source</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="498" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C20-M01-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Six questions for every telemetry source</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="122" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="105.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">WHAT</text><rect x="184" y="13.0625" width="126.80250000000001" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="247.4" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Events and fields</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="122" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="105.0" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">WHERE</text><rect x="184" y="69.1875" width="253.44599999999997" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="310.7" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Share of the fleet (n / N), not just &quot;yes&quot;</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="122" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="105.0" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">HOW</text><rect x="184" y="125.3125" width="225.096" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="296.5" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Transport, buffering, health check</text><rect x="36" y="172.375" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="180.375" width="122" height="32.125" rx="8" fill="#F5F3FF" stroke="#B3A2F0"/><text x="105.0" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#3B2A7A" text-anchor="middle">HOW LONG</text><rect x="184" y="181.4375" width="343.6665" height="30" rx="15" fill="#FFFFFF" stroke="#B3A2F0"/><text x="355.8" y="201.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Hot and cold retention vs legal and investigative need</text><rect x="36" y="228.5" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="236.5" width="122" height="32.125" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="105.0" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#1E293B" text-anchor="middle">WHEN</text><rect x="184" y="237.5625" width="276.8145" height="30" rx="15" fill="#FFFFFF" stroke="#94A3B8"/><text x="322.4" y="257.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Clock sync and time zone (UTC preferred)</text><rect x="36" y="284.625" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="292.625" width="122" height="32.125" rx="8" fill="#FEF2F2" stroke="#F19A9A"/><text x="105.0" y="313.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">TRUST</text><rect x="184" y="293.6875" width="282.12" height="30" rx="15" fill="#FFFFFF" stroke="#F19A9A"/><text x="325.1" y="313.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Who can alter or delete it; tamper detection</text><rect x="36" y="350.75" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="350.75" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="371.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Six questions to ask of every telemetry source.</text></g><text x="964" y="487" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>