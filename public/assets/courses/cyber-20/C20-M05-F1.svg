<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 276" width="1000" height="276" role="img" aria-label="Three boxes in a cycle - Prepare, Execute and Act - with a return arrow labelled knowledge."><title>The PEAK hunting cycle</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="275" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C20-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The PEAK hunting cycle</text><g transform="translate(0,68)"><rect x="36" y="8" width="286.6666666666667" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="179.3" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">PREPARE</text><text x="179.3" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">topic, research, hypothesis</text><line x1="325.7" y1="42.5" x2="353.7" y2="42.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="356.6666666666667" y="8" width="286.6666666666667" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">EXECUTE</text><text x="500.0" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">gather, analyse, validate</text><line x1="646.3" y1="42.5" x2="674.3" y2="42.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="677.3333333333334" y="8" width="286.6666666666667" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="820.7" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">ACT</text><text x="820.7" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">document, automate, communicate</text><path d="M820.6666666666667,77 L820.6666666666667,95 L179.33333333333334,95 L179.33333333333334,81" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="398.56250000000006" y="84" width="202.875" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="99.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">KNOWLEDGE feeds every phase</text><rect x="36" y="127" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="127" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="147.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The PEAK threat-hunting cycle.</text></g><text x="964" y="264" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>