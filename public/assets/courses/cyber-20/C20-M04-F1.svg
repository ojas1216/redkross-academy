<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 529" width="1000" height="529" role="img" aria-label="A flow from branch and edit through a local hook, a pull request with CI and peer review, to staged deployment with a rollback path."><title>Detection-as-code pipeline</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="528" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C20-M04-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Detection-as-code pipeline</text><g transform="translate(0,68)"><rect x="220" y="8" width="560" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Branch: edit the rule + tests</text><line x1="500.0" y1="57.8" x2="500.0" y2="81.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="84.75" width="560" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Pre-commit hook</text><text x="500.0" y="137.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">unit tests</text><line x1="500.0" y1="156.8" x2="500.0" y2="180.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="183.75" width="560" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="212.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Pull request → CI</text><text x="500.0" y="236.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">lint (sigma check) + unit tests + convert</text><line x1="500.0" y1="255.8" x2="500.0" y2="279.8" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="282.75" width="560" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="311.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Peer review</text><line x1="500.0" y1="332.5" x2="500.0" y2="356.5" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="220" y="359.5" width="560" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="387.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Merge → staging SIEM → canary → production</text><line x1="784.0" y1="382.9" x2="800.0" y2="382.9" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="806.0" y="386.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="start">rollback path back to staging</text></g><text x="964" y="517" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>