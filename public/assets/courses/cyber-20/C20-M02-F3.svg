<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="A scale from low to high disruption listing the triage package, kill or quarantine, block, account actions, isolation and reimage, with three principles beneath."><title>Response controls by disruption</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="579" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C20-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Response controls by disruption</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="32.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Triage package</text><text x="500.0" y="57.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">lowest disruption</text><rect x="36" y="81" width="928" height="46.75" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="109.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Kill / quarantine</text><rect x="36" y="135.75" width="928" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="164.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Block indicator</text><rect x="36" y="190.5" width="928" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="218.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Disable / reset account</text><text x="500.0" y="243.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">+ revoke sessions</text><rect x="36" y="267.5" width="928" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="295.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Isolate host</text><text x="500.0" y="320.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">EDR channel kept</text><rect x="36" y="344.5" width="928" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="500.0" y="372.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Reimage</text><text x="500.0" y="397.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">highest disruption</text><rect x="36" y="431.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="431.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="452.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">For high-disruption actions: evidence first, act on identity and host together, and scale approval with impact.</text></g><text x="964" y="568" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>