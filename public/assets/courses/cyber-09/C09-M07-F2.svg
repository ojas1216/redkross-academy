<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 559" width="1000" height="559" role="img" aria-label="A loop from the first host to indicators, an estate-wide sweep and new hosts, repeated until a sweep finds nothing new."><title>Iterative scoping</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="558" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C09-M07-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Iterative scoping</text><g transform="translate(0,68)"><circle cx="500" cy="190" r="150" fill="none" stroke="#E2E8F0" stroke-width="10"/><path d="M567.3167979383534,55.953557617790864 A150,150 0 0 1 592.6058607902045,71.99934514035415" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M634.0464423822091,257.3167979383533 A150,150 0 0 1 618.0006548596459,282.6058607902045" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M432.6832020616467,324.0464423822091 A150,150 0 0 1 407.3941392097955,308.00065485964586" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M365.95355761779086,122.68320206164668 A150,150 0 0 1 381.9993451403541,97.39413920979553" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><rect x="390" y="6.450000000000003" width="220" height="67.1" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="33.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">Known hosts</text><text x="500.0" y="57.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">start from the first host</text><rect x="540" y="148.65" width="220" height="82.7" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="650.0" y="176.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">Extract indicators</text><text x="650.0" y="199.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">hash, IP, domain, account,</text><text x="650.0" y="215.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">persistence</text><rect x="390" y="306.45" width="220" height="67.1" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="500.0" y="333.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Sweep the estate</text><text x="500.0" y="357.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">EDR, SIEM, hunts</text><rect x="240" y="156.45000000000005" width="220" height="67.1" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="350.0" y="183.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#3B2A7A" text-anchor="middle">New hosts found</text><text x="350.0" y="207.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">add them and repeat</text><text x="500.0" y="195.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Iterative scoping</text><rect x="36" y="410" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="410" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="430.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Repeat until a sweep finds nothing new, and record the coverage of each sweep.</text></g><text x="964" y="547" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>