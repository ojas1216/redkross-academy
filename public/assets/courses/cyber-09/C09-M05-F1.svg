<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 591" width="1000" height="591" role="img" aria-label="A tree rooted at a 4624 logon event with branches to 4672, process creation, persistence events and 4634, all linked by the same logon ID."><title>Logon session correlation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="590" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C09-M05-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Logon session correlation</text><g transform="translate(0,68)"><g transform="translate(260.8,4) scale(1.000)"><path d="M200.4,46.5 L256.4,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M200.4,60.3 L230.4,60.3 L230.4,157.6 L256.4,157.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M200.4,74.1 L220.4,74.1 L220.4,268.8 L256.4,268.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M200.4,87.9 L210.4,87.9 L210.4,371.8 L256.4,371.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="12" y="32.7" width="188.4375" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="106.2" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4624 logon</text><text x="106.2" y="85.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">type 10, IP, LogonId 0x5A1F</text><rect x="256.4375" y="12" width="170.54010000000002" height="69" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="341.7" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">4672 same LogonId</text><text x="341.7" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">privileged session</text><rect x="256.4375" y="115" width="210" height="85.25" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="361.4" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">4688 / Sysmon 1</text><text x="361.4" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">SubjectLogonId 0x5A1F:</text><text x="361.4" y="184.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">processes run</text><rect x="256.4375" y="234.25" width="210" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="361.4" y="262.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">4698 / 7045 in the window</text><text x="361.4" y="287.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">persistence created?</text><rect x="256.4375" y="337.25" width="170.54010000000002" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="341.7" y="365.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">4634 same LogonId</text><text x="341.7" y="390.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">session end</text></g><rect x="36" y="442.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="442.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="462.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The LogonId ties every event in the session together.</text></g><text x="964" y="579" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>