<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 297" width="1000" height="297" role="img" aria-label="A horizontal bar showing protective MBR at LBA 0, GPT header at LBA 1, entries, two partitions, an unallocated gap and backup structures at the end of the disk."><title>GPT disk layout</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="296" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C09-M03-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">GPT disk layout</text><g transform="translate(0,68)"><rect x="37" y="30" width="112.69662921348315" height="96" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="93.3" y="81.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="middle">Protective MBR</text><text x="93.3" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">LBA 0</text><rect x="151.69662921348316" y="30" width="112.69662921348315" height="96" rx="6" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="208.0" y="81.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#123E73" text-anchor="middle">GPT header</text><text x="208.0" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.