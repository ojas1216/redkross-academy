e="13.5" font-weight="700" fill="#14532D" text-anchor="middle">Backup entries +</text><text x="880.6" y="89.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="700" fill="#14532D" text-anchor="middle">backup header</text><text x="880.6" y="20.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">end-33 … end</text><rect x="36" y="148" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="148" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="168.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Check the gaps between partitions and compare the primary and backup GPT structures.</text></g><text x="964" y="285" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>