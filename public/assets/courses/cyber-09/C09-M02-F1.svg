<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 212" width="1000" height="212" role="img" aria-label="A suspect disk connects through a write blocker to a forensic workstation, which writes an image, a hash and a log to a separate evidence drive."><title>Acquisition with a write blocker</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="211" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C09-M02-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Acquisition with a write blocker</text><g transform="translate(0,68)"><g transform="translate(36.0,4) scale(0.766)"><path d="M132.1,54.6 L324.2,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="188.1371" y="61.625" width="80.024" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="228.1" y="75.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">SATA / USB</text><path d="M500.0,54.6 L650.7,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="556.0486000000001" y="61.625" width="38.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="575.4" y="75.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">USB</text><path d="M826.5,54.6 L989.2,54.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="882.5077000000001" y="61.625" width="50.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="907.8" y="75.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">imager</text><rect x="12" y="31.25" width="120.1371" height="46.75" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="72.1" y="59.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">Suspect disk</text><rect x="324.16110000000003" y="20.125" width="175.8875" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="412.1" y="48.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">WRITE BLOCKER</text><text x="412.1" y="73.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">reads pass, writes refused</text><rect x="650.7206000000001" y="31.25" width="175.7871" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="738.6" y="59.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Forensic workstation</text><rect x="989.1797000000001" y="12" width="210" height="85.25" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="1094.2" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Image file</text><text x="1094.2" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">on a wiped evidence drive +</text><text x="1094.2" y="81.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">SHA-256 + log</text></g></g><text x="9