<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 848" width="1000" height="848" role="img" aria-label="A decision tree. Powered-off systems use on-disk memory remnants, VMs use hypervisor snapshots, and physical systems use an approved tool writing to external storage, followed by hashing and then disk acquisition."><title>Memory acquisition decision</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="847" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C09-M04-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Memory acquisition decision</text><g transform="translate(0,68)"><g transform="translate(205.5,4) scale(1.000)"><path d="M361.2,58.8 L361.2,68.8 L190.1,68.8 L190.1,190.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="156.76789999999997" y="114.75" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="170.4" y="128.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M410.9,58.8 L410.9,205.6" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="417.92179999999996" y="114.75" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="434.3" y="128.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M386.2,252.3 L386.2,269.8 L136.1,269.8 L136.1,516.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="97.4656" y="315.75" width="32.672" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="113.8" y="329.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">yes</text><path d="M435.7,252.3 L435.7,391.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="442.65635" y="315.75" width="27.344" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="456.3" y="329.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">no</text><path d="M435.7,460.8 L435.7,516.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M435.7,585.8 L435.7,641.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><path d="M136.1,585.8 L136.1,595.8 L335.7,595.8 L335.7,641.8" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="311.39" y="12" width="149.29770000000002" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="386.0" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">System running?</text><rect x="77.50564999999997" y="190.75" width="225.2125" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="190.1" y="219.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Check the disk image</text><text x="190.1" y="243.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">hiberfil.sys / pagefile / crash dumps</text><rect x="336.71815" y="205.58333333333334" width="148.40730000000002" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="410.9" y="233.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Virtual machine?</text><rect x="12" y="516.75" width="248.27519999999998" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="136.1" y="545.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Hypervisor snapshot / suspend</text><text x="136.1" y="569.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">.vmem → hash</text><rect x="299.14855" y="391.75" width="273.01560000000006" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="435.7" y="420.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Approved tool from external media</text><text x="435.7" y="444.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">WinPmem / DumpIt / LiME / AVML</text><rect x="294.2752" y="516.75" width="282.76230000000004" height="69" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="435.7" y="545.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">Output to external / network storage</text><text x="435.7" y="569.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">hash it, record the footprint</text><rect x="235.65635" y="641.75" width="300" height="65.5" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="385.7" y="670.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">THEN disk acquisition and</text><text x="385.7" y="688.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">containment</text></g></g><text x="964" y="836" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>