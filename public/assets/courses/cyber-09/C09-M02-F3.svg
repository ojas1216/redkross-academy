<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 369" width="1000" height="369" role="img" aria-label="A source is acquired to a master copy in sealed storage, from which two verified working copies are made for analysis."><title>Master and working copies</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="368" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C09-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Master and working copies</text><g transform="translate(0,68)"><g transform="translate(76.8,4) scale(1.000)"><path d="M132.0,58.0 L297.3,58.0" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="188" y="65" width="53.348" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="214.7" y="79.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">acquire</text><path d="M501.0,46.5 L694.7,46.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="557.048" y="19.5" width="81.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="597.9" y="33.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">copy + verify</text><path d="M501.0,69.5 L511.0,69.5 L511.0,149.5 L694.7,149.5" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="557.048" y="156.5" width="81.69200000000001" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><text x="597.9" y="170.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">copy + verify</text><rect x="12" y="34.625" width="120" height="46.75" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="72.0" y="62.9" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Source</text><rect x="297.348" y="23.5" width="203.70000000000002" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="399.2" y="51.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">MASTER copy</text><text x="399.2" y="76.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">golden, sealed storage, verified</text><rect x="694.74" y="12" width="139.5669" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="764.5" y="40.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Working copy 1</text><text x="764.5" y="65.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">analysis</text><rect x="694.74" y="115" width="139.5669" height="69" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="764.5" y="143.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Working copy 2</text><text x="764.5" y="168.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">second examiner</text></g><rect x="36" y="220" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="220" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="240.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Any change to a working copy produces a new hash and is documented; the master stays untouched.</text></g><text x="964" y="357" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>