<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 296" width="1000" height="296" role="img" aria-label="Four boxes in sequence, collection, examination, analysis and reporting, preceded by questions and authority, with a loop from reporting back to collection for new questions."><title>The forensic process (NIST SP 800-86)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="295" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C09-M01-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The forensic process (NIST SP 800-86)</text><g transform="translate(0,68)"><rect x="36" y="8" width="206.5" height="46.75" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="139.3" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Collection</text><line x1="245.5" y1="31.4" x2="273.5" y2="31.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="276.5" y="8" width="206.5" height="46.75" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="379.8" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Examination</text><line x1="486.0" y1="31.4" x2="514.0" y2="31.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="517" y="8" width="206.5" height="46.75" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="620.3" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Analysis</text><line x1="726.5" y1="31.4" x2="754.5" y2="31.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="757.5" y="8" width="206.5" height="46.75" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="860.8" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reporting</text><line x1="139.25" y1="56.75" x2="139.25" y2="66.75" stroke="#CBD5E1" stroke-width="1.5"/><text x="139.3" y="82.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">acquire, hash, label</text><line x1="379.75" y1="56.75" x2="379.75" y2="66.75" stroke="#CBD5E1" stroke-width="1.5"/><text x="379.8" y="82.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">parse, extract, filter</text><line x1="620.25" y1="56.75" x2="620.25" y2="66.75" stroke="#CBD5E1" stroke-width="1.5"/><text x="620.3" y="82.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">correlate, answer the questions</text><line x1="860.75" y1="56.75" x2="860.75" y2="66.75" stroke="#CBD5E1" stroke-width="1.5"/><text x="860.8" y="82.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">findings, methods, limitations</text><path d="M860.75,54.75 L860.75,115.25 L139.25,115.25 L139.25,58.75" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="424.95625" y="104.25" width="150.0875" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><text x="500.0" y="119.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">new questions / sources</text><rect x="36" y="147.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="147.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="167.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The process starts from the questions to answer and the authority to examine.</text></g><text x="964" y="284" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>