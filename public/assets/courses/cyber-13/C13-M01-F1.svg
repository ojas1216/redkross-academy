<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 353" width="1000" height="353" role="img" aria-label="A large box labelled forest contains two trees, each with a parent domain and a child domain; a note states that true isolation requires a separate forest."><title>Forest, trees, domains and the security boundary</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="352" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M01-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Forest, trees, domains and the security boundary</text><g transform="translate(0,68)"><rect x="240" y="6" width="520" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOREST: the security boundary</text><text x="500.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">shared schema, configuration, global catalogue, automatic trusts</text><rect x="36" y="121" width="456" height="67.1" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="264.0" y="148.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">Tree 1: example.com</text><text x="264.0" y="171.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">child domain: sales.example.com</text><rect x="508" y="121" width="456" height="67.1" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="736.0" y="148.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">Tree 2: sahyadri.example</text><text x="736.0" y="171.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">child domain: ad.sahyadri.example</text><line x1="500" y1="75" x2="500" y2="98" stroke="#64748B" stroke-width="1.8"/><line x1="264" y1="98" x2="736" y2="98" stroke="#64748B" stroke-width="1.8"/><line x1="264.0" y1="98.0" x2="264.0" y2="118.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><line x1="736.0" y1="98.0" x2="736.0" y2="118.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="36" y="204.1" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="204.1" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="224.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Need real isolation? Create a separate FOREST; a separate domain is not a security boundary.</text></g><text x="964" y="341" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>