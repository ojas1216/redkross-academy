<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 311" width="1000" height="311" role="img" aria-label="A privileged-access workstation managing Tier 0 is allowed; an ordinary laptop managing Tier 0 is not, with the clean-source rule stated."><title>Clean source - manage only from something cleaner</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="310" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M04-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Clean source - manage only from something cleaner</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="66.25" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="252" height="50.25" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="170.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">PAW (hardened, no mail/web)</text><text x="170.0" y="51.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">--manages</text><line x1="304.0" y1="37.1" x2="334.0" y2="37.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="22.125" width="120.7545" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="402.4" y="42.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Tier 0 (DCs) OK</text><rect x="36" y="78.25" width="928" height="66.25" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="86.25" width="252" height="50.25" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="170.0" y="107.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Ordinary laptop (mail, web)</text><text x="170.0" y="125.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">--manages</text><line x1="304.0" y1="111.4" x2="334.0" y2="111.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="96.375" width="153.006" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="418.5" y="116.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Tier 0 (DCs) NOT OK</text><rect x="36" y="162.5" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="162.5" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="183.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Rule: the controlling system must be &gt;= the trust of what it controls</text></g><text x="964" y="299" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>