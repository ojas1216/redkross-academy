<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 564" width="1000" height="564" role="img" aria-label="A cycle from planning through review, scoring, remediation, re-testing and measurement, back to planning."><title>The assessment loop</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="563" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M07-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The assessment loop</text><g transform="translate(0,68)"><circle cx="500" cy="215" r="175" fill="none" stroke="#E2E8F0" stroke-width="10"/><path d="M535.3841383641488,43.61457835560583 A175,175 0 0 1 568.7278384225335,54.060619406665666" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M666.1161981644271,159.95085189217937 A175,175 0 0 1 673.7415112744266,194.05036372443908" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M630.7320598002783,331.3362735365735 A175,175 0 0 1 605.013672851893,354.98974431777344" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M464.61586163585116,386.38542164439417 A175,175 0 0 1 431.2721615774665,375.93938059333436" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M333.88380183557285,270.04914810782066 A175,175 0 0 1 326.25848872557344,235.949636275561" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><path d="M369.2679401997218,98.66372646342639 A175,175 0 0 1 394.986327148107,75.0102556822265" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/><rect x="405" y="6.450000000000003" width="190" height="67.1" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="33.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#7A3A06" text-anchor="middle">Plan</text><text x="500.0" y="57.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">scope, authorise</text><rect x="556.5544456622767" y="93.95" width="190" height="67.1" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="651.6" y="121.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#123E73" text-anchor="middle">Review</text><text x="651.6" y="144.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">config, activity, access</text><rect x="556.5544456622767" y="268.95" width="190" height="67.1" rx="10" fill="#ECFDF3" stroke="#6CCB95" stroke-width="1.5"/><text x="651.6" y="296.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Score &amp; prioritise</text><text x="651.6" y="319.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">HIGH / MED / LOW</text><rect x="405" y="356.45" width="190" height="67.1" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="383.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#3B2A7A" text-anchor="middle">Remediate</text><text x="500.0" y="407.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#475569" text-anchor="middle">owner, due date</text>