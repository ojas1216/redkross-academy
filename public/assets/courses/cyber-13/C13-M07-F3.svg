<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 378" width="1000" height="378" role="img" aria-label="A two-by-two of impact against exploitability, placing the Kerberoastable account in the high-impact, easily-exploited quadrant."><title>Scoring by impact and effort</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="377" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M07-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Scoring by impact and effort</text><g transform="translate(0,68)"><rect x="36" y="6" width="125.30592" height="20" rx="6" fill="#EA6A0A"/><text x="45.0" y="20.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">High impact · hard</text><rect x="36" y="32" width="456" height="78.9" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="264.0" y="65.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7A3A06" text-anchor="middle">MEDIUM</text><text x="264.0" y="91.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">plan it</text><rect x="508" y="6" width="126.71784000000001" height="20" rx="6" fill="#DC2626"/><text x="517.0" y="20.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">High impact · easy</text><rect x="508" y="32" width="456" height="78.9" rx="10" fill="#FEF2F2" stroke="#F19A9A" stroke-width="1.5"/><text x="736.0" y="65.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7F1D1D" text-anchor="middle">HIGH: fix first</text><text x="736.0" y="91.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">e.g. legacy-svc SPN</text><rect x="36" y="126.9" width="122.48208000000002" height="20" rx="6" fill="#475569"/><text x="45.0" y="141.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">Low impact · hard</text><rect x="36" y="152.9" width="456" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="264.0" y="186.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">LOW</text><rect x="508" y="126.9" width="123.89399999999999" height="20" rx="6" fill="#EA6A0A"/><text x="517.0" y="141.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">Low impact · easy</text><rect x="508" y="152.9" width="456" height="56" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="736.0" y="186.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#7A3A06" text-anchor="middle">MEDIUM</text><rect x="36" y="228.9" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="228.9" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="249.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Score each finding by its impact and by how easy it is for an attacker to exploit.</text></g><text x="964" y="366" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>