<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 212" width="1000" height="212" role="img" aria-label="Five stages from scoping an alert through baselining, corroboration and a decision to recording the evidence."><title>Alert investigation flow</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="211" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M06-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Alert investigation flow</text><g transform="translate(0,68)"><rect x="36" y="8" width="158.4" height="85.25" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="115.2" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Scope</text><text x="115.2" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">who / where / when /</text><text x="115.2" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">how many</text><line x1="197.4" y1="50.6" x2="225.4" y2="50.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="228.4" y="8" width="158.4" height="85.25" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="307.6" y="44.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Baseline</text><text x="307.6" y="69.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">normal for this account?</text><line x1="389.8" y1="50.6" x2="417.8" y2="50.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="420.8" y="8" width="158.4" height="85.25" rx="10" fill="#F5F3FF" stroke="#B3A2F0" stroke-width="1.5"/><text x="500.0" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#3B2A7A" text-anchor="middle">Corroborate</text><text x="500.0" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">related events: TGT,</text><text x="500.0" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">lockout, changes</text><line x1="582.2" y1="50.6" x2="610.2" y2="50.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="613.2" y="8" width="158.4" height="85.25" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="692.4" y="36.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Decide</text><text x="692.4" y="61.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">benign / suspicious /</text><text x="692.4" y="77.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">confirmed</text><line x1="774.6" y1="50.6" x2="802.6" y2="50.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="805.6" y="8" width="158.4" height="85.25" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="884.8" y="44.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Record</text><text x="884.8" y="69.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">evidence for report + IR</text></g><text x="964" y="200" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>