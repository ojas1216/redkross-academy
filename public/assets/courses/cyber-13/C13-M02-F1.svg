<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 536" width="1000" height="536" role="img" aria-label="A sequence between client, KDC and service showing AS-REQ/REP yielding a TGT, TGS-REQ/REP yielding a service ticket, and AP-REQ presenting it to the service."><title>The Kerberos three-party flow</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="535" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M02-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The Kerberos three-party flow</text><g transform="translate(0,68)"><line x1="190.66666666666666" y1="75" x2="190.66666666666666" y2="369" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="80.66666666666666" y="6" width="220" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="190.7" y="45.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Client</text><line x1="500" y1="75" x2="500" y2="369" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="390" y="6" width="220" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="34.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">KDC (on the DC)</text><text x="500.0" y="59.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">AS + TGS</text><line x1="809.3333333333333" y1="75" x2="809.3333333333333" y2="369" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="699.3333333333333" y="6" width="220" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="809.3" y="45.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Service</text><line x1="194.7" y1="109.0" x2="494.0" y2="109.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="345.3" y="101.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">AS-REQ (with pre-authentication)</text><circle cx="190.66666666666666" cy="109" r="9" fill="#EA6A0A"/><text x="190.7" y="113.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="496.0" y1="163.0" x2="196.7" y2="163.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="345.3" y="140.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">AS-REP: TGT (encrypted with the krbtgt key) +</text><text x="345.3" y="155.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">session key</text><circle cx="500" cy="163" r="9" fill="#EA6A0A"/><text x="500.0" y="167.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="194.7" y1="217.0" x2="494.0" y2="217.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="345.3" y="209.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">TGS-REQ: TGT + SPN</text><circle cx="190.66666666666666" cy="217" r="9" fill="#EA6A0A"/><text x="190.7" y="221.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="496.0" y1="271.0" x2="196.7" y2="271.0" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="345.3" y="248.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">TGS-REP: service ticket (encrypted with the service</text><text x="345.3" y="263.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">key)</text><circle cx="500" cy="271" r="9" fill="#EA6A0A"/><text x="500.0" y="275.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="194.7" y1="325.0" x2="803.3" y2="325.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><text x="500.0" y="317.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#0F172A" text-anchor="middle">AP-REQ: service ticket</text><circle cx="190.66666666666666" cy="325" r="9" fill="#EA6A0A"/><text x="190.7" y="329.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="36" y="387" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="387" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="407.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">The service decrypts the ticket with its own key; it never needs to contact the KDC.</text></g><text x="964" y="524" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>