<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 367" width="1000" height="367" role="img" aria-label="A flow where any user obtains a service ticket and cracks it offline, with defences of a strong key, no SPN, gMSA and AES."><title>Why a Kerberoastable account is a target</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="366" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M05-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Why a Kerberoastable account is a target</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="66.25" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="252" height="50.25" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="170.0" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Any domain user --request service</text><text x="170.0" y="51.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">ticket for SPN</text><line x1="304.0" y1="37.1" x2="334.0" y2="37.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="22.125" width="52.49850000000001" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="368.2" y="42.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">KDC</text><rect x="36" y="78.25" width="928" height="66.25" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="86.25" width="252" height="50.25" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="170.0" y="107.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">KDC --service ticket (encrypted</text><text x="170.0" y="125.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">with service acct key)</text><line x1="304.0" y1="111.4" x2="334.0" y2="111.4" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="96.375" width="52.49850000000001" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="368.2" y="116.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">User</text><rect x="36" y="152.5" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="160.5" width="252" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="170.0" y="181.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">User --takes ticket OFFLINE</text><line x1="304.0" y1="176.6" x2="334.0" y2="176.6" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="161.5625" width="208.545" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="446.3" y="181.6" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Crack weak/RC4 key at leisure</text><rect x="36" y="218.625" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="218.625" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="239.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Defence: key is long+random (uncrackable) OR no SPN OR gMSA; AES not RC4</text></g><text x="964" y="355" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>