<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" width="1000" height="466" role="img" aria-label="Three stacked tiers from domain controllers at the top to workstations at the bottom, with a note forbidding use of a Tier 0 credential on lower tiers."><title>The tier model and the forbidden path</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="465" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M04-F1</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">The tier model and the forbidden path</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="69" rx="10" fill="#1F2937" stroke="#111827" stroke-width="1.5"/><text x="500.0" y="32.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 0</text><text x="500.0" y="57.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#CBD5E1" text-anchor="middle">DCs, Domain Admins: control of the directory</text><line x1="500.0" y1="76.0" x2="500.0" y2="96.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="36" y="99" width="928" height="69" rx="10" fill="#FFF4E8" stroke="#F59E4B" stroke-width="1.5"/><text x="500.0" y="127.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#7A3A06" text-anchor="middle">Tier 1</text><text x="500.0" y="152.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">servers, server admins</text><line x1="500.0" y1="171.0" x2="500.0" y2="191.0" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="36" y="194" width="928" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="500.0" y="222.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Tier 2</text><text x="500.0" y="247.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">workstations, help desk, staff</text><rect x="36" y="299" width="928" height="54.45" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="299" width="4" height="54.45" rx="2" fill="#EA6A0A"/><text x="56.0" y="319.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Admin control flows DOWN only. FORBIDDEN: using a Tier 0 credential on a Tier 1 or Tier 2 system, which exposes domain control where attackers</text><text x="56.0" y="337.7" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">land first.</text></g><text x="964" y="454" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>