<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 287" width="1000" height="287" role="img" aria-label="Three LDAP bind options ranked from a cleartext simple bind to protect, through a TLS-protected simple bind, to the preferred GSSAPI bind that uses a Kerberos ticket."><title>LDAP bind choices</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="286" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M02-F3</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">LDAP bind choices</text><g transform="translate(0,68)"><rect x="36" y="4" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="12" width="203.67720000000003" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="145.8" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Simple bind + no TLS</text><rect x="265.6772" y="13.0625" width="259.1835" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="395.3" y="33.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">DN + password in CLEARTEXT (avoid)</text><rect x="36" y="60.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="68.125" width="203.67720000000003" height="32.125" rx="8" fill="#EFF6FF" stroke="#7FB0EE"/><text x="145.8" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#123E73" text-anchor="middle">Simple bind + LDAPS</text><rect x="265.6772" y="69.1875" width="262.2075" height="30" rx="15" fill="#FFFFFF" stroke="#7FB0EE"/><text x="396.8" y="89.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">DN + password inside TLS (acceptable)</text><rect x="36" y="116.25" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="124.25" width="203.67720000000003" height="32.125" rx="8" fill="#ECFDF3" stroke="#6CCB95"/><text x="145.8" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#14532D" text-anchor="middle">SASL/GSSAPI (Kerberos)</text><rect x="265.6772" y="125.3125" width="264.813" height="30" rx="15" fill="#FFFFFF" stroke="#6CCB95"/><text x="398.1" y="145.3" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Uses the TGT, NO password (preferred)</text></g><text x="964" y="275" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>