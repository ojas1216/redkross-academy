<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 437" width="1000" height="437" role="img" aria-label="A client first queries DNS for the LDAP SRV record, receives the DC name, then contacts the DC for Kerberos on port 88 and LDAP on port 389."><title>How a client finds and uses a domain controller</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="436" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M01-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">How a client finds and uses a domain controller</text><g transform="translate(0,68)"><line x1="190.66666666666666" y1="75" x2="190.66666666666666" y2="315" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="80.66666666666666" y="6" width="220" height="69" rx="10" fill="#EFF6FF" stroke="#7FB0EE" stroke-width="1.5"/><text x="190.7" y="45.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#123E73" text-anchor="middle">Client</text><line x1="500" y1="75" x2="500" y2="315" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/><rect x="390" y="6" width="220" height="69" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="500.0" y="45.4" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">DNS</text><line x1="809.3333333333333" y1="75" x2="809.3