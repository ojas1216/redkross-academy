<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 299" width="1000" height="299" role="img" aria-label="Two mappings showing the TGT protected by the krbtgt key and service tickets by service-account keys, with the two attack consequences named."><title>Which key protects which ticket</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect x="0.5" y="0.5" width="999" height="298" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="0.5" y="0.5" width="999" height="5" rx="2" fill="#EA6A0A"/><rect x="36" y="24" width="93.38463999999999" height="22" rx="11" fill="#FFF4E8" stroke="#F59E4B"/><text x="82.69232" y="39.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">C13-M02-F2</text><text x="143.4" y="42.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Which key protects which ticket</text><g transform="translate(0,68)"><text x="101.0" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">TICKET</text><text x="216.0" y="16.0" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="start">ENCRYPTED WITH</text><rect x="36" y="28" width="928" height="48.125" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="44" y="36" width="122" height="32.125" rx="8" fill="#1F2937" stroke="#111827"/><text x="105.0" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">TGT</text><line x1="174.0" y1="52.1" x2="204.0" y2="52.1" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="212" y="37.0625" width="234.087" height="30" rx="15" fill="#FFFFFF" stroke="#111827"/><text x="329.0" y="57.1" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">krbtgt account key: the crown jewel</text><rect x="36" y="84.125" width="928" height="48.125" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="44" y="92.125" width="122" height="32.125" rx="8" fill="#FFF4E8" stroke="#F59E4B"/><text x="105.0" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" fill="#7A3A06" text-anchor="middle">Service ticket</text><line x1="174.0" y1="108.2" x2="204.0" y2="108.2" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="212" y="93.1875" width="309.13349999999997" height="30" rx="15" fill="#FFFFFF" stroke="#F59E4B"/><text x="366.6" y="113.2" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#0F172A" text-anchor="middle">Service account key: keep it long, random, AES</text><rect x="36" y="150.25" width="928" height="36.225" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="36" y="150.25" width="4" height="36.225" rx="2" fill="#EA6A0A"/><text x="56.0" y="170.8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" fill="#475569" text-anchor="start">Consequences: know the krbtgt key and you can forge any TGT (golden ticket); any TGT can request any SPN’s ticket (roasting).</text></g><text x="964" y="287" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">RedKross Academy</text></svg>